            const req = tx.objectStore(BG_ORIG_STORE).get(BG_ORIG_KEY);
            req.onsuccess = () => {
              const val = typeof req.result === 'string' && DATA_IMAGE_RE.test(req.result) ? req.result : null;
              db.close();
              resolve(val ?? originalBgFallback);
            };
            req.onerror = () => {
              db.close();
              resolve(originalBgFallback);
            };
          } catch {
            try { db.close(); } catch {}
            resolve(originalBgFallback);
          }
        });
      }

      async function writeOriginalBg(dataUrl) {
        const value = typeof dataUrl === 'string' && DATA_IMAGE_RE.test(dataUrl) ? dataUrl : null;
        originalBgFallback = null;
        const db = await openBgDb();
        if (!db) {
          originalBgFallback = value;
          return false;
        }
        return new Promise(resolve => {
          const fail = () => {
            originalBgFallback = value;
            try { db.close(); } catch {}
            resolve(false);
          };
          try {
            const tx = db.transaction(BG_ORIG_STORE, 'readwrite');
            const store = tx.objectStore(BG_ORIG_STORE);
            if (value) store.put(value, BG_ORIG_KEY);
            else store.delete(BG_ORIG_KEY);
            tx.oncomplete = () => { db.close(); resolve(true); };
            tx.onerror = fail;
            tx.onabort = fail;
          } catch {
            fail();
          }
        });
      }

      const clampInt = (value, min, max, fallback) => {
        const num = Number(value);
        return Number.isFinite(num) ? Math.min(max, Math.max(min, Math.round(num))) : fallback;
      };

      function bgViewportSize() {
        const w = bgLayer.clientWidth || document.documentElement.clientWidth || window.innerWidth || 1;
        const h = bgLayer.clientHeight || document.documentElement.clientHeight || window.innerHeight || 1;
        return { w, h };
      }

      function clearBgImgInlineLayout() {
        bgImg.style.left = '';
        bgImg.style.top = '';
        bgImg.style.width = '';
        bgImg.style.height = '';
        bgImg.style.objectFit = '';
      }

      function computeBgLayout(transform, imgW, imgH) {
        const { w: W, h: H } = bgViewportSize();
        const hasDims = imgW > 0 && imgH > 0;
        const natW = hasDims ? imgW : W;
        const natH = hasDims ? imgH : H;
        const scale = clampInt(transform?.scale, 50, 300, DEFAULT_BG_TRANSFORM.scale);
        const coverScale = Math.max(W / natW, H / natH);
        const dispW = natW * coverScale * (scale / 100);
        const dispH = natH * coverScale * (scale / 100);
        const rawX = typeof transform?.x === 'number' && Number.isFinite(transform.x) ? transform.x : 0;
        const rawY = typeof transform?.y === 'number' && Number.isFinite(transform.y) ? transform.y : 0;
        const boundX = Math.abs(W - dispW) / (2 * dispW) * 100;
        const boundY = Math.abs(H - dispH) / (2 * dispH) * 100;
        const x = hasDims ? Math.min(boundX, Math.max(-boundX, rawX)) : rawX;
        const y = hasDims ? Math.min(boundY, Math.max(-boundY, rawY)) : rawY;
        const left = W / 2 - dispW / 2 + (x / 100) * dispW;
        const top = H / 2 - dispH / 2 + (y / 100) * dispH;
        return { W, H, imgW: natW, imgH: natH, hasDims, scale, x, y, dispW, dispH, left, top };
      }

      function loadTransform() {
        try {
          const parsed = JSON.parse(readStore(BG_TRANSFORM_KEY) || 'null');
          return {
            scale: clampInt(parsed?.scale, 50, 300, DEFAULT_BG_TRANSFORM.scale),
            x: typeof parsed?.x === 'number' && Number.isFinite(parsed.x) ? parsed.x : 0,
            y: typeof parsed?.y === 'number' && Number.isFinite(parsed.y) ? parsed.y : 0,
            baked: parsed?.baked === true
          };
        } catch {
          return { ...DEFAULT_BG_TRANSFORM };
        }
      }

      function applyBackgroundTransform(next, persist = false) {
        const baked = next?.baked === true;
        if (baked && bgEditor.hidden) {
          bgTransform = {
            scale: clampInt(next?.scale, 50, 300, DEFAULT_BG_TRANSFORM.scale),
            x: typeof next?.x === 'number' && Number.isFinite(next.x) ? next.x : 0,
            y: typeof next?.y === 'number' && Number.isFinite(next.y) ? next.y : 0,
            baked: true
          };
          clearBgImgInlineLayout();
        } else {
          const imgW = activeImgSize.w || bgImg.naturalWidth || 0;
          const imgH = activeImgSize.h || bgImg.naturalHeight || 0;
          const layout = computeBgLayout(next, imgW, imgH);
          bgTransform = { scale: layout.scale, x: layout.x, y: layout.y, baked };
          if (layout.hasDims) {
            bgImg.style.left = `${layout.left}px`;
            bgImg.style.top = `${layout.top}px`;
            bgImg.style.width = `${layout.dispW}px`;
            bgImg.style.height = `${layout.dispH}px`;
            bgImg.style.objectFit = 'fill';
          } else {
            clearBgImgInlineLayout();
          }
        }
        bgEditorZoomValue.textContent = `${bgTransform.scale}%`;
        bgEditorZoomOut.disabled = bgTransform.scale <= 50;
        bgEditorZoomIn.disabled = bgTransform.scale >= 300;
        bgEditorResetPos.disabled = bgTransform.scale === DEFAULT_BG_TRANSFORM.scale &&
          Math.abs(bgTransform.x) < 0.01 && Math.abs(bgTransform.y) < 0.01;
        if (persist) writeStore(BG_TRANSFORM_KEY, JSON.stringify(bgTransform));
      }

      function showBgError(key) {
        bgError.hidden = !key;
        bgError.textContent = key ? t(key) : '';
      }

      function applyBackgroundImage(dataUrl) {
        const valid = typeof dataUrl === 'string' && DATA_IMAGE_RE.test(dataUrl);
        hasBgImage = valid;
        croppedBgUrl = valid ? dataUrl : '';
        bgLayer.hidden = !valid;
        if (valid) {
          if (bgImg.getAttribute('src') !== dataUrl) {
            activeImgSize = { w: 0, h: 0 };
            bgImg.src = dataUrl;
          } else {
            activeImgSize = { w: bgImg.naturalWidth || 0, h: bgImg.naturalHeight || 0 };
          }
        } else {
          activeImgSize = { w: 0, h: 0 };
          bgImg.removeAttribute('src');
          clearBgImgInlineLayout();
        }
        bgEdit.hidden = !valid;
        bgReset.hidden = !valid;
        if (valid) applyBackgroundTransform(bgTransform, false);
      }

      function resolveImageMime(file) {
        const rawType = typeof file?.type === 'string' ? file.type.split(';')[0].trim().toLowerCase() : '';
        if (ALLOWED_MIMES.has(rawType)) return rawType;
        const ext = typeof file?.name === 'string' ? file.name.split('.').pop()?.toLowerCase() : '';
        return ext && Object.hasOwn(MIME_BY_EXT, ext) ? MIME_BY_EXT[ext] : null;
      }

      function extractDataUrlMime(dataUrl) {
        const match = typeof dataUrl === 'string' ? /^data:(image\/[a-z0-9+.-]+);base64,/i.exec(dataUrl) : null;
        return match ? match[1].toLowerCase() : '';
      }

      function readAsDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
          reader.onerror = () => reject(new Error('read_failed'));
          reader.readAsDataURL(blob);
        });
      }

      function loadImageElement(dataUrl) {
        return new Promise(resolve => {
          const img = new Image();
          img.addEventListener('load', () => resolve(img), { once: true });
          img.addEventListener('error', () => resolve(null), { once: true });
          img.src = dataUrl;
        });
      }

      async function saveCroppedBgToStore(sourceUrl, transform, sourceMime) {
        const img = await loadImageElement(sourceUrl);
        if (!img || !img.naturalWidth || !img.naturalHeight) return null;
        const layout = computeBgLayout(transform, img.naturalWidth, img.naturalHeight);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const maxDim = 1600;
        const outScale = Math.min(dpr, maxDim / Math.max(layout.W, layout.H, 1));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(layout.W * outScale));
        canvas.height = Math.max(1, Math.round(layout.H * outScale));
        const ctx = canvas.getContext('2d');
        if (!ctx) return null;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(
          img,
          layout.left * outScale,
          layout.top * outScale,
          layout.dispW * outScale,
          layout.dispH * outScale
        );
        const hasMargins = layout.left > 0.5 || layout.top > 0.5 ||
          layout.left + layout.dispW < layout.W - 0.5 ||
          layout.top + layout.dispH < layout.H - 0.5;
        const candidates = [];
        if (!hasMargins && sourceMime === 'image/jpeg') {
          candidates.push(['image/jpeg', 0.92], ['image/jpeg', 0.82], ['image/jpeg', 0.72]);
        } else if (sourceMime === 'image/webp') {
          candidates.push(['image/webp', 0.92], ['image/webp', 0.82], ['image/webp', 0.72]);
        } else if (sourceMime === 'image/png') {
          candidates.push(['image/png', undefined], ['image/webp', 0.92], ['image/webp', 0.82]);
          if (!hasMargins) candidates.push(['image/jpeg', 0.85]);
        } else {
          candidates.push(['image/webp', 0.92], ['image/png', undefined]);
          if (!hasMargins) candidates.push(['image/jpeg', 0.85]);
        }
        let oversizedUrl = null;
        for (const [mime, quality] of candidates) {
          try {
            const url = quality === undefined ? canvas.toDataURL(mime) : canvas.toDataURL(mime, quality);
            if (!DATA_IMAGE_RE.test(url)) continue;
            if (url.length <= MAX_STORED_BG_CHARS) {
              if (writeStore(BG_IMAGE_KEY, url)) return url;
            } else if (!oversizedUrl) {
              oversizedUrl = url;
            }
          } catch {}
        }
        if (oversizedUrl && writeStore(BG_IMAGE_KEY, oversizedUrl)) return oversizedUrl;
        return null;
      }

      bgTransform = loadTransform();
      applyBackgroundImage(readStore(BG_IMAGE_KEY));

      function updateFontReset() {
        fontColorReset.disabled = !colorInputs.some(entry => entry.group === 'font' && entry.custom);
      }

      function applyTextColor(entry, value, persist = false) {
        const valid = typeof value === 'string' && HEX_COLOR_RE.test(value);
        entry.custom = valid;
        if (valid) entry.apply(value);
        else entry.clear();
        entry.input.value = valid ? value.toLowerCase() : entry.fallback();
        if (entry.reset) entry.reset.hidden = !valid;
        if (persist) writeStore(entry.key, valid ? value.toLowerCase() : null);
        updateFontReset();
      }

      for (const entry of colorInputs) {
        applyTextColor(entry, readStore(entry.key), false);
        entry.input.addEventListener('input', () => applyTextColor(entry, entry.input.value, false));
        entry.input.addEventListener('change', () => applyTextColor(entry, entry.input.value, true));
        entry.reset?.addEventListener('click', () => applyTextColor(entry, null, true));
      }
      fontColorReset.addEventListener('click', () => {
        for (const entry of colorInputs) {
          if (entry.group === 'font') applyTextColor(entry, null, true);
        }
      });

      const themeObserver = new MutationObserver(() => {
        for (const entry of colorInputs) {
          if (!entry.custom) entry.input.value = entry.fallback();
        }
        if (!cardCustomColor) cardColorInput.value = cardColorFallback();
      });
      themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

      const cardColorInput = byId('settings-card-color');
      const cardOpacityInput = byId('settings-card-opacity');
      const cardOpacityValue = byId('settings-card-opacity-value');
      const cardReset = byId('settings-card-reset');
      const cardColorFallback = () => document.documentElement.classList.contains('dark') ? '#262628' : '#ffffff';
      let cardCustomColor = false;
      let cardOpacity = 100;

      function applyCardStyle({ color, opacity }, persist = false) {
        const root = document.documentElement.style;
        const validColor = typeof color === 'string' && HEX_COLOR_RE.test(color);
        cardCustomColor = validColor;
        if (validColor) root.setProperty('--record-card-bg', color.toLowerCase());
        else root.removeProperty('--record-card-bg');
        cardColorInput.value = validColor ? color.toLowerCase() : cardColorFallback();

        cardOpacity = clampInt(opacity, 0, 100, 100);
        if (cardOpacity < 100) {
          root.setProperty('--record-card-opacity', `${cardOpacity}%`);
          root.setProperty('--record-card-blur', 'blur(8px)');
        } else {
          root.removeProperty('--record-card-opacity');
          root.removeProperty('--record-card-blur');
        }
        cardOpacityInput.value = String(cardOpacity);
        cardOpacityValue.textContent = `${cardOpacity}%`;
        cardReset.disabled = !cardCustomColor && cardOpacity === 100;

        if (persist) {
          writeStore(CARD_COLOR_KEY, validColor ? color.toLowerCase() : null);
          writeStore(CARD_OPACITY_KEY, cardOpacity < 100 ? String(cardOpacity) : null);
        }
      }

      applyCardStyle({
        color: readStore(CARD_COLOR_KEY),
        opacity: readStore(CARD_OPACITY_KEY) ?? 100
      }, false);

      cardColorInput.addEventListener('input', () => applyCardStyle({
        color: cardColorInput.value, opacity: cardOpacity
      }, false));
      cardColorInput.addEventListener('change', () => applyCardStyle({
        color: cardColorInput.value, opacity: cardOpacity
      }, true));
      cardOpacityInput.addEventListener('input', () => applyCardStyle({
        color: cardCustomColor ? cardColorInput.value : null, opacity: cardOpacityInput.value
      }, false));
      cardOpacityInput.addEventListener('change', () => applyCardStyle({
        color: cardCustomColor ? cardColorInput.value : null, opacity: cardOpacityInput.value
      }, true));
      cardReset.addEventListener('click', () => applyCardStyle({ color: null, opacity: 100 }, true));

      const STAR_RATIO_KEY = 'tps:panel-star-ratio';
      const STAR_SPEED_KEY = 'tps:panel-star-speed';
      const starRatioInput = byId('settings-star-ratio');
      const starRatioValue = byId('settings-star-ratio-value');
      const starSpeedInput = byId('settings-star-speed');
      const starSpeedValue = byId('settings-star-speed-value');
      const starReset = byId('settings-star-reset');
      let starRatio = 100;
      let starSpeed = 1;

      function applyStarTwinkle({ ratio, speed }, persist = false) {
        starRatio = Math.round(clampInt(ratio, 0, 100, 100) / 10) * 10;
        const rawSpeed = Number(speed);
        starSpeed = Number.isFinite(rawSpeed) ? Math.round(Math.min(2, Math.max(0, rawSpeed)) * 10) / 10 : 1;
        const root = document.documentElement;
        // Speed 0 turns twinkling off, so every star stays still.
        root.dataset.starRatio = String(starSpeed === 0 ? 0 : starRatio);
        if (starSpeed === 1 || starSpeed === 0) root.style.removeProperty('--star-speed');
        else root.style.setProperty('--star-speed', String(starSpeed));
        starRatioInput.value = String(starRatio);
        starRatioValue.textContent = `${starRatio}%`;
        starSpeedInput.value = String(starSpeed);
        starSpeedValue.textContent = `${starSpeed.toFixed(1)}×`;
        starReset.disabled = starRatio === 100 && starSpeed === 1;
        if (persist) {
          writeStore(STAR_RATIO_KEY, starRatio === 100 ? null : String(starRatio));
          writeStore(STAR_SPEED_KEY, starSpeed === 1 ? null : String(starSpeed));
        }
        document.dispatchEvent(new Event('tps-star-twinkle-changed'));
      }

      applyStarTwinkle({
        ratio: readStore(STAR_RATIO_KEY) ?? 100,
        speed: readStore(STAR_SPEED_KEY) ?? 1
      }, false);
      starRatioInput.addEventListener('input', () => applyStarTwinkle({ ratio: starRatioInput.value, speed: starSpeed }, false));
      starRatioInput.addEventListener('change', () => applyStarTwinkle({ ratio: starRatioInput.value, speed: starSpeed }, true));
      starSpeedInput.addEventListener('input', () => applyStarTwinkle({ ratio: starRatio, speed: starSpeedInput.value }, false));
      starSpeedInput.addEventListener('change', () => applyStarTwinkle({ ratio: starRatio, speed: starSpeedInput.value }, true));
      starReset.addEventListener('click', () => applyStarTwinkle({ ratio: 100, speed: 1 }, true));

      const HARNESS_INTERVAL_KEY = 'tps:panel-harness-interval';
      const harnessIntervalInput = byId('settings-harness-interval');
      const harnessIntervalValue = byId('settings-harness-interval-value');
      const harnessReset = byId('settings-harness-reset');
      let harnessInterval = 5;

      function applyHarnessInterval(value, persist = false) {
        harnessInterval = clampInt(value, 0, 10, 5);
        document.documentElement.dataset.harnessInterval = String(harnessInterval);
        harnessIntervalInput.value = String(harnessInterval);
        harnessIntervalValue.textContent = `${harnessInterval}s`;
        harnessReset.disabled = harnessInterval === 5;
        if (persist) writeStore(HARNESS_INTERVAL_KEY, harnessInterval === 5 ? null : String(harnessInterval));
        document.dispatchEvent(new Event('tps-harness-interval-changed'));
      }

      applyHarnessInterval(readStore(HARNESS_INTERVAL_KEY) ?? 5, false);
      harnessIntervalInput.addEventListener('input', () => applyHarnessInterval(harnessIntervalInput.value, false));
      harnessIntervalInput.addEventListener('change', () => applyHarnessInterval(harnessIntervalInput.value, true));
      harnessReset.addEventListener('click', () => applyHarnessInterval(5, true));

      function setOpen(open, restoreFocus = false) {
        dialog.hidden = !open;
        toggle.setAttribute('aria-expanded', String(open));
        if (open) {
          showBgError('');
          closeButton.focus();
        } else if (restoreFocus) {
          toggle.focus();
        }
      }

      async function openEditor() {
        if (!hasBgImage || editorBusy || !bgEditor.hidden) return;
        editorBusy = true;
        try {
          const savedCropped = readStore(BG_IMAGE_KEY);
          if (!savedCropped || !DATA_IMAGE_RE.test(savedCropped)) return;
          croppedBgUrl = savedCropped;
          const origUrl = await readOriginalBg();
          if (lifetime.signal.aborted) return;
          const useOriginal = Boolean(origUrl && DATA_IMAGE_RE.test(origUrl));
          const sourceUrl = useOriginal ? origUrl : croppedBgUrl;
          const loaded = await loadImageElement(sourceUrl);
          if (lifetime.signal.aborted || !loaded) return;

          beforeEdit = { ...bgTransform };
          editingOriginal = useOriginal;
          editingSourceUrl = sourceUrl;
          activeImgSize = { w: loaded.naturalWidth || 0, h: loaded.naturalHeight || 0 };

          const startTransform = !useOriginal && bgTransform.baked
            ? { scale: 100, x: 0, y: 0, baked: false }
            : { ...bgTransform, baked: false };

          if (bgImg.getAttribute('src') !== sourceUrl) bgImg.src = sourceUrl;
          setOpen(false, false);
          panelMain.hidden = true;
          document.body.classList.add('is-bg-editing');
          bgEditor.hidden = false;
          applyBackgroundTransform(startTransform, false);
          bgEditorSave.focus();
        } finally {
          editorBusy = false;
        }
      }

      async function closeEditor(save) {
        if (bgEditor.hidden || editorBusy) return;
        dragState = null;
        bgEditor.classList.remove('is-dragging');
        if (!save) {
          bgTransform = beforeEdit ? { ...beforeEdit } : { ...DEFAULT_BG_TRANSFORM };
          beforeEdit = null;
          editingOriginal = false;
          editingSourceUrl = '';
          bgEditor.hidden = true;
          document.body.classList.remove('is-bg-editing');
          panelMain.hidden = false;
          applyBackgroundImage(croppedBgUrl);
          toggle.focus();
          return;
        }

        editorBusy = true;
        bgEditorSave.disabled = true;
        try {
          const sourceUrl = editingSourceUrl || croppedBgUrl;
          const sourceMime = extractDataUrlMime(sourceUrl);
          let nextUrl = sourceUrl;
          let nextTransform;
          if (RASTER_CROP_MIMES.has(sourceMime)) {
            const savedCropped = await saveCroppedBgToStore(sourceUrl, bgTransform, sourceMime);
            if (!savedCropped) {
              bgTransform = beforeEdit ? { ...beforeEdit } : { ...DEFAULT_BG_TRANSFORM };
              beforeEdit = null;
              editingOriginal = false;
              editingSourceUrl = '';
              bgEditor.hidden = true;
              document.body.classList.remove('is-bg-editing');
              panelMain.hidden = false;
              applyBackgroundImage(croppedBgUrl);
              setOpen(true, false);
              showBgError('settings-bg-error-save');
              return;
            }
            nextUrl = savedCropped;
            nextTransform = editingOriginal
              ? { scale: bgTransform.scale, x: bgTransform.x, y: bgTransform.y, baked: true }
              : { scale: 100, x: 0, y: 0, baked: true };
          } else {
            if (!writeStore(BG_IMAGE_KEY, sourceUrl)) {
              bgTransform = beforeEdit ? { ...beforeEdit } : { ...DEFAULT_BG_TRANSFORM };
              beforeEdit = null;
              editingOriginal = false;
              editingSourceUrl = '';
              bgEditor.hidden = true;
              document.body.classList.remove('is-bg-editing');
              panelMain.hidden = false;
              applyBackgroundImage(croppedBgUrl);
              setOpen(true, false);
              showBgError('settings-bg-error-save');
              return;
            }
            nextTransform = { scale: bgTransform.scale, x: bgTransform.x, y: bgTransform.y, baked: false };
          }

          beforeEdit = null;
          editingOriginal = false;
          editingSourceUrl = '';
          bgEditor.hidden = true;
          document.body.classList.remove('is-bg-editing');
          panelMain.hidden = false;
          bgTransform = nextTransform;
          writeStore(BG_TRANSFORM_KEY, JSON.stringify(bgTransform));
          applyBackgroundImage(nextUrl);
          toggle.focus();
        } finally {
          editorBusy = false;
          bgEditorSave.disabled = false;
        }
      }

      toggle.addEventListener('click', () => setOpen(dialog.hidden, !dialog.hidden));
      closeButton.addEventListener('click', () => setOpen(false, true));
      dialog.addEventListener('click', event => {
        if (event.target === dialog) setOpen(false, true);
      });
      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        if (!bgEditor.hidden) {
          event.preventDefault();
          void closeEditor(false);
        } else if (!dialog.hidden) {
          event.preventDefault();
          setOpen(false, true);
        }
      }, { signal: lifetime.signal });

      bgUpload.addEventListener('click', () => bgInput.click());
      bgEdit.addEventListener('click', () => void openEditor());
      bgReset.addEventListener('click', () => {
        showBgError('');
        writeStore(BG_IMAGE_KEY, null);
        writeStore(BG_TRANSFORM_KEY, null);
        void writeOriginalBg(null);
        bgTransform = { ...DEFAULT_BG_TRANSFORM };
        applyBackgroundTransform(bgTransform, false);
        applyBackgroundImage('');
      });

      bgEditorBar.addEventListener('pointerdown', event => event.stopPropagation());
      bgEditorZoomOut.addEventListener('click', () => applyBackgroundTransform({ ...bgTransform, scale: bgTransform.scale - 10 }, false));
      bgEditorZoomIn.addEventListener('click', () => applyBackgroundTransform({ ...bgTransform, scale: bgTransform.scale + 10 }, false));
      bgEditorResetPos.addEventListener('click', () => applyBackgroundTransform({ ...bgTransform, scale: DEFAULT_BG_TRANSFORM.scale, x: 0, y: 0 }, false));
      bgEditorCancel.addEventListener('click', () => void closeEditor(false));
      bgEditorSave.addEventListener('click', () => void closeEditor(true));

      bgEditor.addEventListener('pointerdown', event => {
        if (!hasBgImage || bgEditor.hidden || editorBusy || (event.pointerType === 'mouse' && event.button !== 0)) return;
        if (bgEditorBar.contains(event.target)) return;
        const imgW = activeImgSize.w || bgImg.naturalWidth || 0;
        const imgH = activeImgSize.h || bgImg.naturalHeight || 0;
        const layout = computeBgLayout(bgTransform, imgW, imgH);
        if (!layout.dispW || !layout.dispH) return;
        dragState = {
          pointerId: event.pointerId,
          lastClientX: event.clientX,
          lastClientY: event.clientY,
          dispW: layout.dispW,
          dispH: layout.dispH
        };
        bgEditor.classList.add('is-dragging');
        bgEditor.setPointerCapture?.(event.pointerId);
      });
      bgEditor.addEventListener('pointermove', event => {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        const dx = ((event.clientX - dragState.lastClientX) / dragState.dispW) * 100;
        const dy = ((event.clientY - dragState.lastClientY) / dragState.dispH) * 100;
        dragState.lastClientX = event.clientX;
        dragState.lastClientY = event.clientY;
        applyBackgroundTransform({
          ...bgTransform,
          x: bgTransform.x + dx,
          y: bgTransform.y + dy
        }, false);
      });
      function stopDrag(event) {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        if (bgEditor.hasPointerCapture?.(event.pointerId)) {
          bgEditor.releasePointerCapture(event.pointerId);
        }
        dragState = null;
        bgEditor.classList.remove('is-dragging');
      }
      bgEditor.addEventListener('pointerup', stopDrag);
      bgEditor.addEventListener('pointercancel', stopDrag);
      bgEditor.addEventListener('wheel', event => {
        if (!hasBgImage || bgEditor.hidden || editorBusy) return;
        event.preventDefault();
        const step = event.deltaY < 0 ? 5 : -5;
        applyBackgroundTransform({ ...bgTransform, scale: bgTransform.scale + step }, false);
      }, { passive: false });

      const bgResizeObserver = typeof ResizeObserver === 'function'
        ? new ResizeObserver(() => {
            if (hasBgImage && (!bgEditor.hidden || !bgTransform.baked)) {
              applyBackgroundTransform(bgTransform, false);
            }
          })
        : null;
      bgResizeObserver?.observe(bgLayer);
      bgImg.addEventListener('load', () => {
        if (!hasBgImage) return;
        activeImgSize = { w: bgImg.naturalWidth || 0, h: bgImg.naturalHeight || 0 };
        if (!bgEditor.hidden || !bgTransform.baked) applyBackgroundTransform(bgTransform, false);
      }, { signal: lifetime.signal });

      bgInput.addEventListener('change', async () => {
        const file = bgInput.files?.[0];
        bgInput.value = '';
        if (!file) return;
        showBgError('');
        const mime = resolveImageMime(file);
        if (!mime) return showBgError('settings-bg-error-type');
        if (file.size > MAX_BG_BYTES) return showBgError('settings-bg-error-size');
        try {
          const originalDataUrl = await readAsDataUrl(new Blob([await file.arrayBuffer()], { type: mime }));
          const loaded = DATA_IMAGE_RE.test(originalDataUrl) ? await loadImageElement(originalDataUrl) : null;
          if (!loaded) return showBgError('settings-bg-error-type');

          const isRaster = RASTER_CROP_MIMES.has(mime);
          const nextTransform = { scale: 100, x: 0, y: 0, baked: isRaster };
          let nextCroppedUrl = originalDataUrl;
          if (isRaster) {
            const savedCropped = await saveCroppedBgToStore(originalDataUrl, nextTransform, mime);
            if (!savedCropped) return showBgError('settings-bg-error-save');
            nextCroppedUrl = savedCropped;
          } else if (!writeStore(BG_IMAGE_KEY, originalDataUrl)) {
            return showBgError('settings-bg-error-save');
          }

          await writeOriginalBg(originalDataUrl);
          bgTransform = nextTransform;
          writeStore(BG_TRANSFORM_KEY, JSON.stringify(bgTransform));
          applyBackgroundImage(nextCroppedUrl);
        } catch {
          showBgError('settings-bg-error-type');
        }
      });

      for (const link of [byId('panel-repo-link'), byId('panel-star-link')]) {
        link?.addEventListener('click', event => {
          if (typeof window.orca?.shell?.openExternal !== 'function') return;
          event.preventDefault();
          void window.orca.shell.openExternal(link.href).catch(() => {});
        }, { signal: lifetime.signal });
      }

      let panelInView = true;
      function updateMotionPause() {
        const paused = document.hidden || !panelInView;
        if (document.documentElement.classList.contains('is-motion-paused') === paused) return;
        document.documentElement.classList.toggle('is-motion-paused', paused);
        document.dispatchEvent(new Event('tps-motion-changed'));
      }
      document.addEventListener('visibilitychange', updateMotionPause, { signal: lifetime.signal });
      const motionObserver = typeof IntersectionObserver === 'function'
        ? new IntersectionObserver(entries => {
            panelInView = entries.some(entry => entry.isIntersecting);
            updateMotionPause();
          })
        : null;
      motionObserver?.observe(document.documentElement);
      updateMotionPause();

      window.addEventListener('pagehide', () => {
        motionObserver?.disconnect();
        bgResizeObserver?.disconnect();
        themeObserver.disconnect();
        lifetime.abort();
      }, { once: true });
    })();
  </script>
</body>
</html>
