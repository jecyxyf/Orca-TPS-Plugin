<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TPS Plugin</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f2f2f7;
      --surface: #ffffff;
      --ink: #1c1c1e;
      --muted: #6d6d75;
      --line: #e5e5ea;
      --purple: #8f32d6;
      --blue: #0066e6;
      --ladder-own-rank: #8b5a05;
      --orange: #b45300;
      --green: #007f48;
      --usage-wave-low: #267456;
      --cache: #9c6500;
      --speed: #c72e3a;
      --speed-bg: #f0f0f3;
      --tag-bg: #ededf2;
      --heat-0: #ebedf0; --heat-1: #bfdbfe; --heat-2: #7fb6fb; --heat-3: #3b82e6; --heat-4: #1d4fb8;
      --proxy-bg: #e5f7ee;
      --button-bg: #e5f0ff;
      --warning-bg: #fff1dc;
      --error: #c8213a;
      --error-bg: #fff0f3;
      --shadow: 0 3px 12px rgb(39 43 72 / 3%);
    }
    html.dark {
      color-scheme: dark;
      --page: #161618;
      --surface: #262628;
      --ink: #f5f5f7;
      --muted: #b4b4be;
      --line: #3a3a3e;
      --purple: #d38aff;
      --blue: #64b0ff;
      --ladder-own-rank: #f0bf63;
      --orange: #ffb340;
      --green: #4ade80;
      --usage-wave-low: #60a589;
      --cache: #e8b65b;
      --speed: #ff6b72;
      --speed-bg: #303034;
      --tag-bg: #343439;
      --heat-0: #2a2a2e; --heat-1: #1e3a5f; --heat-2: #2e5f94; --heat-3: #4a8fd6; --heat-4: #8cc4ff;
      --proxy-bg: #193829;
      --button-bg: #163552;
      --warning-bg: #46321b;
      --error: #ff8fa5;
      --error-bg: #49232d;
      --shadow: 0 3px 12px rgb(0 0 0 / 6%);
    }
    * { box-sizing: border-box; }
    /* Set the reading direction on text leaves so flex and grid keep their order. */
    :where(html:lang(ar), html:lang(ur)) :is([data-i18n], [data-localized-text]) {
      direction: rtl;
      unicode-bidi: isolate;
      text-align: match-parent;
    }
    [hidden] { display: none !important; }
    html { min-width: 0; min-height: 100%; background: var(--page); }
    body {
      margin: 0;
      min-width: 0;
      padding: 16px;
      color: var(--ink);
      background: var(--page);
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 18px; line-height: 1.4; letter-spacing: -.3px; font-weight: 750; }
    .title-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
    .panel-brand { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .panel-title { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
    .panel-title-link {
      display: inline-flex; align-items: center; gap: 8px; min-width: 0;
      color: inherit; text-decoration: none; border-radius: 6px;
      transition: color .15s ease;
    }
    .panel-title-link:hover { color: var(--blue); }
    .panel-title-link:focus-visible, .panel-star-link:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 2px;
    }
    .panel-logo { flex: none; width: 32px; height: 32px; border-radius: 6px; object-fit: contain; }
    .panel-version { flex: none; color: var(--tab-unselected, var(--muted)); font-size: 12px; font-weight: 600; letter-spacing: 0; }
    .panel-star-link {
      display: inline-grid; place-items: center; flex: none;
      width: 24px; height: 24px; border-radius: 999px;
      color: #e09100; text-decoration: none;
      transition: background-color .15s ease, transform .15s ease;
    }
    html.dark .panel-star-link { color: #ffd147; }
    .panel-star-link:hover { background: rgb(245 183 0 / 16%); transform: scale(1.08); }
    .panel-star-svg { width: 18px; height: 18px; overflow: visible; }
    .panel-star-svg .star-core {
      fill: currentColor; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round;
      transform-box: fill-box; transform-origin: center;
      animation: star-pulse 2.8s ease-in-out infinite;
    }
    .panel-star-svg .star-spark {
      fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round;
      transform-box: fill-box; transform-origin: center;
      animation: star-sparkle 2.8s ease-in-out infinite;
    }
    .panel-star-svg .star-spark-b { animation-delay: 1.4s; }
    @keyframes star-pulse {
      0%, 60%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); }
      20% { transform: scale(1.14) rotate(-6deg); filter: drop-shadow(0 0 4px rgb(245 183 0 / 48%)); }
      38% { transform: scale(.98) rotate(3deg); }
    }
    @keyframes star-sparkle {
      0%, 100% { opacity: .25; transform: scale(.7); }
      35% { opacity: 1; transform: scale(1.1); }
      70% { opacity: .35; transform: scale(.8); }
    }
    .title-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex: 0 1 auto; min-width: 0; }
    .settings-toggle, .settings-close {
      display: inline-grid; place-items: center; flex: none;
      width: 32px; height: 32px; padding: 0;
      border: 0; border-radius: 8px;
      background: transparent; color: var(--icon-color, var(--muted)); cursor: pointer;
      transition: color .15s ease, background-color .15s ease;
    }
    .settings-toggle { color: var(--icon-color, var(--tab-unselected, var(--muted))); }
    .settings-toggle svg, .settings-close svg { width: 16px; height: 16px; transition: transform .22s ease; }
    .settings-toggle:hover, .settings-toggle[aria-expanded="true"], .settings-close:hover {
      background: rgb(128 128 128 / 14%); color: var(--ink);
    }
    .settings-toggle[aria-expanded="true"] svg { transform: scale(1.06); }
    .settings-toggle:focus-visible, .settings-close:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 2px;
    }
    .settings-backdrop {
      position: fixed; inset: 0; z-index: 20;
      display: grid; align-items: start; justify-items: center;
      padding: 16px; overflow-y: auto;
      background: rgb(18 18 22 / 34%);
      backdrop-filter: blur(4px);
    }
    html.dark .settings-backdrop { background: rgb(0 0 0 / 56%); }
    .settings-sheet {
      --surface: #262628;
      --speed-bg: #303034;
      --line: #3a3a3e;
      --ink: #ffffff;
      --muted: rgb(255 255 255 / 80%);
      --blue: #64b0ff;
      --error: #ff8fa5;
      --icon-color: #ffffff;
      color-scheme: dark;
      width: 100%; max-width: 420px; max-height: calc(100dvh - 32px);
      overflow-y: auto; scrollbar-width: thin;
      padding: 14px 16px 16px;
      border: 1px solid var(--line); border-radius: 20px;
      background: var(--surface); color: var(--ink);
      box-shadow: 0 12px 36px rgb(0 0 0 / 28%);
    }
    .settings-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding-bottom: 10px; border-bottom: 1px solid var(--line);
    }
    .settings-title { margin: 0; font-size: 15px; line-height: 1.4; font-weight: 750; color: var(--ink); }
    .settings-close { width: 28px; height: 28px; border-color: transparent; background: transparent; }
    .settings-body { display: grid; gap: 14px; margin-top: 12px; }
    .settings-section { display: grid; gap: 6px; min-width: 0; }
    .settings-label { margin: 0; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .02em; }
    .panel-bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .panel-bg-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; pointer-events: none; user-select: none;
      transform-origin: center center;
      transform: translate(var(--bg-x, 0%), var(--bg-y, 0%)) scale(var(--bg-scale, 1));
    }
    .panel-bg-layer::after {
      content: ""; position: absolute; inset: 0;
      background: rgb(242 242 247 / 42%);
      transition: opacity .15s ease;
    }
    html.dark .panel-bg-layer::after { background: rgb(22 22 24 / 52%); }
    body.is-bg-editing .panel-bg-layer::after { opacity: 0; }
    main#panel { position: relative; z-index: 1; }
    .settings-bg-card {
      display: grid; gap: 6px; padding: 11px 12px;
      border: 1px solid var(--line); border-radius: 14px; background: var(--speed-bg);
    }
    .settings-bg-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0;
    }
    .settings-bg-title {
      min-width: 0; margin: 0; color: var(--ink);
      font-size: 13px; font-weight: 700; overflow-wrap: anywhere;
    }
    .bg-editor {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
      padding: 16px; cursor: grab; touch-action: none; user-select: none;
    }
    .bg-editor.is-dragging { cursor: grabbing; }
    .bg-editor-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px;
      max-width: 100%; padding: 8px 10px;
      border: 1px solid rgb(255 255 255 / 22%); border-radius: 16px;
      background: rgb(24 24 28 / 78%); color: #f5f5f7;
      box-shadow: 0 8px 28px rgb(0 0 0 / 32%);
      backdrop-filter: blur(10px);
      cursor: default;
    }
    .bg-editor-hint {
      flex-basis: 100%; margin: 0; text-align: center;
      font-size: 11px; color: rgb(245 245 247 / 82%);
    }
    .bg-editor-zoom {
      min-width: 4.2ch; text-align: center;
      font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .bg-editor-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 30px; padding: 5px 10px; border: 0; border-radius: 9px;
      background: rgb(255 255 255 / 15%); color: #f5f5f7;
      font-size: 12px; font-weight: 650; cursor: pointer;
    }
    .bg-editor-btn:hover:not(:disabled) { background: rgb(255 255 255 / 25%); }
    .bg-editor-btn:disabled { opacity: .45; cursor: default; }
    .bg-editor-btn-primary { background: #0066e6; color: #fff; }
    .bg-editor-btn-primary:hover:not(:disabled) { background: #0066e6; filter: brightness(1.08); }
    .bg-editor-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .settings-bg-actions { display: flex; flex: none; align-items: center; gap: 4px; }
    .settings-bg-btn {
      display: inline-grid; place-items: center; flex: none;
      width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px;
      background: transparent; color: var(--icon-color, var(--muted)); cursor: pointer;
      transition: color .15s ease, background-color .15s ease;
    }
    .settings-bg-btn svg { width: 16px; height: 16px; }
    .settings-bg-btn:hover:not(:disabled) { background: rgb(128 128 128 / 14%); color: var(--ink); }
    .settings-bg-btn:disabled { opacity: .5; cursor: default; }
    .settings-bg-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .settings-bg-hint, .settings-bg-error { margin: 0; font-size: 11px; overflow-wrap: anywhere; }
    .settings-bg-hint { color: var(--muted); }
    .settings-bg-error { color: var(--error); }
    .settings-color-card .settings-bg-row { flex-wrap: wrap; gap: 8px 10px; }
    .settings-color-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 6px 12px; min-width: 0;
    }
    .settings-color-item {
      display: inline-flex; align-items: center; gap: 5px; min-width: 0;
    }
    .settings-color-label {
      min-width: 0; margin: 0; color: var(--muted);
      font-size: 12px; font-weight: 600; overflow-wrap: anywhere;
    }
    .settings-color-input {
      width: 32px; height: 32px; padding: 3px;
      border: 1px solid var(--line); border-radius: 8px;
      background: transparent; cursor: pointer;
    }
    .settings-color-input::-webkit-color-swatch-wrapper { padding: 0; }
    .settings-color-input::-webkit-color-swatch { border: 0; border-radius: 5px; }
    .settings-color-input::-moz-color-swatch { border: 0; border-radius: 5px; }
    .settings-color-input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .settings-card-opacity-row {
      display: grid; grid-template-columns: auto minmax(0, 1fr) 3.2em;
      align-items: center; gap: 8px; margin-top: 2px;
    }
    .settings-card-range { width: 100%; min-width: 0; margin: 0; accent-color: var(--blue); cursor: pointer; }
    .settings-card-range:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .settings-color-value {
      text-align: end; font-size: 11px; font-weight: 600;
      font-variant-numeric: tabular-nums; color: var(--ink);
    }
    .language-picker {
      position: relative; flex: 0 1 140px; min-width: 0;
      --ink: #1c1c1e; --muted: #6d6d75; --blue: #0066e6;
    }
    html.dark .language-picker {
      --ink: #ffffff; --muted: #b4b4be; --blue: #64b0ff;
    }
    .language-toggle, .language-option {
      display: flex; align-items: center; gap: 7px; min-width: 0; min-height: 32px;
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--ink); cursor: pointer;
    }
    .language-toggle { width: 100%; }
    .language-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .language-toggle .language-name { flex: 1; min-width: 0; text-align: start; }
    .language-flag { flex: none; width: 20px; height: 14px; object-fit: contain; }
    .language-toggle svg { flex: none; width: 12px; height: 12px; color: var(--icon-color, var(--muted)); }
    .language-menu {
      position: absolute; z-index: 4; top: calc(100% + 5px); right: 0;
      width: min(216px, calc(100vw - 32px)); padding: 6px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--surface); box-shadow: 0 5px 18px rgb(0 0 0 / 15%);
    }
    .language-search {
      width: 100%; padding: 6px 8px; margin-bottom: 4px;
      border: 1px solid var(--line); border-radius: 6px;
      font: inherit; color: var(--ink); background: var(--page);
    }
    .language-toggle:focus-visible, .language-option:focus-visible, .language-search:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 1px;
    }
    .language-options { max-height: 238px; overflow-y: auto; }
    .language-option { width: 100%; border-color: transparent; text-align: start; }
    .language-option:hover, .language-option[aria-pressed="true"] { background: var(--button-bg); color: var(--blue); }
    .language-message { margin: 4px 6px; color: var(--muted); overflow-wrap: anywhere; }
    .current-updated {
      display: inline-flex; align-items: center; gap: 5px;
      margin: 0; color: var(--tab-unselected, var(--muted));
      font-size: 11px; font-variant-numeric: tabular-nums;
    }
    .current-updated-icon {
      display: inline-grid; place-items: center; flex: none;
      width: 14px; height: 14px;
      color: var(--icon-color, var(--tab-unselected, var(--muted)));
    }
    .current-updated-icon svg { width: 14px; height: 14px; transform-origin: center; }
    .current-updated-icon.is-spinning svg { animation: spin-once .6s cubic-bezier(.22, 1, .36, 1); }
    @keyframes spin-once { to { transform: rotate(360deg); } }
    .refresh {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      flex-shrink: 0; min-height: 34px; padding: 7px 11px; border: 0; border-radius: 13px;
      background: var(--button-bg); color: var(--blue); font-size: 12px; font-weight: 650; cursor: pointer;
    }
    .refresh svg { width: 14px; height: 14px; flex-shrink: 0; }
    .refresh:hover:not(:disabled) { filter: brightness(.96); }
    .refresh:active:not(:disabled) { transform: translateY(1px); }
    .refresh:disabled { cursor: default; opacity: .6; }
    .refresh:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .panel-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 10px; border-bottom: 1px solid var(--line); }
    .panel-tab { min-width: 0; padding: 8px 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--tab-unselected, var(--muted)); font-weight: 650; cursor: pointer; }
    .panel-tab[aria-selected="true"] { border-bottom-color: var(--tab-selected, var(--blue)); color: var(--tab-selected, var(--blue)); }
    .panel-tab:focus-visible, .panel-view:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .panel-view { margin-top: 12px; }
    #usage { display: grid; gap: 8px; }
    #panel:has(> :is(#usage, #current-data, #leaderboard):not([hidden])) {
      display: grid; grid-template: auto auto minmax(0, 1fr) / minmax(0, 1fr);
      block-size: calc(100dvh - 32px);
    }
    #current-data { display: grid; grid-template: auto minmax(96px, 1fr) / minmax(0, 1fr); min-block-size: 0; }
    #usage { grid-template: auto auto minmax(0, 1fr) / minmax(0, 1fr); min-block-size: 0; }
    .usage-breakdown {
      display: grid; grid-template-rows: repeat(2, minmax(112px, 1fr)) 180px; gap: 8px;
      min-inline-size: 0;
    }
    .usage-ranking, .heat { display: grid; min-inline-size: 0; }
    .usage-ranking { grid-template-rows: auto minmax(0, 1fr); }
    .usage-scroll, #current-scroll, .ladder-ranking-scroll { min-inline-size: 0; overflow-y: auto; scrollbar-width: thin; }
    #current-scroll { scrollbar-gutter: stable; padding-inline-end: 6px; }
    :is(.usage-scroll, #current-scroll, .ladder-ranking-scroll):focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
    .section-title { margin: 0; color: var(--ink); font-size: 13px; line-height: 1.6; font-weight: 700; }
    .usage-breakdown .section-title { font-size: 14px; font-weight: 750; line-height: 1.5; }
    .usage-ranking .section-title { padding-bottom: 4px; border-bottom: 1px solid var(--line); }
    .section-detail { margin: 0; color: var(--muted); font-size: 11px; }
    .ladder-card { padding: 12px 16px; }
    #leaderboard {
      --ladder-medal-size: 48px; --ladder-medal-scale: .85;
      display: flex; flex-direction: column; gap: 8px; min-block-size: 0;
    }
    #ladder-controls, .ladder-personal-data { flex: none; }
    #ladder-controls:has(#ladder-account:not([hidden])) { block-size: 62px; overflow-y: auto; scrollbar-width: thin; }
    .ladder-personal-data, .ladder-rank-card { scrollbar-width: thin; scrollbar-gutter: stable; }
    .ladder-personal-data { max-block-size: 208px; padding-block-end: 8px; overflow-y: auto; }
    .ladder-rank-card { display: flex; flex: 1; flex-direction: column; min-block-size: 224px; overflow: hidden; }
    #ladder-ranking-notice { overflow-y: auto; scrollbar-width: thin; }
    #ladder-ranking-content { display: flex; flex: 1; flex-direction: column; min-block-size: 0; }
    #ladder-ranking-content > :not(.ladder-ranking-scroll) { flex: none; }
    .ladder-ranking-scroll { flex: 1; min-block-size: 0; }
    .war-tabs.ladder-tabs { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 6px; }
    .ladder-tabs .war-tab { min-width: 0; padding-inline: 3px; font-size: 12px; overflow-wrap: anywhere; }
    html:lang(zh-CN) .ladder-tabs { grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, 1fr)); }
    .ladder-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
    .ladder-control { min-height: 36px; padding-inline: 12px; font-size: 13px; font-weight: 700; }
    .ladder-secondary { color: var(--muted); background: var(--tag-bg); }
    .ladder-note { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
    .ladder-notice p { margin: 0; }
    .ladder-notice p + p { margin-top: .6em; }
    .ladder-notice-title { color: var(--ink); }
    .ladder-toolbar {
      --ladder-toolbar-title-width: clamp(62px, 26vw, 106px);
      --ladder-toolbar-action-width: 40px;
      --ladder-toolbar-toggle-width: 28px;
      --ladder-toolbar-icon-size: 16px;
      --ladder-toolbar-label-size: 13px;
      --ladder-toolbar-gap: 3px;
      display: grid;
      grid-template-columns: minmax(0, var(--ladder-toolbar-title-width)) minmax(0, 1fr)
        var(--ladder-toolbar-action-width) max-content;
      grid-template-areas: "title . action last";
      align-items: center; column-gap: var(--ladder-toolbar-gap);
      font-variant-numeric: tabular-nums;
    }
    html:lang(zh-CN) .ladder-toolbar { --ladder-toolbar-title-width: 4em; }
    .ladder-upload-toolbar { margin-top: 8px; }
    .ladder-rank-toolbar {
      grid-template-areas: "title toggle action last";
    }
    .ladder-rank-toolbar.is-off {
      grid-template-columns: minmax(0, var(--ladder-toolbar-title-width)) var(--ladder-toolbar-toggle-width);
      grid-template-areas: "title toggle";
    }
    .ladder-rank-toolbar.is-off :is(.ladder-transfer, .ladder-toolbar-value) { display: none; }
    .ladder-toolbar .section-title { grid-area: title; font-size: var(--ladder-toolbar-label-size); }
    .ladder-toolbar .ladder-transfer { grid-area: action; }
    .ladder-rank-toggle {
      grid-area: toggle; justify-self: start; display: grid; place-items: center;
      width: var(--ladder-toolbar-toggle-width); height: 28px; padding: 0;
      border: 0; border-radius: 6px; background: transparent; cursor: pointer;
    }
    .ladder-rank-toggle:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .ladder-rank-toggle:disabled { cursor: default; opacity: .55; }
    .ladder-rank-toggle span {
      display: flex; align-items: center; width: 24px; height: 14px; padding: 1px;

    .war-stat-icon.tokens { color: var(--icon-color, var(--blue)); }
    .war-stat-icon.requests { color: var(--icon-color, var(--green)); }
    .war-stat-icon.speed-max { color: var(--icon-color, var(--speed)); }
    .war-value {
      min-width: 0; font-size: 16px; line-height: 1.2; font-weight: 750;
      letter-spacing: -.3px; font-variant-numeric: tabular-nums; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .war-value.tokens { color: var(--blue); }
    .war-value.requests { color: var(--green); }
    .war-value.speed-max { color: var(--speed); }
    .war-value small { margin-inline-start: 2px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 0; }
    .war-note { margin: 8px 0 0; color: var(--muted); font-size: 11px; }
    .war-note:empty, .war-note[hidden] { display: none; }
    .war-rows { margin: 6px 0 0; padding: 0; list-style: none; }
    .war-row { padding: 8px 2px 7px; border-top: 1px solid var(--line); }
    .war-row:first-child { border-top: 0; }
    .war-row-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .war-agent-icon {
      display: inline-grid; place-items: center; flex: none;
      width: 20px; height: 20px; color: var(--icon-color, var(--ink));
    }
    .war-agent-icon svg { width: 18px; height: 18px; display: block; }
    .war-model { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--purple); font-size: 13px; font-weight: 700; }
    .war-amount { flex-shrink: 0; color: var(--blue); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .war-track { height: 4px; margin: 6px 0 4px; border-radius: 2px; background: var(--tag-bg); overflow: hidden; }
    .war-fill { height: 100%; border-radius: 2px; background: var(--blue); }
    .war-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    #war-rows .war-meta { display: grid; grid-template-columns: 5.2em 6.2em 6.2em minmax(0, 1fr); gap: 2px 8px; }
    .war-meta-item { display: inline-flex; align-items: center; gap: 3px; min-width: 0; white-space: nowrap; }
    .war-meta-item span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .war-meta-item svg { width: 12px; height: 12px; flex: none; color: var(--icon-color, currentColor); }
    .war-meta-harness {
      display: inline-grid; place-items: center; flex: none;
      width: 15px; height: 15px; color: var(--icon-color, var(--ink));
    }
    .war-meta-harness svg { width: 14px; height: 14px; display: block; }
    .war-empty { margin: 10px 2px 2px; color: var(--muted); font-size: 12px; text-align: center; }
    .war-empty[hidden] { display: none; }
    .rank-index { flex-shrink: 0; min-width: 14px; color: var(--muted); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .rank-tps { flex-shrink: 0; padding: 3px 7px; border-radius: 10px; color: var(--speed); background: color-mix(in srgb, var(--speed-bg) var(--record-card-opacity, 100%), transparent); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    #speed .war-fill { background: var(--speed); }
    .heat { position: relative; grid-template-rows: minmax(0, 1fr); }
    .heat-scroll { direction: ltr; margin-top: 8px; padding-bottom: 4px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
    .heat-canvas { position: relative; width: max-content; }
    .heat-months { position: relative; height: 13px; color: var(--muted); font-size: 9px; }
    .heat-months span { position: absolute; top: 0; white-space: nowrap; }
    .heat-grid { display: grid; grid-template-rows: repeat(7, 8px); grid-auto-flow: column; grid-auto-columns: 8px; gap: 2px; }
    .heat-cell { width: 8px; height: 8px; border-radius: 2px; background: var(--heat-0); }
    .heat-cell.lv1 { background: var(--heat-1); }
    .heat-cell.lv2 { background: var(--heat-2); }
    .heat-cell.lv3 { background: var(--heat-3); }
    .heat-cell.lv4 { background: var(--heat-4); }
    .heat-cell.outside { visibility: hidden; }
    .heat-cell:hover { outline: 1px solid var(--blue); outline-offset: 0; }
    .heat-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 10px; }
    .heat-legend { display: inline-flex; align-items: center; gap: 3px; }
    .heat-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
    .heat-legend .lv0 { background: var(--heat-0); }
    .heat-legend .lv1 { background: var(--heat-1); }
    .heat-legend .lv2 { background: var(--heat-2); }
    .heat-legend .lv3 { background: var(--heat-3); }
    .heat-legend .lv4 { background: var(--heat-4); }
    .heat-tip { position: absolute; z-index: 5; max-width: min(240px, calc(100% - 8px)); padding: 5px 8px; border-radius: 8px; background: var(--ink); color: var(--surface); font-size: 11px; line-height: 1.4; pointer-events: none; transform: translate(-50%, -100%); box-shadow: var(--shadow); }
    .heat-tip[hidden] { display: none; }
    @media (max-width: 339px) {
      .metrics { gap: 6px; }
      .card-top { gap: 8px; }
      .model-icon { width: 34px; height: 34px; }
      .model-icon svg { width: 32px; height: 32px; }
      .model { font-size: 14px; }
      .speed { gap: 3px; }
      .speed-value { font-size: 17px; }
      .war, .heat, .ladder-card { padding-inline: 12px; }
      .ladder-mine { font-size: 22px; }
      .ladder-user-stat { grid-template-columns: minmax(0, .85fr) repeat(2, minmax(0, 1.4fr)); column-gap: 6px; }
      .ladder-user-stat dt { font-size: 12px; }
      .ladder-user-position { gap: 2px; }
      #leaderboard { --ladder-medal-scale: .7; }
      .ladder-user-rank, .ladder-user-tokens { font-size: 13px; }
      .ladder-toolbar {
        --ladder-toolbar-action-width: 36px;
        --ladder-toolbar-toggle-width: 24px;
      }
      .ladder-rows li { --ladder-row-gap: 6px; }
      .ladder-rows .ladder-speed-row { --ladder-row-gap: 4px; }
      .ladder-speed-row .ladder-rank { min-width: 2ch; font-size: 16px; }
      .ladder-speed-row .ladder-avatar { --ladder-row-avatar-size: 22px; }
      .war-totals { gap: 4px; }
      .war-stat { gap: 4px; }
      .war-value { font-size: 14px; }
      #war-rows .war-meta { grid-template-columns: 4.6em 5.6em 5.6em minmax(0, 1fr); gap: 2px 6px; }
      .ladder-total { padding-inline: 6px; font-size: 12px; }
      .ladder-speed-row .ladder-total { padding-inline: 4px; font-size: 11px; }
      .settings-sheet { padding: 12px; }
    }
    @media (max-width: 280px) {
      .title-bar { gap: 6px; }
      .panel-brand { gap: 2px; }
      .panel-title, .panel-title-link { gap: 4px; font-size: 15px; }
      .panel-logo { width: 24px; height: 24px; }
      .panel-version { font-size: 11px; }
      .panel-star-link { width: 20px; height: 20px; }
      .panel-star-svg { width: 15px; height: 15px; }
      .title-actions { gap: 4px; }
      .settings-toggle { width: 28px; height: 28px; }
      .language-toggle { column-gap: 3px; min-height: 28px; padding-inline: 4px; }
      .war-period-tabs { grid-template-columns: minmax(0, .85fr) repeat(2, minmax(0, 1fr)) minmax(0, 1.15fr); gap: 2px; }
      .war-period-tabs .war-tab { padding-inline: 1px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ladder-transfer[aria-busy="true"] .ladder-transfer-spinner, .current-updated-icon.is-spinning svg { animation: none; }
      .record-card.is-entering { animation: none; opacity: 1; }
      .card-aurora, .card-aurora::before, .card-aurora-glow, .card-star, .card-dust { animation: none; opacity: 0; }
      .refresh:active:not(:disabled) { transform: none; }
      .panel-title-link, .panel-star-link, .settings-toggle, .settings-toggle svg, .settings-close { transition: none; }
      .panel-star-link:hover { transform: none; }
      .panel-star-svg .star-core, .panel-star-svg .star-spark { animation: none; }
      .ladder-medal::before, .ladder-medal::after, .ladder-medal-emblem::before { animation: none; opacity: 0; }
    }
  </style>
</head>

        removed: 'score-removed', too_soon: 'upload-too-soon',
        upload_in_progress: 'upload-in-progress',
        locked: 'upload-locked',
        history_pending: 'preparing-upload-history', history_invalid: 'history-upload-invalid',
        new_day: 'new-ranking-day', usage_changed: 'usage-changed',
        usage_unready: 'usage-not-ready', invalid: 'upload-invalid',
        rate_limited: 'rate-limited'
      };
      const messageFor = code => Object.hasOwn(messages, code) ? t(messages[code]) : undefined;
      let session, pendingLogin, retryLogin, rankDays = 1, rankingMode = 'calendar';
      const cachedRankings = new Map();
      const RANK_REFRESH_MS = 10_000, RECENT_STATS_MS = 5 * 60_000, HOUR_MS = 3_600_000, DAY_MS = 24 * HOUR_MS;
      let rankingPending, rankWake, nextRankRefresh, rankingProblem, sessionPushVersion = 0, rankingSubscription;
      let uploadUnlockAt, uploadUnlockWake;
      let rankingAccess, rankingPreferenceSubscription, rankingPreferenceVersion = 0, rankingPreferenceFailed = false;
      let busy = false, restoringSession = false;
      let revision = 0, drawnRows = '', renderedDay = '', loginProblem = '', messageCode = '';
      let rankingNodes = new Map(), leaderboardFrame, nextRecentExpiry = Infinity;
      let animateToday = false, pulseDay = '', latestPulses = new Map();
      const usagePainters = new WeakMap();

      async function request(action, payload = {}, signal = lifetime.signal) {
        try {
          const result = await bridge.request('tps.leaderboard', { action, days: rankDays, ...payload }, { signal, timeoutMs: 30000 });
          if (result && typeof result === 'object') return result;
        } catch {}
        return { code: 'unavailable' };
      }

      // avatar-view:start
      // Shows the black hat icon until a GitHub avatar loads. A loaded avatar is reused for every
      // slot of that user and never requested again; a default avatar is requested once per new
      // slot, or again when the caller asks for a retry after a sync.
      function createAvatarView({ fallback, createImage, load, visible, Observer }) {
        const IMAGE_PATTERN = /^data:image\/(?:png|jpeg|webp|gif);base64,/;
        const images = new Map(), loading = new Map(), slots = new Set(), waiting = new Set();
        const keyOf = username => typeof username === 'string' ? username.toLowerCase() : '';
        const observer = Observer ? new Observer(entries => {
          for (const { target, isIntersecting } of entries) {
            if (!isIntersecting || !visible() || !waiting.delete(target)) continue;
            observer.unobserve(target);
            void fetchAvatar(target.dataset.username);
          }
        }, { rootMargin: '48px 0px' }) : null;

        function showImage(avatar, image) {
          const img = createImage();
          img.alt = '';
          img.decoding = 'async';
          img.src = image;
          avatar.replaceChildren(img);
          avatar.dataset.avatar = 'image';
        }

        function showFallback(avatar) {
          if (avatar.dataset.avatar === 'fallback') return;
          avatar.replaceChildren(fallback());
          avatar.dataset.avatar = 'fallback';
        }

        function decodes(image) {
          return new Promise(resolve => {
            const img = createImage();
            img.addEventListener('load', () => resolve(true), { once: true });
            img.addEventListener('error', () => resolve(false), { once: true });
            img.src = image;
          });
        }

        function paint(key) {
          const image = images.get(key);
          for (const avatar of slots) {
            if (!avatar.isConnected) slots.delete(avatar);
            else if (keyOf(avatar.dataset.username) === key && avatar.dataset.avatar !== 'image') showImage(avatar, image);
          }
        }

        function fetchAvatar(username) {
          const key = keyOf(username);
          if (!key || images.has(key) || loading.has(key)) return loading.get(key);
          const job = Promise.resolve().then(() => load(username)).then(async image => {
            if (typeof image !== 'string' || !IMAGE_PATTERN.test(image) || !await decodes(image)) return;
            images.set(key, image);
            paint(key);
          }).catch(() => {}).finally(() => loading.delete(key));
          loading.set(key, job);
          return job;
        }

        function stopWaiting(avatar) {
          if (waiting.delete(avatar)) observer.unobserve(avatar);
        }

        function set(avatar, username = '', { retry = false } = {}) {
          const key = keyOf(username), changed = keyOf(avatar.dataset.username) !== key || !avatar.dataset.avatar;
          avatar.dataset.username = username;
          slots.add(avatar);
          if (images.has(key)) {
            stopWaiting(avatar);
            if (avatar.dataset.avatar !== 'image' || changed) showImage(avatar, images.get(key));
            return;
          }
          if (changed) {
            stopWaiting(avatar);
            avatar.dataset.avatar = '';
            showFallback(avatar);
          }
          if (!key || !(changed || retry)) return;
          if (!observer) {
            void fetchAvatar(username);
            return;
          }
          stopWaiting(avatar);
          waiting.add(avatar);
          observer.observe(avatar);
        }

        function dispose() {
          observer?.disconnect();
          waiting.clear();
          slots.clear();
        }

        return { set, dispose };
      }
      // avatar-view:end

      const avatarView = createAvatarView({
        fallback: () => element('avatar-fallback').content.cloneNode(true),
        createImage: () => document.createElement('img'),
        load: async username => (await request('avatar', { username }))?.image,
        visible: () => !group.hidden && !lifetime.signal.aborted,
        Observer: typeof IntersectionObserver === 'function' ? IntersectionObserver : null
      });
      const setAvatar = (avatar, username, options) => avatarView.set(avatar, username, options);

      function medal(rank, period) {
        const place = podium[rank - 1];
        if (!place) return null;
        const badge = document.createElement('span');
        badge.className = 'ladder-medal ladder-medal-' + period.days;
        badge.dataset.place = rank;
        badge.title = t('medal-position', t(period.title), t(place));
        badge.setAttribute('role', 'img');
        badge.setAttribute('aria-label', badge.title);
        const crown = document.createElement('span'), branch = document.createElement('span');
        const emblem = document.createElement('span'), mark = document.createElement('span');
        crown.className = 'ladder-medal-crown';
        branch.className = 'ladder-medal-branch';
        for (let angle = 15; angle <= 135; angle += 20) {
          const leaf = document.createElement('span');
          leaf.className = 'ladder-medal-leaf';
          leaf.style.setProperty('--leaf-angle', `${angle}deg`);
          branch.append(leaf);
        }
        emblem.className = 'ladder-medal-emblem';
        mark.className = 'ladder-medal-mark';
        mark.textContent = period.mark;
        emblem.append(mark);
        badge.append(crown, branch, branch.cloneNode(true), emblem);
        return badge;
      }

      const usageChartLabel = () => t(rankDays === 1 ? 'leaderboard-five-minute-usage' : 'leaderboard-daily-usage');
      const speedText = value => Number.isFinite(value) ? `${locale.number(value, {
        maximumFractionDigits: 1, ...(value >= 10_000 ? { notation: 'scientific' } : {}) })} tokens/s` : '—';
      const leaderboardTime = time => locale.date(time, { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
      const toolText = (model, cli) => `${model ?? '—'} · ${Object.hasOwn(AGENT_LABELS, cli) ? AGENT_LABELS[cli] : cli ?? '—'}`;
      const chartVerticalPadding = 4;

      function dailyUsagePoints(daily, left, days) {
        if (!Array.isArray(daily)) return [];
        const totals = new Map(daily.map(point => [point.at ?? point.day, point]));
        return Array.from({ length: days }, (_, offset) => {
          const at = left + offset * DAY_MS;
          const day = new Date(at + 8 * 60 * 60 * 1000).toISOString().slice(0, 10);
          const value = totals.get(at) ?? totals.get(day);
          return { day, tokens: value?.tokens ?? 0,
            ...(value?.day && Number.isFinite(value.at) ? { packetDay: value.day } : {}),
            ...(typeof value?.complete === 'boolean' ? { at, complete: value.complete } : {}) };
        });
      }

      function dailyUsagePath(points, x, y) {
        const levels = points.map(y);
        const changes = levels.slice(1).map((level, index) => level - levels[index]);
        const tangents = levels.map((_, index) => {
          const before = changes[index - 1] ?? changes[index];
          const after = changes[index] ?? before;
          // Keep peaks, valleys, and flat stretches within the recorded range.
          return before * after > 0 ? 2 * before * after / (before + after) : 0;
        });
        const line = new Path2D();
        let startX = x(points[0]);
        line.moveTo(startX, levels[0]);
        for (let index = 1; index < points.length; index++) {
          const endX = x(points[index]);
          const third = (endX - startX) / 3;
          line.bezierCurveTo(
            startX + third, levels[index - 1] + tangents[index - 1] / 3,
            endX - third, levels[index] - tangents[index] / 3,
            endX, levels[index]
          );
          startX = endX;
        }
        return line;
      }

      function paintUsagePath(ctx, line, baseline, firstX, lastX) {
        const colors = window.getComputedStyle(document.documentElement);
        const low = colors.getPropertyValue('--usage-wave-low').trim();
        const high = colors.getPropertyValue('--speed').trim();

        const area = new Path2D(line);
        area.lineTo(lastX, baseline);
        area.lineTo(firstX, baseline);
        area.closePath();

        const gradient = ctx.createLinearGradient(0, baseline, 0, chartVerticalPadding);
        gradient.addColorStop(0, low);
        gradient.addColorStop(1, high);
        ctx.strokeStyle = ctx.fillStyle = gradient;
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.fill(area);
        ctx.restore();
        ctx.stroke(line);
      }

      function pulseX(point, left, width) {
        const offset = Math.max(0, Math.min(1, (point.submittedAt - left) / RECENT_STATS_MS));
        return width * offset;
      }

      function drawSubmissionPulses(chart, points, left, animateAfter) {
        const maximum = Math.max(1, ...points.map(point => point.deltaTokens));
        const animate = points.some(point => point.submittedAt > animateAfter) &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let frame, startedAt;

        function schedule() {
          if (frame === undefined) frame = requestAnimationFrame(draw);
        }

        function draw(time) {
          frame = undefined;
          if (!chart.isConnected || lifetime.signal.aborted) return;
          const { width, height } = chart.getBoundingClientRect(), density = window.devicePixelRatio || 1;
          if (width <= 0 || height <= 2 * chartVerticalPadding) return;
          const pixelWidth = Math.round(width * density), pixelHeight = Math.round(height * density);
          if (chart.width !== pixelWidth) chart.width = pixelWidth;
          if (chart.height !== pixelHeight) chart.height = pixelHeight;
          const ctx = chart.getContext('2d');
          if (!ctx) return;
          ctx.setTransform(pixelWidth / width, 0, 0, pixelHeight / height, 0, 0);
          ctx.clearRect(0, 0, width, height);
          const baseline = height - chartVerticalPadding;
          ctx.lineWidth = 1.4;
          ctx.lineCap = ctx.lineJoin = 'round';
          const halfWidth = Math.min(3.25, width / 70);
          startedAt ??= time;
          const progress = animate ? Math.min(1, (time - startedAt) / 200) : 1;
          const riseAt = point => point.submittedAt > animateAfter ? 1 - (1 - progress) ** 2 : 1;
          const line = new Path2D();
          line.moveTo(0, baseline);
          for (const point of points) {
            const x = pulseX(point, left, width);
            if (point.deltaTokens > 0) {
              const peak = baseline - Math.max(1.5, (baseline - chartVerticalPadding) * point.deltaTokens / maximum) * riseAt(point);
              line.lineTo(Math.max(0, x - halfWidth), baseline);
              line.bezierCurveTo(x - halfWidth * 0.54, baseline, x - halfWidth * 0.38, peak, x, peak);
              line.bezierCurveTo(x + halfWidth * 0.38, peak, x + halfWidth * 0.54, baseline, x + halfWidth, baseline);
            } else line.lineTo(x, baseline);
          }
          line.lineTo(width, baseline);
          paintUsagePath(ctx, line, baseline, 0, width);
          for (const point of points) {
            if (point.deltaTokens > 0) continue;
            ctx.beginPath();
            ctx.arc(pulseX(point, left, width), baseline, 1.4 * riseAt(point), 0, Math.PI * 2);
            ctx.fill();
          }
          if (progress < 1) schedule();
        }

        usagePainters.set(chart, schedule);
        schedule();
      }

      function usageCard({ recent, daily }, now, animateAfter, windowStart) {
        const container = document.createElement('div'), chart = document.createElement('canvas');
        container.className = 'ladder-recent';
        chart.className = 'ladder-chart';
        chart.width = 320;
        chart.height = 60;
        chart.setAttribute('role', 'img');
        chart.setAttribute('aria-label', usageChartLabel());
        const byDay = rankDays > 1;
        const dateLabel = time => locale.date(time, { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric' });
        const timeOf = point => byDay ? point.at : point.submittedAt;
        const tokensOf = point => byDay ? point.tokens : point.deltaTokens;
        const span = byDay ? (rankDays - 1) * DAY_MS : RECENT_STATS_MS;
        const left = byDay ? windowStart : now - span;
        const points = byDay ? dailyUsagePoints(daily, left, rankDays) : recent?.points ?? [];
        const latestPoint = points.at(-1);
        const pointTitle = point => byDay ? (point.packetDay
          ? `${dateLabel(Date.parse(point.packetDay + 'T00:00:00+08:00'))} · ${formatMillionTokens(point.tokens)}`
          : `${dateLabel(point.at)} – ${dateLabel(point.at + DAY_MS)} · ${formatMillionTokens(point.tokens)}`) +
          (point.complete === false ? ` · ${t('leaderboard-usage-incomplete')}` : '')
          : `${shortClock(point.submittedAt)} · ${formatMillionTokens(point.deltaTokens)} · ${speedText(point.avgTps)}`;
        const emptyTitle = byDay ? usageChartLabel() : `${usageChartLabel()}\n${formatMillionTokens(0)} · ${speedText(0)}`;
        chart.title = latestPoint ? `${usageChartLabel()}\n${pointTitle(latestPoint)}` : emptyTitle;
        container.append(chart);
        if (byDay) {
          const axis = document.createElement('div');
          axis.className = 'ladder-chart-axis';
          for (const offset of [0, Math.round((rankDays - 1) / 2), rankDays - 1]) {
            const label = document.createElement('span');
            label.textContent = dateLabel(left + offset * DAY_MS + (rankingMode === 'hourly' ? DAY_MS - 1 : 0));
            axis.append(label);
          }
          container.append(axis);
          if (!latestPoint) return container;
          const width = chart.width, height = chart.height - chartVerticalPadding * 2;
          const maximum = Math.max(1, ...points.map(tokensOf));
          const x = point => width * Math.min(1, (timeOf(point) - left) / span);
          const y = point => chartVerticalPadding + height * (1 - tokensOf(point) / maximum);
          const paint = () => {
            const ctx = chart.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, chart.width, chart.height);
            ctx.lineWidth = 2;
            paintUsagePath(ctx, dailyUsagePath(points, x, y), chart.height - chartVerticalPadding, x(points[0]), x(latestPoint));
            for (const point of points) {
              ctx.beginPath();
              ctx.arc(x(point), y(point), 3, 0, Math.PI * 2);
              ctx.fill();
            }
          };
          usagePainters.set(chart, paint);
          paint();
          chart.addEventListener('pointermove', event => {
            const rect = chart.getBoundingClientRect();
            const position = (event.clientX - rect.left) * chart.width / rect.width;
            const nearest = points.reduce((a, b) => Math.abs(x(a) - position) <= Math.abs(x(b) - position) ? a : b);
            chart.title = Math.abs(x(nearest) - position) > width * DAY_MS / span / 2 ? usageChartLabel() : pointTitle(nearest);
          });
        } else {
          const meta = document.createElement('div'), tools = document.createElement('span');
          const speed = document.createElement('strong');
          meta.className = 'ladder-recent-meta';
          tools.className = 'ladder-recent-tools';
          tools.textContent = toolText(recent?.topModel, recent?.topCli);
          tools.title = tools.textContent;
          speed.className = 'ladder-recent-speed';
          speed.textContent = speedText(latestPoint?.avgTps ?? 0);
          speed.title = t('leaderboard-average-speed');
          meta.append(tools, speed);
          container.append(meta);
          drawSubmissionPulses(chart, points, left, animateAfter);
          if (!latestPoint) return container;
          chart.addEventListener('pointermove', event => {
            const { left: edge, width } = chart.getBoundingClientRect();
            const distance = point => Math.abs(pulseX(point, left, width) - (event.clientX - edge));
            const nearest = points.reduce((a, b) => distance(a) <= distance(b) ? a : b);
            chart.title = distance(nearest) <= 10 ? pointTitle(nearest) : emptyTitle;
          });
        }
        return container;
      }

      function renderRows(rows, username, ranking) {
        const now = Date.now();
        const speedBoard = rankDays === 0;
        nextRecentExpiry = Infinity;
        if (speedBoard) {
          const offset = ranking?.clockOffset ?? 0;
          const expiry = ({ submittedAt }) => {
            if (!Number.isFinite(ranking?.windowStart)) return submittedAt + DAY_MS - offset;
            if (rankingMode === 'hourly') return Math.floor(submittedAt / HOUR_MS) * HOUR_MS + DAY_MS + HOUR_MS - offset;
            return Math.floor((submittedAt + 8 * HOUR_MS) / DAY_MS) * DAY_MS + DAY_MS - 8 * HOUR_MS - offset;
          };
          rows = rows.filter(row => expiry(row) > now)
            .map((row, index) => ({ ...row, rank: index + 1 }));
          for (const row of rows) nextRecentExpiry = Math.min(nextRecentExpiry, expiry(row));
        }
        rows = rows.map(row => {
          if (!row.recent) return row;
          const points = row.recent.points.filter(point => point.submittedAt > now - RECENT_STATS_MS && point.submittedAt <= now);
          if (points.length) nextRecentExpiry = Math.min(nextRecentExpiry, points[0].submittedAt + RECENT_STATS_MS);
          return { ...row, recent: { ...row.recent, points } };
        });
        const previousPulses = animateToday && pulseDay === renderedDay ? latestPulses : null;
        pulseDay = rankDays === 1 ? renderedDay : '';
        latestPulses = new Map(rankDays === 1 ? rows.map(row => [row.username, row.recent?.points.at(-1)?.submittedAt ?? -Infinity]) : []);
        const signature = JSON.stringify([rankingMode, rankDays, ranking?.windowStart, username, rows]);
        if (signature === drawnRows) return;
        const period = speedBoard ? speedPeriod : periods.find(entry => entry.days === rankDays);
        drawnRows = signature;
        const keyOf = row => JSON.stringify([rankingMode, rankDays, ranking?.windowStart, username === row.username, row]);
        rankingNodes = updateList(element('rows'), rows, rankingNodes, keyOf, row => {
          const item = document.createElement('li');
          if (username && row.username === username) item.classList.add('ladder-self');
          if (speedBoard) item.classList.add('ladder-speed-row');
          const rank = document.createElement('span'), name = document.createElement('span'), user = document.createElement('div');
          const total = document.createElement('strong'), time = document.createElement('time');
          rank.className = 'ladder-rank';
          name.className = 'ladder-name';
          user.className = 'ladder-row-user';
          total.className = 'ladder-total';
          time.className = 'ladder-time';
          rank.textContent = locale.number(row.rank);
          name.textContent = row.username;
          name.dir = 'auto';
          name.title = row.username;
          const avatar = document.createElement('span');
          avatar.className = 'ladder-avatar';
          avatar.setAttribute('aria-hidden', 'true');
          setAvatar(avatar, row.username);
          const badge = period && medal(row.rank, period);
          if (badge) user.append(badge);
          user.append(avatar, name);
          total.textContent = speedBoard ? speedText(row.avgTps) : formatMillionTokens(row.tokens);
          if (speedBoard) total.title = t('leaderboard-average-speed');
          const shownAt = speedBoard ? row.submittedAt : (row.lastUploadAt ?? row.submittedAt);
          const shownTime = speedBoard ? leaderboardTime(shownAt) : clock(shownAt);
          time.setAttribute('data-localized-text', '');
          time.textContent = (speedBoard ? shownTime : t('last-upload-at', shownTime)) +
            (row.complete === false ? ` · ${t('leaderboard-usage-incomplete')}` : '');
          time.dateTime = new Date(shownAt).toISOString();
          item.append(rank, user, total);
          if (speedBoard) {
            const meta = document.createElement('div');
            const tools = document.createElement('span');
            meta.className = 'ladder-recent ladder-recent-meta';
            tools.className = 'ladder-recent-tools';
            tools.textContent = toolText(row.topModel, row.topCli);
            tools.title = tools.textContent;
            meta.append(tools);
            if (Number.isSafeInteger(row.deltaTokens)) {
              const tokens = document.createElement('bdi');
              tokens.className = 'ladder-speed-tokens';
              tokens.textContent = `${locale.number(row.deltaTokens)} tokens`;
              meta.append(tokens);
            }
            item.append(meta);
          } else item.append(usageCard(row, now, previousPulses?.get(row.username) ?? Infinity, ranking.windowStart));
          item.append(time);
          return item;
        });
        // Rows changed after a sync: give a still-default account avatar another chance too.
        setAvatar(element('account-avatar'), username, { retry: true });
      }

      function renderAccount(username) {
        const identity = element('mine');
        identity.textContent = username || t('signed-in-label');
        identity.title = username ?? '';
        setAvatar(element('account-avatar'), username);
        if (!rankingAccess) return;
        for (const period of periods) {
          const ranking = cachedRankings.get(period.days);
          const row = username && ranking?.rows.find(row => row.username === username);
          let rankText = '—';
          if (row) rankText = t('rank-position', locale.number(row.rank));
          else if (username && ranking && !rankingProblem) rankText = t('rank-not-listed');
          element('user-rank-' + period.days).textContent = rankText;
          element('user-tokens-' + period.days).textContent = formatMillionTokens(row?.tokens);
          const place = row?.rank >= 1 && row.rank <= podium.length ? row.rank : 0;
          const slot = element('user-badge-' + period.days);
          if (Number(slot.dataset.place ?? 0) === place) continue;
          slot.dataset.place = place;
          slot.querySelector('.ladder-medal')?.remove();
          if (place) slot.append(medal(place, period));
        }
      }

      const successfulUploadCodes = new Set(['accepted', 'initialized', 'duplicate']);

      function uploadFailure(snapshot) {
        const record = snapshot?.lastUpload;
        if (Number.isFinite(record?.at) && !record.rollingOnly && !successfulUploadCodes.has(record.code)) {
          const reason = messageFor(record.code) ?? t('sync-failure-unknown');
          return successfulUploadCodes.has(record.rollingCode) ? t('rolling-upload-succeeded-daily-failed', reason)
            : t('last-sync-failed', shortClock(record.at), reason);
        }
        if (snapshot?.rollingProblem) {
          const reason = messageFor(snapshot.rollingProblem) ?? t('sync-failure-unknown');
          return t(record?.rollingOnly ? 'rolling-upload-failed' : 'daily-upload-succeeded-rolling-failed', reason);
        }
        return '';
      }

      function renderTransferStatus(indicator, active, label, problem) {
        indicator.setAttribute('aria-busy', String(active));
        const failed = !active && Boolean(problem);
        indicator.classList.toggle('is-failed', failed);
        const text = t(label);
        if (indicator.title !== text) indicator.title = text;
        const accessible = failed ? `${text} · ${problem}` : text;
        if (indicator.getAttribute('aria-label') !== accessible) indicator.setAttribute('aria-label', accessible);
      }

      function renderUploadStatus(snapshot, signedIn, time) {
        const uploading = Boolean(signedIn && snapshot?.uploading);
        const locked = snapshot?.board?.lockedUntil > time;
        const problem = signedIn && (uploadFailure(snapshot) || (locked ? messageFor('locked') : ''));
        renderTransferStatus(element('upload-state'), uploading, uploading ? 'uploading' : 'data-upload', problem);
      }

      function renderDownloadStatus() {
        const downloading = Boolean(rankingPending);
        const problem = rankingProblem && (messageFor(rankingProblem) ?? t('leaderboard-unavailable'));
        renderTransferStatus(element('download-state'), downloading, downloading ? 'sync-in-progress' : 'period-rankings', problem);
      }

      function scheduleUploadUnlock(lockedUntil, time) {
        const deadline = Number(lockedUntil);
        const next = Number.isFinite(deadline) && deadline > time ? deadline : undefined;
        if (next === uploadUnlockAt) return;
        clearTimeout(uploadUnlockWake);
        uploadUnlockAt = next;
        uploadUnlockWake = next === undefined ? undefined : setTimeout(() => {
          uploadUnlockAt = uploadUnlockWake = undefined;
          render();
        }, Math.min(next - time, 2_147_483_647));
      }

      function renderToolbarTime(note, lastAt) {
        const validTime = Number.isFinite(lastAt);
        const text = validTime ? shortClock(lastAt) : '—';
        note.title = validTime ? clock(lastAt) : '';
        if (note.textContent !== text) note.textContent = text;

        bgEditor.hidden = true;
        document.body.classList.remove('is-bg-editing');
        panelMain.hidden = false;
        toggle.focus();
      }

      toggle.addEventListener('click', () => setOpen(dialog.hidden, !dialog.hidden));
      closeButton.addEventListener('click', () => setOpen(false, true));
      dialog.addEventListener('click', event => {
        if (event.target === dialog) setOpen(false, true);
      });
      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        if (!bgEditor.hidden) {
          event.preventDefault();
          closeEditor(false);
        } else if (!dialog.hidden) {
          event.preventDefault();
          setOpen(false, true);
        }
      }, { signal: lifetime.signal });

      bgUpload.addEventListener('click', () => bgInput.click());
      bgEdit.addEventListener('click', openEditor);
      bgReset.addEventListener('click', () => {
        showBgError('');
        writeStore(BG_IMAGE_KEY, null);
        writeStore(BG_TRANSFORM_KEY, null);
        applyBackgroundTransform(DEFAULT_BG_TRANSFORM, false);
        applyBackgroundImage('');
      });

      bgEditorBar.addEventListener('pointerdown', event => event.stopPropagation());
      bgEditorZoomOut.addEventListener('click', () => applyBackgroundTransform({ ...bgTransform, scale: bgTransform.scale - 10 }, false));
      bgEditorZoomIn.addEventListener('click', () => applyBackgroundTransform({ ...bgTransform, scale: bgTransform.scale + 10 }, false));
      bgEditorResetPos.addEventListener('click', () => applyBackgroundTransform(DEFAULT_BG_TRANSFORM, false));
      bgEditorCancel.addEventListener('click', () => closeEditor(false));
      bgEditorSave.addEventListener('click', () => closeEditor(true));

      bgEditor.addEventListener('pointerdown', event => {
        if (!hasBgImage || bgEditor.hidden || (event.pointerType === 'mouse' && event.button !== 0)) return;
        if (bgEditorBar.contains(event.target)) return;
        const rect = bgEditor.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        dragState = {
          pointerId: event.pointerId,
          startClientX: event.clientX,
          startClientY: event.clientY,
          startX: bgTransform.x,
          startY: bgTransform.y,
          width: rect.width,
          height: rect.height
        };
        bgEditor.classList.add('is-dragging');
        bgEditor.setPointerCapture?.(event.pointerId);
      });
      bgEditor.addEventListener('pointermove', event => {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        const dx = ((event.clientX - dragState.startClientX) / dragState.width) * 100;
        const dy = ((event.clientY - dragState.startClientY) / dragState.height) * 100;
        applyBackgroundTransform({
          ...bgTransform,
          x: dragState.startX + dx,
          y: dragState.startY + dy
        }, false);
      });
      function stopDrag(event) {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        if (bgEditor.hasPointerCapture?.(event.pointerId)) {
          bgEditor.releasePointerCapture(event.pointerId);
        }
        dragState = null;
        bgEditor.classList.remove('is-dragging');
      }
      bgEditor.addEventListener('pointerup', stopDrag);
      bgEditor.addEventListener('pointercancel', stopDrag);
      bgEditor.addEventListener('wheel', event => {
        if (!hasBgImage || bgEditor.hidden) return;
        event.preventDefault();
        const step = event.deltaY < 0 ? 5 : -5;
        applyBackgroundTransform({ ...bgTransform, scale: bgTransform.scale + step }, false);
      }, { passive: false });

      bgInput.addEventListener('change', async () => {
        const file = bgInput.files?.[0];
        bgInput.value = '';
        if (!file) return;
        showBgError('');
        const mime = resolveImageMime(file);
        if (!mime) return showBgError('settings-bg-error-type');
        if (file.size > MAX_BG_BYTES) return showBgError('settings-bg-error-size');
        try {
          const dataUrl = await readAsDataUrl(new Blob([await file.arrayBuffer()], { type: mime }));
          if (!DATA_IMAGE_RE.test(dataUrl) || !await decodesImage(dataUrl)) {
            return showBgError('settings-bg-error-type');
          }
          if (!writeStore(BG_IMAGE_KEY, dataUrl)) {
            return showBgError('settings-bg-error-save');
          }
          applyBackgroundTransform(DEFAULT_BG_TRANSFORM, true);
          applyBackgroundImage(dataUrl);
        } catch {
          showBgError('settings-bg-error-type');
        }
      });

      for (const link of [byId('panel-repo-link'), byId('panel-star-link')]) {
        link?.addEventListener('click', event => {
          if (typeof window.orca?.shell?.openExternal !== 'function') return;
          event.preventDefault();
          void window.orca.shell.openExternal(link.href).catch(() => {});
        }, { signal: lifetime.signal });
      }

      window.addEventListener('pagehide', () => {
        themeObserver.disconnect();
        lifetime.abort();
      }, { once: true });
    })();
  </script>
</body>
</html>
