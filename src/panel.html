<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TPS Plugin</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f2f2f7;
      --surface: #ffffff;
      --ink: #1c1c1e;
      --muted: #6d6d75;
      --line: #e5e5ea;
      --purple: #8f32d6;
      --blue: #0066e6;
      --ladder-own-rank: #8b5a05;
      --orange: #b45300;
      --green: #007f48;
      --usage-wave-low: #267456;
      --cache: #9c6500;
      --speed: #c72e3a;
      --speed-bg: #f0f0f3;
      --tag-bg: #ededf2;
      --heat-0: #ebedf0; --heat-1: #bfdbfe; --heat-2: #7fb6fb; --heat-3: #3b82e6; --heat-4: #1d4fb8;
      --proxy-bg: #e5f7ee;
      --button-bg: #e5f0ff;
      --warning-bg: #fff1dc;
      --error: #c8213a;
      --error-bg: #fff0f3;
      --shadow: 0 3px 12px rgb(39 43 72 / 3%);
    }
    html.dark {
      color-scheme: dark;
      --page: #161618;
      --surface: #262628;
      --ink: #f5f5f7;
      --muted: #b4b4be;
      --line: #3a3a3e;
      --purple: #d38aff;
      --blue: #64b0ff;
      --ladder-own-rank: #f0bf63;
      --orange: #ffb340;
      --green: #4ade80;
      --usage-wave-low: #60a589;
      --cache: #e8b65b;
      --speed: #ff6b72;
      --speed-bg: #303034;
      --tag-bg: #343439;
      --heat-0: #2a2a2e; --heat-1: #1e3a5f; --heat-2: #2e5f94; --heat-3: #4a8fd6; --heat-4: #8cc4ff;
      --proxy-bg: #193829;
      --button-bg: #163552;
      --warning-bg: #46321b;
      --error: #ff8fa5;
      --error-bg: #49232d;
      --shadow: 0 3px 12px rgb(0 0 0 / 6%);
    }
    * { box-sizing: border-box; }
    /* Set the reading direction on text leaves so flex and grid keep their order. */
    :where(html:lang(ar), html:lang(ur)) :is([data-i18n], [data-localized-text]) {
      direction: rtl;
      unicode-bidi: isolate;
      text-align: match-parent;
    }
    [hidden] { display: none !important; }
    html { min-width: 0; min-height: 100%; background: var(--page); }
    body {
      margin: 0;
      min-width: 0;
      padding: 16px;
      color: var(--ink);
      background: var(--page);
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 18px; line-height: 1.4; letter-spacing: -.3px; font-weight: 750; }
    .title-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 32px; }
    .panel-title { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .panel-logo { flex: none; width: 32px; height: 32px; border-radius: 6px; object-fit: contain; }
    .panel-version { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0; }
    .language-picker { position: relative; flex: 0 1 156px; min-width: 0; }
    .language-toggle, .language-option {
      display: flex; align-items: center; gap: 7px; min-width: 0; min-height: 32px;
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--ink); cursor: pointer;
    }
    .language-toggle { width: 100%; }
    .language-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .language-toggle .language-name { flex: 1; min-width: 0; text-align: start; }
    .language-flag { flex: none; width: 20px; height: 14px; object-fit: contain; }
    .language-toggle svg { flex: none; width: 12px; height: 12px; color: var(--muted); }
    .language-menu {
      position: absolute; z-index: 4; top: calc(100% + 5px); right: 0;
      width: min(216px, calc(100vw - 32px)); padding: 6px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--surface); box-shadow: 0 5px 18px rgb(0 0 0 / 15%);
    }
    .language-search {
      width: 100%; padding: 6px 8px; margin-bottom: 4px;
      border: 1px solid var(--line); border-radius: 6px;
      font: inherit; color: var(--ink); background: var(--page);
    }
    .language-toggle:focus-visible, .language-option:focus-visible, .language-search:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 1px;
    }
    .language-options { max-height: 238px; overflow-y: auto; }
    .language-option { width: 100%; border-color: transparent; text-align: start; }
    .language-option:hover, .language-option[aria-pressed="true"] { background: var(--button-bg); color: var(--blue); }
    .language-message { margin: 4px 6px; color: var(--muted); overflow-wrap: anywhere; }
    .current-updated { margin: 0; color: var(--muted); font-size: 11px; }
    .refresh {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      flex-shrink: 0; min-height: 34px; padding: 7px 11px; border: 0; border-radius: 13px;
      background: var(--button-bg); color: var(--blue); font-size: 12px; font-weight: 650; cursor: pointer;
    }
    .refresh svg { width: 14px; height: 14px; flex-shrink: 0; }
    .current-refresh { width: 34px; padding: 0; }
    .current-refresh svg { width: 16px; height: 16px; }
    .refresh:hover:not(:disabled) { filter: brightness(.96); }
    .refresh:active:not(:disabled) { transform: translateY(1px); }
    .refresh:disabled { cursor: default; opacity: .6; }
    .refresh:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .panel-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 10px; border-bottom: 1px solid var(--line); }
    .panel-tab { min-width: 0; padding: 8px 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-weight: 650; cursor: pointer; }
    .panel-tab[aria-selected="true"] { border-bottom-color: var(--blue); color: var(--blue); }
    .panel-tab:focus-visible, .panel-view:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .panel-view { margin-top: 12px; }
    #usage { display: grid; gap: 8px; }
    #panel:has(> :is(#usage, #current-data, #leaderboard):not([hidden])) {
      display: grid; grid-template: auto auto minmax(0, 1fr) / minmax(0, 1fr);
      block-size: calc(100dvh - 32px);
    }
    #current-data { display: grid; grid-template: auto minmax(96px, 1fr) / minmax(0, 1fr); min-block-size: 0; }
    #usage { grid-template: auto auto minmax(0, 1fr) / minmax(0, 1fr); min-block-size: 0; }
    .usage-breakdown {
      display: grid; grid-template-rows: repeat(2, minmax(112px, 1fr)) 180px; gap: 8px;
      min-inline-size: 0;
    }
    .usage-ranking, .heat { display: grid; min-inline-size: 0; }
    .usage-ranking { grid-template-rows: auto minmax(0, 1fr); }
    .usage-scroll, #current-scroll, .ladder-ranking-scroll { min-inline-size: 0; overflow-y: auto; scrollbar-width: thin; }
    :is(.usage-scroll, #current-scroll, .ladder-ranking-scroll):focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
    .section-title { margin: 0; color: var(--ink); font-size: 13px; line-height: 1.6; font-weight: 700; }
    .section-detail { margin: 0; color: var(--muted); font-size: 11px; }
    .ladder-card { padding: 12px 16px; }
    #leaderboard {
      --ladder-medal-size: 48px; --ladder-medal-scale: .85;
      display: flex; flex-direction: column; gap: 8px; min-block-size: 0;
    }
    #ladder-controls, .ladder-personal-data { flex: none; }
    #ladder-controls:has(#ladder-account:not([hidden])) { block-size: 62px; overflow-y: auto; scrollbar-width: thin; }
    .ladder-personal-data, .ladder-rank-card { scrollbar-width: thin; scrollbar-gutter: stable; }
    .ladder-personal-data { max-block-size: 208px; padding-block-end: 8px; overflow-y: auto; }
    .ladder-rank-card { display: flex; flex: 1; flex-direction: column; min-block-size: 224px; overflow: hidden; }
    #ladder-ranking-notice { overflow-y: auto; scrollbar-width: thin; }
    #ladder-ranking-content { display: flex; flex: 1; flex-direction: column; min-block-size: 0; }
    #ladder-ranking-content > :not(.ladder-ranking-scroll) { flex: none; }
    .ladder-ranking-scroll { flex: 1; min-block-size: 0; }
    .war-tabs.ladder-tabs { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 6px; }
    .ladder-tabs .war-tab { min-width: 0; padding-inline: 3px; font-size: 12px; overflow-wrap: anywhere; }
    html:lang(zh-CN) .ladder-tabs { grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, 1fr)); }
    .ladder-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
    .ladder-control { min-height: 36px; padding-inline: 12px; font-size: 13px; font-weight: 700; }
    .ladder-secondary { color: var(--muted); background: var(--tag-bg); }
    .ladder-note { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
    .ladder-notice p { margin: 0; }
    .ladder-notice p + p, .ladder-notice ul + p { margin-top: .6em; }
    .ladder-notice-title { color: var(--ink); }
    .ladder-login-notice-list { margin: .35em 0 0; padding-inline-start: 1.5em; }
    .ladder-toolbar {
      --ladder-toolbar-title-width: clamp(62px, 26vw, 106px);
      --ladder-toolbar-action-width: 40px;
      --ladder-toolbar-toggle-width: 28px;
      --ladder-toolbar-icon-size: 16px;
      --ladder-toolbar-label-size: 13px;
      --ladder-toolbar-gap: 3px;
      display: grid;
      grid-template-columns: minmax(0, var(--ladder-toolbar-title-width)) minmax(0, 1fr)
        var(--ladder-toolbar-action-width) max-content;
      grid-template-areas: "title . action last";
      align-items: center; column-gap: var(--ladder-toolbar-gap);
      font-variant-numeric: tabular-nums;
    }
    html:lang(zh-CN) .ladder-toolbar { --ladder-toolbar-title-width: 4em; }
    .ladder-upload-toolbar { margin-top: 8px; }
    .ladder-rank-toolbar {
      grid-template-areas: "title toggle action last";
    }
    .ladder-rank-toolbar.is-off {
      grid-template-columns: minmax(0, var(--ladder-toolbar-title-width)) var(--ladder-toolbar-toggle-width);
      grid-template-areas: "title toggle";
    }
    .ladder-rank-toolbar.is-off :is(.ladder-transfer, .ladder-toolbar-value) { display: none; }
    .ladder-toolbar .section-title { grid-area: title; font-size: var(--ladder-toolbar-label-size); }
    .ladder-toolbar .ladder-transfer { grid-area: action; }
    .ladder-rank-toggle {
      grid-area: toggle; justify-self: start; display: grid; place-items: center;
      width: var(--ladder-toolbar-toggle-width); height: 28px; padding: 0;
      border: 0; border-radius: 6px; background: transparent; cursor: pointer;
    }
    .ladder-rank-toggle:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .ladder-rank-toggle:disabled { cursor: default; opacity: .55; }
    .ladder-rank-toggle span {
      display: flex; align-items: center; width: 24px; height: 14px; padding: 1px;
      border: 1px solid var(--muted); border-radius: 8px; background: var(--tag-bg);
    }
    .ladder-rank-toggle span::before {
      content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--muted);
    }
    .ladder-rank-toggle[aria-checked="true"] span {
      justify-content: flex-end; background: var(--blue); border-color: var(--blue);
    }
    .ladder-rank-toggle[aria-checked="true"] span::before { background: var(--surface); }
    .ladder-toolbar .section-title, .ladder-toolbar-value {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ladder-toolbar-value { grid-area: last; font-size: var(--ladder-toolbar-label-size); }
    .ladder-transfer svg {
      width: var(--ladder-toolbar-icon-size); height: var(--ladder-toolbar-icon-size); flex: none; color: var(--muted);
    }
    .ladder-actions .ladder-note { margin: 0; }
    .ladder-status { margin: 8px 0 0; font-size: 12px; overflow-wrap: anywhere; }
    .ladder-status:empty, .ladder-mine:empty { display: none; }
    .ladder-identity { display: flex; justify-content: space-between; gap: 8px; align-items: center; min-width: 0; }
    .ladder-account-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .ladder-avatar {
      display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px;
      border-radius: 50%; overflow: hidden; background: var(--button-bg);
      color: var(--muted);
    }
    .ladder-avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .ladder-avatar svg { display: block; width: 78%; height: 78%; }
    .ladder-account-name .ladder-avatar { width: 32px; height: 32px; }
    .ladder-user-stats { margin: 0; }
    .ladder-user-stat {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center; column-gap: 8px; min-height: 30px; padding-block: 1px;
      border-block-end: 1px solid var(--line); line-height: 1.25;
    }
    .ladder-user-stat dt { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .ladder-user-stat dd { min-width: 0; margin: 0; font-variant-numeric: tabular-nums; }
    .ladder-user-position { display: flex; align-items: center; justify-content: flex-end; gap: 4px; text-align: end; }
    .ladder-user-position .ladder-medal, .ladder-row-user .ladder-medal { zoom: var(--ladder-medal-scale); }
    .ladder-user-rank { font-size: 16px; font-weight: 750; overflow-wrap: anywhere; }
    .ladder-user-tokens { color: var(--blue); font-size: 14px; font-weight: 650; text-align: start; overflow-wrap: anywhere; }
    .ladder-mine {
      min-width: 0; margin: 0; color: var(--purple); font-size: 24px; font-weight: 800; line-height: 1.25;
      letter-spacing: -.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ladder-badge-slot { display: inline-flex; flex: none; }
    .ladder-badge-slot:empty { display: none; }
    .ladder-medal {
      position: relative; display: inline-block; flex-shrink: 0;
      width: var(--ladder-medal-size); height: var(--ladder-medal-size);
      filter: drop-shadow(0 1px 1px rgb(0 0 0 / 25%));
    }
    .ladder-medal-7 { --medal-phase: -1.2s; }
    .ladder-medal-30 { --medal-phase: -2.4s; }
    .ladder-medal[data-place="1"] {
      --medal-light: #fff3bc; --medal-mid: #e6b541; --medal-dark: #8b5515;
      --medal-face-light: #ffedb0; --medal-face-dark: #cf9b36;
      --medal-ink: #4c2e0c; --medal-sheen: rgb(255 249 217 / 95%);
    }
    .ladder-medal[data-place="2"] {
      --medal-light: #f6f9fc; --medal-mid: #bac5d0; --medal-dark: #65727f;
      --medal-face-light: #edf3f9; --medal-face-dark: #a6b2bf;
      --medal-ink: #2e3947; --medal-sheen: rgb(243 250 255 / 85%);
    }
    .ladder-medal[data-place="3"] {
      --medal-light: #f9c9a0; --medal-mid: #c18356; --medal-dark: #794527;
      --medal-face-light: #f3c7a7; --medal-face-dark: #bb7952;
      --medal-ink: #44281a; --medal-sheen: rgb(255 230 204 / 76%);
    }
    .ladder-medal-crown {
      position: absolute; top: 1px; left: 13px; width: 22px; height: 13px;
      clip-path: polygon(0 25%, 24% 54%, 24% 7%, 41% 40%, 50% 0, 59% 40%, 76% 7%, 76% 54%, 100% 25%,
        85% 92%, 69% 100%, 31% 100%, 15% 92%);
      background: linear-gradient(180deg, transparent 68%, var(--medal-dark) 77%, var(--medal-light) 85%, var(--medal-mid) 95%),
        linear-gradient(107deg, var(--medal-dark), var(--medal-light) 23%, var(--medal-mid) 41%, var(--medal-light) 62%, var(--medal-dark));
    }
    .ladder-medal-branch { position: absolute; inset: 7px 4px 1px; }
    .ladder-medal-branch + .ladder-medal-branch { transform: scaleX(-1); }
    .ladder-medal-branch::before {
      content: ""; position: absolute; inset: 1px; border: 1px solid var(--medal-mid); border-radius: 50%;
      clip-path: polygon(50% 50%, 0 1%, 0 100%, 53% 100%);
    }
    .ladder-medal-branch::after {
      content: ""; position: absolute; left: 43%; bottom: 1.5px; width: 7px; height: 1px;
      background: var(--medal-mid); transform: rotate(21deg);
    }
    .ladder-medal-leaf {
      position: absolute; top: 50%; left: 50%;
      transform: rotate(var(--leaf-angle)) translateY(19px);
    }
    .ladder-medal-leaf::before, .ladder-medal-leaf::after {
      content: ""; position: absolute; top: -1.5px; right: -.5px; width: 6px; height: 3px;
      border-radius: 85% 5% 85% 5%; transform-origin: right center;
      background: linear-gradient(160deg, var(--medal-light), var(--medal-mid) 56%, var(--medal-dark));
    }
    .ladder-medal-leaf::before { transform: rotate(-33deg); }
    .ladder-medal-leaf::after { transform: rotate(44deg) scale(.9); }
    .ladder-medal-emblem {
      position: absolute; top: 14px; left: 10px; width: 28px; height: 28px; display: grid; padding: 2.5px;
      overflow: hidden; border-radius: 50%; box-shadow: 0 0 0 .5px var(--medal-dark);
      background: conic-gradient(from -30deg, var(--medal-light), var(--medal-dark) 28%, var(--medal-light) 48%,
        var(--medal-dark) 69%, var(--medal-mid) 83%, var(--medal-light));
    }
    .ladder-medal-emblem::before {
      content: ""; position: absolute; inset-block: 0; left: 0; width: 48%; pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--medal-sheen) 45%, var(--medal-light) 52%, transparent);
      animation: medal-sweep 3.6s ease-in-out var(--medal-phase, 0s) infinite;
    }
    .ladder-medal-mark {
      position: relative; display: grid; place-items: center; border-radius: 50%;
      background: linear-gradient(150deg, var(--medal-face-light) 20%, var(--medal-face-dark) 85%);
      box-shadow: 0 0 0 .5px var(--medal-dark), inset 0 .75px 0 var(--medal-light);
      color: var(--medal-ink); font: 700 14px/1 Georgia, serif; font-variant-numeric: lining-nums tabular-nums;
      text-shadow: 0 .75px 0 var(--medal-light);
    }
    .ladder-medal::before, .ladder-medal::after {
      content: ""; position: absolute; z-index: 1; opacity: 0; pointer-events: none;
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      background: radial-gradient(circle, var(--medal-light), var(--medal-sheen));
      animation: medal-twinkle 3.6s ease-in-out var(--medal-phase, 0s) infinite;
    }
    .ladder-medal::before { left: 9px; top: 13px; width: 10px; height: 10px; }
    .ladder-medal::after {
      right: 8px; top: 31px; width: 8px; height: 8px;
      animation-delay: calc(var(--medal-phase, 0s) + .55s);
    }
    @keyframes medal-sweep {
      0%, 34% { transform: translateX(-160%) skewX(-22deg); }
      74%, 100% { transform: translateX(280%) skewX(-22deg); }
    }
    @keyframes medal-twinkle {
      0%, 37%, 66%, 100% { opacity: 0; transform: scale(.35); }
      50% { opacity: 1; transform: scale(1); }
    }
    .ladder-transfer {
      display: inline-flex; align-items: center; justify-content: flex-end;
      width: var(--ladder-toolbar-action-width); min-height: var(--ladder-toolbar-action-width);
      background: transparent;
    }
    .ladder-preview { padding: 9px 11px; border-radius: 13px; background: var(--button-bg); }
    .ladder-preview p { margin: 0 0 6px; }
    .ladder-preview .ladder-note { margin-bottom: 8px; }
    .ladder-rows { margin: 6px 0 0; padding: 0; list-style: none; }
    .ladder-rows:empty { margin: 0; }
    .ladder-rows li {
      --ladder-row-size: calc(var(--ladder-medal-size) * var(--ladder-medal-scale));
      --ladder-row-gap: 8px;
      display: grid; grid-template-columns: auto var(--ladder-row-gap) minmax(0, 1fr) auto;
      grid-template-rows: var(--ladder-row-size) auto auto;
      grid-template-areas:
        "rank   .      name   total"
        "recent recent recent recent"
        "time   time   time   time";
      row-gap: 5px; align-items: center; padding: 9px 0;
      border-top: 1px solid var(--line); font-variant-numeric: tabular-nums;
    }
    .ladder-rank {
      grid-area: rank; display: grid; place-items: center; min-width: 3ch; height: 100%;
      padding-inline: 2px; color: var(--muted); font-size: 20px; font-weight: 750;
    }
    .ladder-self .ladder-rank { color: var(--ladder-own-rank); }
    .ladder-row-user { grid-area: name; display: flex; gap: 4px; align-items: center; min-width: 0; margin-inline-end: var(--ladder-row-gap); }
    .ladder-row-user .ladder-avatar {
      --ladder-row-avatar-size: calc(var(--ladder-row-size) * .9);
      width: var(--ladder-row-avatar-size); height: var(--ladder-row-avatar-size);
    }
    .ladder-name {
      min-width: 0; font-size: 18px; line-height: var(--ladder-row-size); color: var(--purple); font-weight: 750;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ladder-total {
      grid-area: total; display: grid; align-content: center; height: 100%;
      padding-inline: 8px; border-radius: 11px; background: var(--button-bg); color: var(--blue);
      font-size: 14px; line-height: 1.15; font-weight: 750; text-align: end; overflow-wrap: anywhere; max-width: 15ch;
    }
    .ladder-time { grid-area: time; color: var(--muted); font-size: 11px; }

  <script>
    const locale = (() => {
      const bridge = window.orca?.plugin;
      const byId = id => document.getElementById(id);
      const picker = byId('language-picker'), toggle = byId('language-toggle'), menu = byId('language-menu');
      const search = byId('language-search'), list = byId('language-options'), message = byId('language-message');
      let code = 'en', strings = {}, options = [], saving = false;
      const formatters = new Map();
      const t = (key, ...values) => strings[key]?.replace(/\{(\d+)\}/g, (_, index) => values[index] ?? '') ?? '';
      const normalize = value => value.normalize('NFKD').replace(/\p{M}/gu, '').toLocaleLowerCase().trim();
      const englishNames = new Intl.DisplayNames('en', { type: 'language' });
      const chineseNames = new Intl.DisplayNames('zh-CN', { type: 'language' });

      function messageText(key) {
        message.hidden = !key;
        message.textContent = key ? t(key) : '';
      }

      function renderOptions() {
        const query = normalize(search.value);
        const names = new Intl.DisplayNames(code, { type: 'language' });
        const matches = options.filter(option => [
          option.name, option.code, englishNames.of(option.code), chineseNames.of(option.code), names.of(option.code)
        ].some(value => normalize(value).includes(query)));
        list.replaceChildren(...matches.map(option => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'language-option';
          button.dataset.locale = option.code;
          button.setAttribute('aria-pressed', String(option.code === code));
          button.disabled = saving;
          const flag = document.createElement('img');
          flag.className = 'language-flag';
          flag.src = option.flag;
          flag.alt = '';
          const name = document.createElement('bdi');
          name.className = 'language-name';
          name.lang = option.code;
          name.textContent = option.name;
          button.append(flag, name);
          return button;
        }));
        messageText(matches.length ? '' : 'no-matching-languages');
      }

      function apply({ code: selected, strings: dictionary, options: choices, pluginVersion }) {
        if (typeof pluginVersion === 'string' && pluginVersion) {
          const version = byId('panel-version');
          version.textContent = `v${pluginVersion}`;
          version.hidden = false;
        }
        code = selected;
        strings = dictionary;
        if (choices) options = choices;
        formatters.clear();
        document.documentElement.lang = code;
        for (const root of [document, byId('record-template').content]) {
          for (const element of root.querySelectorAll('[data-i18n]')) element.textContent = t(element.dataset.i18n);
          for (const attribute of ['aria-label', 'title', 'placeholder']) {
            for (const element of root.querySelectorAll(`[data-i18n-${attribute}]`)) {
              element.setAttribute(attribute, t(element.getAttribute(`data-i18n-${attribute}`)));
            }
          }
        }
        const selectedOption = options.find(option => option.code === code);
        if (selectedOption) {
          byId('language-flag').src = selectedOption.flag;
          const name = byId('language-name');
          name.lang = code;
          name.textContent = selectedOption.name;
          toggle.setAttribute('aria-label', t('choose-language', selectedOption.name));
          picker.hidden = false;
        }
        document.dispatchEvent(new Event('tps-language-changed'));
      }

      function setOpen(open, restoreFocus = false) {
        menu.hidden = !open;
        toggle.setAttribute('aria-expanded', String(open));
        if (open) {
          search.value = '';
          renderOptions();
          search.focus();
        } else if (restoreFocus) toggle.focus();
      }

      async function select(selected) {
        if (saving) return;
        if (selected === code) return setOpen(false, true);
        saving = true;
        renderOptions();
        try {
          apply(await bridge.request('tps.locale', { code: selected }, { timeoutMs: 3000 }));
          setOpen(false, true);
        } catch {
          messageText('language-save-failed');
          search.focus();
        } finally {
          saving = false;
          for (const option of list.querySelectorAll('button')) option.disabled = false;
        }
      }

      toggle.addEventListener('click', () => setOpen(menu.hidden));
      search.addEventListener('input', renderOptions);
      list.addEventListener('click', event => {
        const option = event.target.closest('button[data-locale]');
        if (option) void select(option.dataset.locale);
      });
      picker.addEventListener('keydown', event => {
        if (menu.hidden) {
          if (event.key === 'ArrowDown') {
            event.preventDefault();
            setOpen(true);
          }
          return;
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          setOpen(false, true);
        } else if (event.key === 'Enter' && event.target === search) {
          const first = list.querySelector('button:not(:disabled)');
          if (first) void select(first.dataset.locale);
        } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          const visible = [...list.querySelectorAll('button:not(:disabled)')];
          const index = visible.indexOf(document.activeElement);
          const next = event.key === 'ArrowDown' ? visible[index + 1] : visible[index - 1];
          event.preventDefault();
          (next ?? search).focus();
        }
      });
      document.addEventListener('pointerdown', event => {
        if (!menu.hidden && !picker.contains(event.target)) setOpen(false);
      });
      picker.addEventListener('focusout', event => {
        if (!saving && event.relatedTarget && !picker.contains(event.relatedTarget)) setOpen(false);
      });

      function formatted(kind, value, options) {
        const key = JSON.stringify([kind, options]);
        if (!formatters.has(key)) formatters.set(key, new Intl[kind](code, options));
        return formatters.get(key).format(value);
      }
      return {
        ready: bridge?.request('tps.locale', undefined, { timeoutMs: 5000 }).then(apply).catch(() => {}),
        t,
        number: (value, options) => formatted('NumberFormat', value, options),
        date: (value, options) => formatted('DateTimeFormat', value, options)
      };
    })();
    const t = locale.t;
    function formatUsagePeriod(days, hourly) {
      const value = hourly ? days * 24 : days;
      if (hourly && document.documentElement.lang === 'zh-CN') {
        return `${locale.number(value, { useGrouping: false })}时`;
      }
      return locale.number(value, { style: 'unit', unit: hourly ? 'hour' : 'day', unitDisplay: 'short', useGrouping: false });
    }
    const AGENT_LABELS = {
      agy: 'Antigravity CLI', antigravity: 'Antigravity CLI', claude: 'Claude Code', 'claude-desktop': 'Claude Code',
      codex: 'Codex CLI', copilot: 'GitHub Copilot CLI', dsh: 'DeepSeek Harness',
      gemini: 'Gemini CLI', grokbuild: 'Grok Build', hermes: 'Hermes Agent',
      kimi: 'Kimi Code', mcode: 'MiniMax Code', omp: 'Oh My Pi', opencode: 'OpenCode', opencode2: 'OpenCode',
      pi: 'Pi Agent', workbuddy: 'WorkBuddy'
    };
    function updateList(container, items, previous, keyOf, create) {
      const next = new Map();
      let position = container.firstChild;
      const counts = new Map();
      for (const item of items) {
        const signature = keyOf(item);
        const occurrence = counts.get(signature) ?? 0;
        counts.set(signature, occurrence + 1);
        const key = signature + '/' + occurrence;
        const node = previous.get(key) ?? create(item);
        if (node !== position) container.insertBefore(node, position);
        position = node.nextSibling;
        next.set(key, node);
      }
      while (position) {
        const unused = position;
        position = position.nextSibling;
        unused.remove();
      }
      return next;
    }
    const formatMillionTokens = tokens => {
      if (!Number.isFinite(tokens) || tokens < 0) return '—';
      const options = tokens < 1_000_000
        ? { maximumFractionDigits: 6 }
        : { minimumFractionDigits: 2, maximumFractionDigits: 2 };
      return locale.number(tokens / 1_000_000, options) + ' M';
    };

    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const ui = Object.fromEntries(['current-data', 'current-scroll', 'updated', 'refresh', 'error', 'warnings', 'loading', 'records', 'empty', 'empty-text', 'record-template'].map(id => [id, byId(id)]));
      const views = [...byId('panel-tabs').children];
      const lifetime = new AbortController();
      const bridge = window.orca?.plugin;
      let activeTab;
      function openView(tab) {
        activeTab = tab;
        for (const view of views) {
          const selected = view === tab;
          view.setAttribute('aria-selected', String(selected));
          view.tabIndex = selected ? 0 : -1;
          byId(view.getAttribute('aria-controls')).hidden = !selected;
        }
        byId(tab.getAttribute('aria-controls')).dispatchEvent(new Event('tps-view-opened'));
      }
      for (const [index, tab] of views.entries()) {
        tab.addEventListener('click', () => {
          const changed = tab !== activeTab;
          openView(tab);
          if (changed && typeof bridge?.request === 'function') {
            void bridge.request('tps.panel-view', { view: tab.getAttribute('aria-controls') }, { timeoutMs: 3000 }).catch(() => {});
          }
        });
        tab.addEventListener('keydown', event => {
          const next = {
            ArrowLeft: (index + views.length - 1) % views.length,
            ArrowRight: (index + 1) % views.length,
            Home: 0,
            End: views.length - 1
          }[event.key];
          if (next === undefined) return;
          event.preventDefault();
          views[next].focus();
          views[next].click();
        });
      }
      const retiredInstances = new Set();
      const subscriptions = [];
      let current = null;
      let busy = false;
      let problem = null;
      let revision = 0;
      let disposed = false;
      let drawnRecords = '';
      let recordNodes = new Map(), currentFrame;
      let drawnWarnings;
      let resetScroll = false;
      document.addEventListener('DOMContentLoaded', async () => {
        await locale.ready;
        if (activeTab) return;
        const saved = typeof bridge?.request === 'function'
          ? await bridge.request('tps.panel-view', undefined, { signal: lifetime.signal, timeoutMs: 3000 }).catch(() => null)
          : null;
        if (!activeTab && !lifetime.signal.aborted) {
          openView(views.find(tab => tab.getAttribute('aria-controls') === saved?.view) ?? views[0]);
        }
      }, { once: true });

      const numeric = value => typeof value === 'number' && Number.isFinite(value) && value >= 0;
      const outputCount = tokens => numeric(tokens) ? locale.number(tokens) : '—';
      const isSessionLog = record => typeof record?.dataSource === 'string' && record.dataSource.length > 0 && record.dataSource !== 'proxy';
      function number(value, fraction = 0) {
        return numeric(value) ? locale.number(value, { minimumFractionDigits: fraction, maximumFractionDigits: fraction }) : '—';
      }
      const percent = (value, digits) => locale.number(value, {
        style: 'percent', minimumFractionDigits: digits, maximumFractionDigits: digits
      });
      function formatTps(record) {
        const tps = record?.tokensPerSecond;
        if (!numeric(tps) || tps <= 0) return '—';
        const core = number(tps, tps < 1 ? 1 : 0);
        return record?.isEstimatedSpeed ? `≈${core}` : core;
      }
      function speedTooltip(record) {
        const tps = record?.tokensPerSecond;
        const dur = numeric(record?.durationMs) && record.durationMs > 0 ? number(record.durationMs / 1000, 1) : null;
        const ttft = numeric(record?.firstTokenMs) && record.firstTokenMs > 0 ? number(record.firstTokenMs / 1000, 1) : null;
        const session = isSessionLog(record);
        if (numeric(tps) && tps > 0) {
          if (!record?.isEstimatedSpeed) {
            const genMs = numeric(record?.generationMs) ? record.generationMs : (numeric(record?.durationMs) && numeric(record?.firstTokenMs) ? record.durationMs - record.firstTokenMs : null);
            const gen = numeric(genMs) ? number(genMs / 1000, 1) : '—';
            return t('exact-speed-detail', number(tps, 1), dur ?? '—', ttft ?? '—', gen);
          }
          return ttft
            ? t('estimated-speed-first-token', number(tps, 1), dur ?? '—', ttft)
            : t('estimated-speed-duration', number(tps, 1), dur ?? '—');
        }
        if (record?.dataSource === 'proxy') {
          if (!numeric(record.firstTokenMs) || record.firstTokenMs <= 0) return t('missing-first-token-speed');
          if (numeric(record.outputTokens) && record.outputTokens < 100) return t('proxy-output-threshold', outputCount(record.outputTokens));
          return t('proxy-duration-threshold');
        }
        if (session) {
          if (!numeric(record?.durationMs) || record.durationMs <= 0) return t('missing-request-duration');
          if (record.dataSource === 'hermes_log') {
            if (numeric(record.outputTokens) && record.outputTokens < 20) return t('hermes-output-threshold');
            if (record.durationMs < 300) return t('hermes-duration-threshold');
            return t('unknown-speed');
          }
          if (numeric(record.outputTokens) && record.outputTokens < 200) return t('log-output-threshold', outputCount(record.outputTokens));
          if (record.durationMs < 1000) return t('log-duration-threshold', number(record.durationMs));
        }
        return t('unknown-speed');
      }
      function date(value) {
        if (!numeric(value) || value === 0) return null;
        const result = new Date(value);
        return Number.isFinite(result.getTime()) ? result : null;
      }
      function timeLabel(value) {
        const when = date(value);
        return when ? locale.date(when, {
          month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        }) : '—';
      }
      function setValue(element, formatted, exact) {
        element.textContent = formatted;

          for (const { target, isIntersecting } of entries) {
            if (!isIntersecting || !visible() || !waiting.delete(target)) continue;
            observer.unobserve(target);
            void fetchAvatar(target.dataset.username);
          }
        }, { rootMargin: '48px 0px' }) : null;

        function showImage(avatar, image) {
          const img = createImage();
          img.alt = '';
          img.decoding = 'async';
          img.src = image;
          avatar.replaceChildren(img);
          avatar.dataset.avatar = 'image';
        }

        function showFallback(avatar) {
          if (avatar.dataset.avatar === 'fallback') return;
          avatar.replaceChildren(fallback());
          avatar.dataset.avatar = 'fallback';
        }

        function decodes(image) {
          return new Promise(resolve => {
            const img = createImage();
            img.addEventListener('load', () => resolve(true), { once: true });
            img.addEventListener('error', () => resolve(false), { once: true });
            img.src = image;
          });
        }

        function paint(key) {
          const image = images.get(key);
          for (const avatar of slots) {
            if (!avatar.isConnected) slots.delete(avatar);
            else if (keyOf(avatar.dataset.username) === key && avatar.dataset.avatar !== 'image') showImage(avatar, image);
          }
        }

        function fetchAvatar(username) {
          const key = keyOf(username);
          if (!key || images.has(key) || loading.has(key)) return loading.get(key);
          const job = Promise.resolve().then(() => load(username)).then(async image => {
            if (typeof image !== 'string' || !IMAGE_PATTERN.test(image) || !await decodes(image)) return;
            images.set(key, image);
            paint(key);
          }).catch(() => {}).finally(() => loading.delete(key));
          loading.set(key, job);
          return job;
        }

        function stopWaiting(avatar) {
          if (waiting.delete(avatar)) observer.unobserve(avatar);
        }

        function set(avatar, username = '', { retry = false } = {}) {
          const key = keyOf(username), changed = keyOf(avatar.dataset.username) !== key || !avatar.dataset.avatar;
          avatar.dataset.username = username;
          slots.add(avatar);
          if (images.has(key)) {
            stopWaiting(avatar);
            if (avatar.dataset.avatar !== 'image' || changed) showImage(avatar, images.get(key));
            return;
          }
          if (changed) {
            stopWaiting(avatar);
            avatar.dataset.avatar = '';
            showFallback(avatar);
          }
          if (!key || !(changed || retry)) return;
          if (!observer) {
            void fetchAvatar(username);
            return;
          }
          stopWaiting(avatar);
          waiting.add(avatar);
          observer.observe(avatar);
        }

        function dispose() {
          observer?.disconnect();
          waiting.clear();
          slots.clear();
        }

        return { set, dispose };
      }
      // avatar-view:end

      const avatarView = createAvatarView({
        fallback: () => element('avatar-fallback').content.cloneNode(true),
        createImage: () => document.createElement('img'),
        load: async username => (await request('avatar', { username }))?.image,
        visible: () => !group.hidden && !lifetime.signal.aborted,
        Observer: typeof IntersectionObserver === 'function' ? IntersectionObserver : null
      });
      const setAvatar = (avatar, username, options) => avatarView.set(avatar, username, options);

      function medal(rank, period) {
        const place = podium[rank - 1];
        if (!place) return null;
        const badge = document.createElement('span');
        badge.className = 'ladder-medal ladder-medal-' + period.days;
        badge.dataset.place = rank;
        badge.title = t('medal-position', t(period.title), t(place));
        badge.setAttribute('role', 'img');
        badge.setAttribute('aria-label', badge.title);
        const crown = document.createElement('span'), branch = document.createElement('span');
        const emblem = document.createElement('span'), mark = document.createElement('span');
        crown.className = 'ladder-medal-crown';
        branch.className = 'ladder-medal-branch';
        for (let angle = 15; angle <= 135; angle += 20) {
          const leaf = document.createElement('span');
          leaf.className = 'ladder-medal-leaf';
          leaf.style.setProperty('--leaf-angle', `${angle}deg`);
          branch.append(leaf);
        }
        emblem.className = 'ladder-medal-emblem';
        mark.className = 'ladder-medal-mark';
        mark.textContent = period.mark;
        emblem.append(mark);
        badge.append(crown, branch, branch.cloneNode(true), emblem);
        return badge;
      }

      const usageChartLabel = () => t(rankDays === 1 ? 'leaderboard-five-minute-usage' : 'leaderboard-daily-usage');
      const speedText = value => Number.isFinite(value) ? `${locale.number(value, {
        maximumFractionDigits: 1, ...(value >= 10_000 ? { notation: 'scientific' } : {}) })} tokens/s` : '—';
      const leaderboardTime = time => locale.date(time, { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
      const toolText = (model, cli) => `${model ?? '—'} · ${Object.hasOwn(AGENT_LABELS, cli) ? AGENT_LABELS[cli] : cli ?? '—'}`;
      const chartVerticalPadding = 4;

      function dailyUsagePoints(daily, left, days) {
        if (!Array.isArray(daily)) return [];
        const totals = new Map(daily.map(point => [point.at ?? point.day, point]));
        return Array.from({ length: days }, (_, offset) => {
          const at = left + offset * DAY_MS;
          const day = new Date(at + 8 * 60 * 60 * 1000).toISOString().slice(0, 10);
          const value = totals.get(at) ?? totals.get(day);
          return { day, tokens: value?.tokens ?? 0,
            ...(value?.day && Number.isFinite(value.at) ? { packetDay: value.day } : {}),
            ...(typeof value?.complete === 'boolean' ? { at, complete: value.complete } : {}) };
        });
      }

      function dailyUsagePath(points, x, y) {
        const levels = points.map(y);
        const changes = levels.slice(1).map((level, index) => level - levels[index]);
        const tangents = levels.map((_, index) => {
          const before = changes[index - 1] ?? changes[index];
          const after = changes[index] ?? before;
          // Keep peaks, valleys, and flat stretches within the recorded range.
          return before * after > 0 ? 2 * before * after / (before + after) : 0;
        });
        const line = new Path2D();
        let startX = x(points[0]);
        line.moveTo(startX, levels[0]);
        for (let index = 1; index < points.length; index++) {
          const endX = x(points[index]);
          const third = (endX - startX) / 3;
          line.bezierCurveTo(
            startX + third, levels[index - 1] + tangents[index - 1] / 3,
            endX - third, levels[index] - tangents[index] / 3,
            endX, levels[index]
          );
          startX = endX;
        }
        return line;
      }

      function paintUsagePath(ctx, line, baseline, firstX, lastX) {
        const colors = window.getComputedStyle(document.documentElement);
        const low = colors.getPropertyValue('--usage-wave-low').trim();
        const high = colors.getPropertyValue('--speed').trim();

        const area = new Path2D(line);
        area.lineTo(lastX, baseline);
        area.lineTo(firstX, baseline);
        area.closePath();

        const gradient = ctx.createLinearGradient(0, baseline, 0, chartVerticalPadding);
        gradient.addColorStop(0, low);
        gradient.addColorStop(1, high);
        ctx.strokeStyle = ctx.fillStyle = gradient;
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.fill(area);
        ctx.restore();
        ctx.stroke(line);
      }

      function pulseX(point, left, width) {
        const offset = Math.max(0, Math.min(1, (point.submittedAt - left) / RECENT_STATS_MS));
        return width * offset;
      }

      function drawSubmissionPulses(chart, points, left, animateAfter) {
        const maximum = Math.max(1, ...points.map(point => point.deltaTokens));
        const animate = points.some(point => point.submittedAt > animateAfter) &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let frame, startedAt;

        function schedule() {
          if (frame === undefined) frame = requestAnimationFrame(draw);
        }

        function draw(time) {
          frame = undefined;
          if (!chart.isConnected || lifetime.signal.aborted) return;
          const { width, height } = chart.getBoundingClientRect(), density = window.devicePixelRatio || 1;
          if (width <= 0 || height <= 2 * chartVerticalPadding) return;
          const pixelWidth = Math.round(width * density), pixelHeight = Math.round(height * density);
          if (chart.width !== pixelWidth) chart.width = pixelWidth;
          if (chart.height !== pixelHeight) chart.height = pixelHeight;
          const ctx = chart.getContext('2d');
          if (!ctx) return;
          ctx.setTransform(pixelWidth / width, 0, 0, pixelHeight / height, 0, 0);
          ctx.clearRect(0, 0, width, height);
          const baseline = height - chartVerticalPadding;
          ctx.lineWidth = 1.4;
          ctx.lineCap = ctx.lineJoin = 'round';
          const halfWidth = Math.min(3.25, width / 70);
          startedAt ??= time;
          const progress = animate ? Math.min(1, (time - startedAt) / 200) : 1;
          const riseAt = point => point.submittedAt > animateAfter ? 1 - (1 - progress) ** 2 : 1;
          const line = new Path2D();
          line.moveTo(0, baseline);
          for (const point of points) {
            const x = pulseX(point, left, width);
            if (point.deltaTokens > 0) {
              const peak = baseline - Math.max(1.5, (baseline - chartVerticalPadding) * point.deltaTokens / maximum) * riseAt(point);
              line.lineTo(Math.max(0, x - halfWidth), baseline);
              line.bezierCurveTo(x - halfWidth * 0.54, baseline, x - halfWidth * 0.38, peak, x, peak);
              line.bezierCurveTo(x + halfWidth * 0.38, peak, x + halfWidth * 0.54, baseline, x + halfWidth, baseline);
            } else line.lineTo(x, baseline);
          }
          line.lineTo(width, baseline);
          paintUsagePath(ctx, line, baseline, 0, width);
          for (const point of points) {
            if (point.deltaTokens > 0) continue;
            ctx.beginPath();
            ctx.arc(pulseX(point, left, width), baseline, 1.4 * riseAt(point), 0, Math.PI * 2);
            ctx.fill();
          }
          if (progress < 1) schedule();
        }

        usagePainters.set(chart, schedule);
        schedule();
      }

      function usageCard({ recent, daily }, now, animateAfter, windowStart) {
        const container = document.createElement('div'), chart = document.createElement('canvas');
        container.className = 'ladder-recent';
        chart.className = 'ladder-chart';
        chart.width = 320;
        chart.height = 60;
        chart.setAttribute('role', 'img');
        chart.setAttribute('aria-label', usageChartLabel());
        const byDay = rankDays > 1;
        const dateLabel = time => locale.date(time, { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric' });
        const timeOf = point => byDay ? point.at : point.submittedAt;
        const tokensOf = point => byDay ? point.tokens : point.deltaTokens;
        const span = byDay ? (rankDays - 1) * DAY_MS : RECENT_STATS_MS;
        const left = byDay ? windowStart : now - span;
        const points = byDay ? dailyUsagePoints(daily, left, rankDays) : recent?.points ?? [];
        const latestPoint = points.at(-1);
        const pointTitle = point => byDay ? (point.packetDay
          ? `${dateLabel(Date.parse(point.packetDay + 'T00:00:00+08:00'))} · ${formatMillionTokens(point.tokens)}`
          : `${dateLabel(point.at)} – ${dateLabel(point.at + DAY_MS)} · ${formatMillionTokens(point.tokens)}`) +
          (point.complete === false ? ` · ${t('leaderboard-usage-incomplete')}` : '')
          : `${shortClock(point.submittedAt)} · ${formatMillionTokens(point.deltaTokens)} · ${speedText(point.avgTps)}`;
        const emptyTitle = byDay ? usageChartLabel() : `${usageChartLabel()}\n${formatMillionTokens(0)} · ${speedText(0)}`;
        chart.title = latestPoint ? `${usageChartLabel()}\n${pointTitle(latestPoint)}` : emptyTitle;
        container.append(chart);
        if (byDay) {
          const axis = document.createElement('div');
          axis.className = 'ladder-chart-axis';
          for (const offset of [0, Math.round((rankDays - 1) / 2), rankDays - 1]) {
            const label = document.createElement('span');
            label.textContent = dateLabel(left + offset * DAY_MS + (rankingMode === 'hourly' ? DAY_MS - 1 : 0));
            axis.append(label);
          }
          container.append(axis);
          if (!latestPoint) return container;
          const width = chart.width, height = chart.height - chartVerticalPadding * 2;
          const maximum = Math.max(1, ...points.map(tokensOf));
          const x = point => width * Math.min(1, (timeOf(point) - left) / span);
          const y = point => chartVerticalPadding + height * (1 - tokensOf(point) / maximum);
          const paint = () => {
            const ctx = chart.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, chart.width, chart.height);
            ctx.lineWidth = 2;
            paintUsagePath(ctx, dailyUsagePath(points, x, y), chart.height - chartVerticalPadding, x(points[0]), x(latestPoint));
            for (const point of points) {
              ctx.beginPath();
              ctx.arc(x(point), y(point), 3, 0, Math.PI * 2);
              ctx.fill();
            }
          };
          usagePainters.set(chart, paint);
          paint();
          chart.addEventListener('pointermove', event => {
            const rect = chart.getBoundingClientRect();
            const position = (event.clientX - rect.left) * chart.width / rect.width;
            const nearest = points.reduce((a, b) => Math.abs(x(a) - position) <= Math.abs(x(b) - position) ? a : b);
            chart.title = Math.abs(x(nearest) - position) > width * DAY_MS / span / 2 ? usageChartLabel() : pointTitle(nearest);
          });
        } else {
          const meta = document.createElement('div'), tools = document.createElement('span');
          const speed = document.createElement('strong');
          meta.className = 'ladder-recent-meta';
          tools.className = 'ladder-recent-tools';
          tools.textContent = toolText(recent?.topModel, recent?.topCli);
          tools.title = tools.textContent;
          speed.className = 'ladder-recent-speed';
          speed.textContent = speedText(latestPoint?.avgTps ?? 0);
          speed.title = t('leaderboard-average-speed');
          meta.append(tools, speed);
          container.append(meta);
          drawSubmissionPulses(chart, points, left, animateAfter);
          if (!latestPoint) return container;
          chart.addEventListener('pointermove', event => {
            const { left: edge, width } = chart.getBoundingClientRect();
            const distance = point => Math.abs(pulseX(point, left, width) - (event.clientX - edge));
            const nearest = points.reduce((a, b) => distance(a) <= distance(b) ? a : b);
            chart.title = distance(nearest) <= 10 ? pointTitle(nearest) : emptyTitle;
          });
        }
        return container;
      }

      function renderRows(rows, username, ranking) {
        const now = Date.now();
        const speedBoard = rankDays === 0;
        nextRecentExpiry = Infinity;
        if (speedBoard) {
          const offset = ranking?.clockOffset ?? 0;
          const expiry = ({ submittedAt }) => {
            if (!Number.isFinite(ranking?.windowStart)) return submittedAt + DAY_MS - offset;
            if (rankingMode === 'hourly') return Math.floor(submittedAt / HOUR_MS) * HOUR_MS + DAY_MS + HOUR_MS - offset;
            return Math.floor((submittedAt + 8 * HOUR_MS) / DAY_MS) * DAY_MS + DAY_MS - 8 * HOUR_MS - offset;
          };
          rows = rows.filter(row => expiry(row) > now)
            .map((row, index) => ({ ...row, rank: index + 1 }));
          for (const row of rows) nextRecentExpiry = Math.min(nextRecentExpiry, expiry(row));
        }
        rows = rows.map(row => {
          if (!row.recent) return row;
          const points = row.recent.points.filter(point => point.submittedAt > now - RECENT_STATS_MS && point.submittedAt <= now);
          if (points.length) nextRecentExpiry = Math.min(nextRecentExpiry, points[0].submittedAt + RECENT_STATS_MS);
          return { ...row, recent: { ...row.recent, points } };
        });
        const previousPulses = animateToday && pulseDay === renderedDay ? latestPulses : null;
        pulseDay = rankDays === 1 ? renderedDay : '';
        latestPulses = new Map(rankDays === 1 ? rows.map(row => [row.username, row.recent?.points.at(-1)?.submittedAt ?? -Infinity]) : []);
        const signature = JSON.stringify([rankingMode, rankDays, ranking?.windowStart, username, rows]);
        if (signature === drawnRows) return;
        const period = speedBoard ? speedPeriod : periods.find(entry => entry.days === rankDays);
        drawnRows = signature;
        const keyOf = row => JSON.stringify([rankingMode, rankDays, ranking?.windowStart, username === row.username, row]);
        rankingNodes = updateList(element('rows'), rows, rankingNodes, keyOf, row => {
          const item = document.createElement('li');
          if (username && row.username === username) item.classList.add('ladder-self');
          if (speedBoard) item.classList.add('ladder-speed-row');
          const rank = document.createElement('span'), name = document.createElement('span'), user = document.createElement('div');
          const total = document.createElement('strong'), time = document.createElement('time');
          rank.className = 'ladder-rank';
          name.className = 'ladder-name';
          user.className = 'ladder-row-user';
          total.className = 'ladder-total';
          time.className = 'ladder-time';
          rank.textContent = locale.number(row.rank);
          name.textContent = row.username;
          name.dir = 'auto';
          name.title = row.username;
          const avatar = document.createElement('span');
          avatar.className = 'ladder-avatar';
          avatar.setAttribute('aria-hidden', 'true');
          setAvatar(avatar, row.username);
          const badge = period && medal(row.rank, period);
          if (badge) user.append(badge);
          user.append(avatar, name);
          total.textContent = speedBoard ? speedText(row.avgTps) : formatMillionTokens(row.tokens);
          if (speedBoard) total.title = t('leaderboard-average-speed');
          const shownAt = speedBoard ? row.submittedAt : (row.lastUploadAt ?? row.submittedAt);
          const shownTime = speedBoard ? leaderboardTime(shownAt) : clock(shownAt);
          time.setAttribute('data-localized-text', '');
          time.textContent = (speedBoard ? shownTime : t('last-upload-at', shownTime)) +
            (row.complete === false ? ` · ${t('leaderboard-usage-incomplete')}` : '');
          time.dateTime = new Date(shownAt).toISOString();
          item.append(rank, user, total);
          if (speedBoard) {
            const meta = document.createElement('div');
            const tools = document.createElement('span');
            meta.className = 'ladder-recent ladder-recent-meta';
            tools.className = 'ladder-recent-tools';
            tools.textContent = toolText(row.topModel, row.topCli);
            tools.title = tools.textContent;
            meta.append(tools);
            if (Number.isSafeInteger(row.deltaTokens)) {
              const tokens = document.createElement('bdi');
              tokens.className = 'ladder-speed-tokens';
              tokens.textContent = `${locale.number(row.deltaTokens)} tokens`;
              meta.append(tokens);
            }
            item.append(meta);
          } else item.append(usageCard(row, now, previousPulses?.get(row.username) ?? Infinity, ranking.windowStart));
          item.append(time);
          return item;
        });
        // Rows changed after a sync: give a still-default account avatar another chance too.
        setAvatar(element('account-avatar'), username, { retry: true });
      }

      function renderAccount(username) {
        const identity = element('mine');
        identity.textContent = username || t('signed-in-label');
        identity.title = username ?? '';
        setAvatar(element('account-avatar'), username);
        if (!rankingAccess) return;
        for (const period of periods) {
          const ranking = cachedRankings.get(period.days);
          const row = username && ranking?.rows.find(row => row.username === username);
          let rankText = '—';
          if (row) rankText = t('rank-position', locale.number(row.rank));
          else if (username && ranking && !rankingProblem) rankText = t('rank-not-listed');
          element('user-rank-' + period.days).textContent = rankText;
          element('user-tokens-' + period.days).textContent = formatMillionTokens(row?.tokens);
          const place = row?.rank >= 1 && row.rank <= podium.length ? row.rank : 0;
          const slot = element('user-badge-' + period.days);
          if (Number(slot.dataset.place ?? 0) === place) continue;
          slot.dataset.place = place;
          slot.querySelector('.ladder-medal')?.remove();
          if (place) slot.append(medal(place, period));
        }
      }

      const successfulUploadCodes = new Set(['accepted', 'initialized', 'duplicate']);

      function uploadFailure(snapshot) {
        const record = snapshot?.lastUpload;
        if (Number.isFinite(record?.at) && !record.rollingOnly && !successfulUploadCodes.has(record.code)) {
          const reason = messageFor(record.code) ?? t('sync-failure-unknown');
          return successfulUploadCodes.has(record.rollingCode) ? t('rolling-upload-succeeded-daily-failed', reason)
            : t('last-sync-failed', shortClock(record.at), reason);
        }
        if (snapshot?.rollingProblem) {
          const reason = messageFor(snapshot.rollingProblem) ?? t('sync-failure-unknown');
          return t(record?.rollingOnly ? 'rolling-upload-failed' : 'daily-upload-succeeded-rolling-failed', reason);
        }
        return '';
      }

      function renderTransferStatus(indicator, active, label, problem) {
        indicator.setAttribute('aria-busy', String(active));
        const failed = !active && Boolean(problem);
        indicator.classList.toggle('is-failed', failed);
        const text = t(label);
        if (indicator.title !== text) indicator.title = text;
        const accessible = failed ? `${text} · ${problem}` : text;
        if (indicator.getAttribute('aria-label') !== accessible) indicator.setAttribute('aria-label', accessible);
      }

      function renderUploadStatus(snapshot, signedIn, time) {
        const uploading = Boolean(signedIn && snapshot?.uploading);
        const locked = snapshot?.board?.lockedUntil > time;
        const problem = signedIn && (uploadFailure(snapshot) || (locked ? messageFor('locked') : ''));
        renderTransferStatus(element('upload-state'), uploading, uploading ? 'uploading' : 'data-upload', problem);
      }

      function renderDownloadStatus() {
        const downloading = Boolean(rankingPending);
        const problem = rankingProblem && (messageFor(rankingProblem) ?? t('leaderboard-unavailable'));
        renderTransferStatus(element('download-state'), downloading, downloading ? 'sync-in-progress' : 'period-rankings', problem);
      }

      function scheduleUploadUnlock(lockedUntil, time) {
        const deadline = Number(lockedUntil);
        const next = Number.isFinite(deadline) && deadline > time ? deadline : undefined;
        if (next === uploadUnlockAt) return;
        clearTimeout(uploadUnlockWake);
        uploadUnlockAt = next;
        uploadUnlockWake = next === undefined ? undefined : setTimeout(() => {
          uploadUnlockAt = uploadUnlockWake = undefined;
          render();
        }, Math.min(next - time, 2_147_483_647));
      }

      function renderToolbarTime(note, lastAt) {
        const validTime = Number.isFinite(lastAt);
        const text = validTime ? shortClock(lastAt) : '—';
        note.title = validTime ? clock(lastAt) : '';
        if (note.textContent !== text) note.textContent = text;
        if (validTime) note.dateTime = new Date(lastAt).toISOString();
        else note.removeAttribute('datetime');
      }

      function renderRangeLabels() {
        const hourly = rankingMode === 'hourly';
        for (const label of rangeLabels) {
          label.textContent = formatUsagePeriod(Number(label.dataset.ladderRange), hourly);
        }
      }

      function render(code = messageCode) {
        messageCode = code;
        if (group.hidden) return;
        renderedDay = boardDay();
        const time = Date.now();
        const snapshot = session ?? {};
        const { board: account = {}, sessionProblem, initializing, historyProblem } = snapshot;
        const ranking = rankingAccess ? cachedRankings.get(rankDays) : null;
        const freshness = element('freshness');
        const notice = !ranking && !rankingProblem ? t('loading-leaderboard') : '';
        if (freshness.textContent !== notice) freshness.textContent = notice;
        freshness.hidden = !notice;
        renderToolbarTime(element('refresh-time'), ranking?.updatedAt ?? null);
        const signedIn = snapshot.signedIn ?? account.authenticated;
        const checkingLogin = typeof signedIn !== 'boolean';
        element('controls').hidden = false;
        element('sign-in').hidden = checkingLogin || signedIn || Boolean(pendingLogin);
        element('login').disabled = busy;
        element('login-wait').hidden = !pendingLogin;
        element('account').hidden = !signedIn;
        element('personal-data').hidden = !signedIn;
        element('logout').disabled = busy;
        const logoutNote = element('logout-pending');
        const logoutText = snapshot.logoutStorageFailed ? t('logout-storage-failed')
          : snapshot.logoutPending ? t('logout-pending') : '';
        if (logoutNote.textContent !== logoutText) logoutNote.textContent = logoutText;
        logoutNote.hidden = !logoutText;
        const sessionStatus = checkingLogin ? t('checking-login') : '';
        scheduleUploadUnlock(account.lockedUntil, time);
        const authProblem = pendingLogin ? undefined : messageFor(sessionProblem);
        const actionMessage = messageFor(code);
        const preferenceProblem = rankingPreferenceFailed ? t('ranking-preference-failed') : undefined;
        element('status').textContent = authProblem ?? actionMessage ?? messageFor(loginProblem) ?? preferenceProblem ??
          (account.banned ? messageFor('banned') : messageFor(historyProblem)) ??
          (initializing ? messageFor('history_pending') : sessionStatus);
        const speedBoard = rankDays === 0;
        element('rows').setAttribute('aria-label', t(speedBoard ? 'leaderboard-speed-tab' : 'period-rankings'));
        element('empty').textContent = t('empty-rankings');
        const username = signedIn ? account.username : '';
        renderRows(ranking?.rows ?? [], username, ranking);
        element('empty').hidden = !ranking || rankingNodes.size > 0;
        if (signedIn) renderAccount(username);
        renderUploadStatus(snapshot, signedIn, time);
        renderToolbarTime(element('sync-result'), signedIn ? snapshot.lastSyncAt : null);
        renderDownloadStatus();
      }

      function scheduleRender() {
        if (group.hidden || lifetime.signal.aborted || leaderboardFrame !== undefined) return;
        leaderboardFrame = requestAnimationFrame(() => { leaderboardFrame = undefined; render(); });
      }

      async function showCache(days = rankDays) {
        const signal = rankingAccess?.signal;
        if (!signal || cachedRankings.size) return;
        const mode = rankingMode;
        const { ranking } = await request('window-cache', { days, mode }, signal);
        if (!signal.aborted && mode === rankingMode && cacheRankings(ranking?.boards, ranking?.updatedAt)) scheduleRender();
      }

      async function refreshSession() {
        if (restoringSession || busy || lifetime.signal.aborted) return;
        restoringSession = true;
        const requestedAt = revision;
        const requestedVersion = sessionPushVersion;
        try {
          const result = await request('session');
          if (lifetime.signal.aborted || revision !== requestedAt || requestedVersion !== sessionPushVersion ||
              typeof result.signedIn !== 'boolean') return;
          session = result;
          scheduleRender();
        } finally { restoringSession = false; }
      }

      function cacheRankings(boards, updatedAt) {
        if (!rankingAccess || !boards || !Number.isSafeInteger(updatedAt) || cachedRankings.get(0)?.updatedAt > updatedAt) return false;
        for (const [hours, board] of Object.entries(boards)) cachedRankings.set(Number(hours) / 24, { ...board, updatedAt });
        return true;
      }

      async function refresh(days = rankDays, force = false) {
        const signal = rankingAccess?.signal;
        if (!signal || group.hidden || lifetime.signal.aborted) return;
        if (renderedDay !== boardDay()) render('');
        if (rankingPending) return rankingPending;
        if (!force && Date.now() < nextRankRefresh) return;
        const startedAt = Date.now();
        const mode = rankingMode;
        const pending = (async () => {
          const result = await request('window-state', { days, mode, force }, signal);
          if (signal.aborted || rankingPending !== pending) return;
          const updated = cacheRankings(result.boards, result.updatedAt);
          rankingProblem = updated ? undefined : result.code ?? 'unavailable';
          const next = result.nextAt - (result.boards?.[0]?.clockOffset ?? 0);
          nextRankRefresh = updated && Number.isFinite(result.refreshAt) ? result.refreshAt
            : updated && result.nextAt - result.cutoffAt === 3_600_000 && next > result.updatedAt
              ? next : (updated ? result.updatedAt : startedAt) + RANK_REFRESH_MS;
          render();
          if (updated && rankDays === 1) animateToday = true;
        })().finally(() => {
          if (rankingPending !== pending) return;
          rankingPending = undefined;
          if (!group.hidden && !lifetime.signal.aborted) {
            const now = Date.now();
            renderDownloadStatus();
            clearTimeout(rankWake);
            if (rankingAccess && Number.isFinite(nextRankRefresh)) rankWake = setTimeout(() => void refresh(), Math.max(0, nextRankRefresh - now));
          }
        });
        rankingPending = pending;
        renderDownloadStatus();
        return pending;
      }

      function showCachedRanking() {
        animateToday = false;
        render('');
        if (!session) void refreshSession();
        if (!rankingAccess) return;
        void showCache();
        void refresh(rankDays, true);
      }

      function selectRankingMode(mode) {
        if (mode === rankingMode) return;
        rankingMode = mode;
        for (const option of modeButtons) option.setAttribute('aria-pressed', String(option.dataset.ladderMode === mode));
        clearTimeout(rankWake);
        rankingPending = nextRankRefresh = rankingProblem = undefined;
        cachedRankings.clear();
        renderRangeLabels();
        showCachedRanking();
      }

      function setRankingEnabled(enabled) {
        const toggle = element('rank-toggle');
        const notice = element('ranking-notice');
        notice.hidden = enabled;
        if (enabled) toggle.removeAttribute('aria-describedby');
        else toggle.setAttribute('aria-describedby', notice.id);
        if (enabled === Boolean(rankingAccess)) return;
        toggle.setAttribute('aria-checked', String(enabled));
        element('rank-toolbar').classList.toggle('is-off', !enabled);
        element('ranking-content').hidden = !enabled;
        element('personal-ranks').hidden = !enabled;
        if (enabled) {
          rankingAccess = new AbortController();
          if (!group.hidden) showCachedRanking();
        } else {
          rankingAccess.abort();
          clearTimeout(rankWake);
          rankingAccess = rankingPending = nextRankRefresh = rankingProblem = undefined;
          cachedRankings.clear();
          nextRecentExpiry = Infinity;
          render('');
        }
      }

      async function logout() {
        if (busy) return;
        busy = true;
        const requestedAt = ++revision;
        pendingLogin = undefined;
        loginProblem = '';
        clearTimeout(retryLogin);
        let result;
        try {
          render('');
          result = await request('logout');
        } finally { busy = false; }
        if (lifetime.signal.aborted) return;
        if (revision !== requestedAt) { render(); return; }
        if (typeof result.signedIn === 'boolean') session = result;
        render(result.code);
      }

      async function poll() {
        if (!pendingLogin || lifetime.signal.aborted) return;
        const attempt = pendingLogin;
        const result = await request('poll');
        if (attempt !== pendingLogin || lifetime.signal.aborted) return;
        if (['pending', 'unavailable', 'rate_limited'].includes(result.code) && Date.now() < attempt.expiresAt) {
          if (result.code !== 'pending') render(result.code);
          retryLogin = setTimeout(poll, attempt.interval);
          return;
        }
        revision++;
        pendingLogin = undefined;
        if (result.code === 'signed_in') {
          if (typeof result.signedIn === 'boolean') session = result;
          render(result.code);
        } else {
          loginProblem = Date.now() >= attempt.expiresAt ? 'login_expired' : result.code;
          render(loginProblem);
        }
      }

      if (!bridge?.request) return;
      for (const button of modeButtons) button.addEventListener('click', () => selectRankingMode(button.dataset.ladderMode));
      renderRangeLabels();
      for (const tab of rankTabs) tab.addEventListener('click', () => {
        if (!rankingAccess) return;
        const days = Number(tab.dataset.rankDays);
        if (days === rankDays) return;
        rankDays = days;
        for (const tab of rankTabs) tab.setAttribute('aria-pressed', String(Number(tab.dataset.rankDays) === days));
        animateToday = false;
        render('');
        if (!cachedRankings.size) void showCache(days);
        void refresh(days);
      });
      group.addEventListener('tps-view-opened', showCachedRanking);
      window.addEventListener('online', () => {
        animateToday = false;
        void refresh(rankDays, true);
      }, { signal: lifetime.signal });
      function redrawUsageCharts() {
        for (const chart of element('rows').querySelectorAll('.ladder-chart')) usagePainters.get(chart)?.();
      }
      const usageResize = new ResizeObserver(redrawUsageCharts);
      const usageTheme = new MutationObserver(redrawUsageCharts);
      usageResize.observe(element('rows'));
      usageTheme.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      document.addEventListener('tps-language-changed', () => {
        renderRangeLabels();
        drawnRows = '';
        rankingNodes.clear();
        for (const { days } of periods) delete element('user-badge-' + days).dataset.place;
        render();
      }, { signal: lifetime.signal });
      const rankToggle = element('rank-toggle');
      rankToggle.addEventListener('click', async () => {
        const enabled = !rankingAccess;
        const version = rankingPreferenceVersion;
        rankToggle.disabled = true;
        rankingPreferenceFailed = false;
        if (!enabled) setRankingEnabled(false);
        const preference = await request('ranking-preference', { enabled });
        if (lifetime.signal.aborted) return;
        rankingPreferenceFailed = preference.saved !== true;
        if (version === rankingPreferenceVersion && typeof preference.enabled === 'boolean') {
          setRankingEnabled(preference.enabled);
        }
        rankToggle.disabled = false;
        render();
      });
      element('login').addEventListener('click', async () => {
        if (busy || pendingLogin) return;
        busy = true;
        revision++;
        loginProblem = '';
        let attempt;
        render('');
        try {
          const draft = await request('login');
          if (lifetime.signal.aborted) return;
          if (!draft.loginUrl) {
            loginProblem = draft.code ?? 'unavailable';
            render(loginProblem);
            return;
          }
          attempt = { ...draft, expiresAt: Date.now() + draft.timeout };
          pendingLogin = attempt;
          render('');
          const result = await window.orca.shell.openExternal(attempt.loginUrl);
          if (pendingLogin !== attempt) return;
          if (result?.opened) {
            retryLogin = setTimeout(poll, attempt.interval);
            return;
          }
          pendingLogin = undefined;
          loginProblem = 'browser_unavailable';
          render(loginProblem);
        } catch {
          if (pendingLogin !== attempt) return;
          pendingLogin = undefined;
          loginProblem = 'browser_unavailable';
          render(loginProblem);
        } finally {
          busy = false;
          if (!lifetime.signal.aborted) render();
        }
      });
      element('stop-login').addEventListener('click', async () => {
        revision++;
        const attempt = pendingLogin;
        pendingLogin = undefined;
        loginProblem = '';
        clearTimeout(retryLogin);
        render('');
        if (attempt) await request('cancel', { loginUrl: attempt.loginUrl });
      });
      element('logout').addEventListener('click', () => void logout());
      rankingSubscription = bridge.on?.('tps.leaderboard.session', next => {
        if (lifetime.signal.aborted || typeof next?.signedIn !== 'boolean') return;
        sessionPushVersion += 1;
        session = next;
        scheduleRender();
      });
      rankingPreferenceSubscription = bridge.on?.('tps.leaderboard.ranking-preference', preference => {
        if (lifetime.signal.aborted || typeof preference?.enabled !== 'boolean') return;
        rankingPreferenceVersion++;
        setRankingEnabled(preference.enabled);
      });
      void request('ranking-preference').then(preference => {
        if (lifetime.signal.aborted) return;
        if (!rankingPreferenceVersion) setRankingEnabled(preference.enabled !== false);
        rankToggle.disabled = false;
      });
      void refreshSession();
      const interval = setInterval(() => {
        if (group.hidden) return;
        if (Date.now() >= nextRecentExpiry) render();
        if (rankingAccess) void refresh();
      }, 1000);
      window.addEventListener('pagehide', () => {
        lifetime.abort();
        rankingAccess?.abort();
        avatarView.dispose();
        usageResize.disconnect();
        usageTheme.disconnect();
        rankingSubscription?.dispose();
        rankingPreferenceSubscription?.dispose();
        cancelAnimationFrame(leaderboardFrame);
        clearTimeout(retryLogin);
        clearTimeout(rankWake);
        clearTimeout(uploadUnlockWake);
        clearInterval(interval);
      }, { once: true });
    })();
  </script>
</body>
</html>
