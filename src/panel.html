  <script>
    const byId = id => document.getElementById(id);
    const bridge = window.orca?.plugin;
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
    const readStore = key => { try { return localStorage.getItem(key); } catch { return null; } };
    const writeStore = (key, value) => { try { if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value); return true; } catch { return false; } };
    const clampInt = (value, min, max, fallback) => { const n = Number(value); return Number.isFinite(n) ? Math.min(max, Math.max(min, Math.round(n))) : fallback; };

    const locale = (() => {
      const picker = byId('language-picker'), toggle = byId('language-toggle'), menu = byId('language-menu');
      const search = byId('language-search'), list = byId('language-options'), message = byId('language-message');
      let code = 'en', strings = {}, options = [], saving = false;
      const formatters = new Map();
      const t = (key, ...values) => strings[key]?.replace(/\{(\d+)\}/g, (_, i) => values[i] ?? '') ?? '';
      const normalize = value => value.normalize('NFKD').replace(/\p{M}/gu, '').toLocaleLowerCase().trim();
      const englishNames = new Intl.DisplayNames('en', { type: 'language' });
      const chineseNames = new Intl.DisplayNames('zh-CN', { type: 'language' });
      const messageText = key => { message.hidden = !key; message.textContent = key ? t(key) : ''; };

      function renderOptions() {
        const query = normalize(search.value);
        const names = new Intl.DisplayNames(code, { type: 'language' });
        const matches = options.filter(o => [o.name, o.code, englishNames.of(o.code), chineseNames.of(o.code), names.of(o.code)].some(v => normalize(v).includes(query)));
        list.replaceChildren(...matches.map(o => {
          const btn = el('button', 'language-option');
          btn.type = 'button'; btn.dataset.locale = o.code; btn.disabled = saving;
          btn.setAttribute('aria-pressed', String(o.code === code));
          const flag = el('img', 'language-flag'); flag.src = o.flag; flag.alt = '';
          const name = el('bdi', 'language-name', o.name); name.lang = o.code;
          btn.append(flag, name);
          return btn;
        }));
        messageText(matches.length ? '' : 'no-matching-languages');
      }

      function apply({ code: selected, strings: dictionary, options: choices, pluginVersion }) {
        if (typeof pluginVersion === 'string' && pluginVersion) {
          const version = byId('panel-version'); version.textContent = `v${pluginVersion}`; version.hidden = false;
        }
        code = selected; strings = dictionary; if (choices) options = choices;
        formatters.clear();
        document.documentElement.lang = code;
        for (const root of [document, byId('record-template').content]) {
          for (const node of root.querySelectorAll('[data-i18n]')) node.textContent = t(node.dataset.i18n);
          for (const attr of ['aria-label', 'title', 'placeholder']) {
            for (const node of root.querySelectorAll(`[data-i18n-${attr}]`)) node.setAttribute(attr, t(node.getAttribute(`data-i18n-${attr}`)));
          }
        }
        const selectedOption = options.find(o => o.code === code);
        if (selectedOption) {
          byId('language-flag').src = selectedOption.flag;
          const name = byId('language-name'); name.lang = code; name.textContent = selectedOption.name;
          toggle.setAttribute('aria-label', t('choose-language', selectedOption.name));
          picker.hidden = false;
        }
        document.dispatchEvent(new Event('tps-language-changed'));
      }

      function setOpen(open, restoreFocus = false) {
        menu.hidden = !open; toggle.setAttribute('aria-expanded', String(open));
        if (open) { search.value = ''; renderOptions(); search.focus(); }
        else if (restoreFocus) toggle.focus();
      }

      async function select(selected) {
        if (saving) return;
        if (selected === code) return setOpen(false, true);
        saving = true; renderOptions();
        try {
          apply(await bridge.request('tps.locale', { code: selected }, { timeoutMs: 3000 }));
          setOpen(false, true);
        } catch { messageText('language-save-failed'); search.focus(); }
        finally { saving = false; for (const btn of list.querySelectorAll('button')) btn.disabled = false; }
      }

      toggle.addEventListener('click', () => setOpen(menu.hidden));
      search.addEventListener('input', renderOptions);
      list.addEventListener('click', e => { const o = e.target.closest('button[data-locale]'); if (o) void select(o.dataset.locale); });
      picker.addEventListener('keydown', e => {
        if (menu.hidden) { if (e.key === 'ArrowDown') { e.preventDefault(); setOpen(true); } return; }
        if (e.key === 'Escape') { e.preventDefault(); setOpen(false, true); }
        else if (e.key === 'Enter' && e.target === search) { const first = list.querySelector('button:not(:disabled)'); if (first) void select(first.dataset.locale); }
        else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          const visible = [...list.querySelectorAll('button:not(:disabled)')], i = visible.indexOf(document.activeElement);
          e.preventDefault(); (e.key === 'ArrowDown' ? visible[i + 1] : visible[i - 1] ?? search).focus();
        }
      });
      document.addEventListener('pointerdown', e => { if (!menu.hidden && !picker.contains(e.target)) setOpen(false); });
      picker.addEventListener('focusout', e => { if (!saving && e.relatedTarget && !picker.contains(e.relatedTarget)) setOpen(false); });
      const formatted = (kind, value, opts) => {
        const key = JSON.stringify([kind, opts]);
        if (!formatters.has(key)) formatters.set(key, new Intl[kind](code, opts));
        return formatters.get(key).format(value);
      };
      return {
        ready: bridge?.request('tps.locale', undefined, { timeoutMs: 5000 }).then(apply).catch(() => {}),
        t, number: (v, o) => formatted('NumberFormat', v, o), date: (v, o) => formatted('DateTimeFormat', v, o)
      };
    })();
    const t = locale.t;
    function formatUsagePeriod(days, hourly) {
      const value = hourly ? days * 24 : days, lang = document.documentElement.lang;
      if (hourly && (lang === 'zh-CN' || lang === 'zh-TW')) return `${locale.number(value, { useGrouping: false })}${lang === 'zh-TW' ? '時' : '时'}`;
      if (!hourly && lang === 'zh-TW') return `${locale.number(value, { useGrouping: false })}天`;
      return locale.number(value, { style: 'unit', unit: hourly ? 'hour' : 'day', unitDisplay: 'short', useGrouping: false });
    }

        if (valid) root.setProperty('--record-card-bg', color.toLowerCase()); else root.removeProperty('--record-card-bg');
        cardColorInput.value = valid ? color.toLowerCase() : cardColorFallback();
        cardOpacity = clampInt(opacity, 0, 100, 100);
        if (cardOpacity < 100) { root.setProperty('--record-card-opacity', `${cardOpacity}%`); root.setProperty('--record-card-blur', 'blur(8px)'); }
        else { root.removeProperty('--record-card-opacity'); root.removeProperty('--record-card-blur'); }
        cardOpacityInput.value = String(cardOpacity); cardOpacityValue.textContent = `${cardOpacity}%`;
        cardReset.disabled = !cardCustomColor && cardOpacity === 100;
        if (persist) { writeStore(CARD_COLOR_KEY, valid ? color.toLowerCase() : null); writeStore(CARD_OPACITY_KEY, cardOpacity < 100 ? String(cardOpacity) : null); }
      }
      applyCardStyle({ color: readStore(CARD_COLOR_KEY), opacity: readStore(CARD_OPACITY_KEY) ?? 100 }, false);
      bindRange(cardColorInput, p => applyCardStyle({ color: cardColorInput.value, opacity: cardOpacity }, p));
      bindRange(cardOpacityInput, p => applyCardStyle({ color: cardCustomColor ? cardColorInput.value : null, opacity: cardOpacityInput.value }, p));
      cardReset.addEventListener('click', () => applyCardStyle({ color: null, opacity: 100 }, true));

      const themeObserver = new MutationObserver(() => {
        for (const e of colorInputs) if (!e.custom) e.input.value = e.fallback();
        if (!cardCustomColor) cardColorInput.value = cardColorFallback();
      });
      themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

      const STAR_RATIO_KEY = 'tps:panel-star-ratio';
      const STAR_SPEED_KEY = 'tps:panel-star-speed';
      const starRatioInput = byId('settings-star-ratio'), starRatioValue = byId('settings-star-ratio-value');
      const starSpeedInput = byId('settings-star-speed'), starSpeedValue = byId('settings-star-speed-value'), starReset = byId('settings-star-reset');
      let starRatio = 100, starSpeed = 1;
      function applyStarTwinkle({ ratio, speed }, persist = false) {
        starRatio = Math.round(clampInt(ratio, 0, 100, 100) / 10) * 10;
        const rawSpeed = Number(speed);
        starSpeed = Number.isFinite(rawSpeed) ? Math.round(Math.min(2, Math.max(0, rawSpeed)) * 10) / 10 : 1;
        const root = document.documentElement;
        root.dataset.starRatio = String(starSpeed === 0 ? 0 : starRatio);
        if (starSpeed === 1 || starSpeed === 0) root.style.removeProperty('--star-speed'); else root.style.setProperty('--star-speed', String(starSpeed));
        starRatioInput.value = String(starRatio); starRatioValue.textContent = `${starRatio}%`;
        starSpeedInput.value = String(starSpeed); starSpeedValue.textContent = `${starSpeed.toFixed(1)}×`;
        starReset.disabled = starRatio === 100 && starSpeed === 1;
        if (persist) { writeStore(STAR_RATIO_KEY, starRatio === 100 ? null : String(starRatio)); writeStore(STAR_SPEED_KEY, starSpeed === 1 ? null : String(starSpeed)); }
        document.dispatchEvent(new Event('tps-star-twinkle-changed'));
      }
      applyStarTwinkle({ ratio: readStore(STAR_RATIO_KEY) ?? 100, speed: readStore(STAR_SPEED_KEY) ?? 1 }, false);
      bindRange(starRatioInput, p => applyStarTwinkle({ ratio: starRatioInput.value, speed: starSpeed }, p));
      bindRange(starSpeedInput, p => applyStarTwinkle({ ratio: starRatio, speed: starSpeedInput.value }, p));
      starReset.addEventListener('click', () => applyStarTwinkle({ ratio: 100, speed: 1 }, true));

      const HARNESS_INTERVAL_KEY = 'tps:panel-harness-interval';
      const harnessIntervalInput = byId('settings-harness-interval'), harnessIntervalValue = byId('settings-harness-interval-value'), harnessReset = byId('settings-harness-reset');
      let harnessInterval = 5;
      function applyHarnessInterval(value, persist = false) {
        harnessInterval = clampInt(value, 0, 10, 5);
        document.documentElement.dataset.harnessInterval = String(harnessInterval);
        harnessIntervalInput.value = String(harnessInterval); harnessIntervalValue.textContent = `${harnessInterval}s`;
        harnessReset.disabled = harnessInterval === 5;
        if (persist) writeStore(HARNESS_INTERVAL_KEY, harnessInterval === 5 ? null : String(harnessInterval));
        document.dispatchEvent(new Event('tps-harness-interval-changed'));
      }
      applyHarnessInterval(readStore(HARNESS_INTERVAL_KEY) ?? 5, false);
      bindRange(harnessIntervalInput, p => applyHarnessInterval(harnessIntervalInput.value, p));
      harnessReset.addEventListener('click', () => applyHarnessInterval(5, true));

      function setOpen(open, restoreFocus = false) {
        dialog.hidden = !open; toggle.setAttribute('aria-expanded', String(open));
        if (open) { showBgError(''); closeButton.focus(); } else if (restoreFocus) toggle.focus();
      }
      function exitEditor(nextUrl, nextTransform, errorKey = '') {
        beforeEdit = null; editingOriginal = false; editingSourceUrl = '';
        bgEditor.hidden = true; document.body.classList.remove('is-bg-editing'); panelMain.hidden = false;
        bgTransform = nextTransform;
        applyBackgroundImage(nextUrl);
        croppedBgUrl = '';
        if (errorKey) { setOpen(true, false); showBgError(errorKey); } else toggle.focus();
      }
      async function openEditor() {
        if (!hasBgImage || editorBusy || !bgEditor.hidden) return;
        editorBusy = true;
        try {
          const savedCropped = readStore(BG_IMAGE_KEY);
          if (!savedCropped || !DATA_IMAGE_RE.test(savedCropped)) return;
          croppedBgUrl = savedCropped;
          const origUrl = await readOriginalBg();
          if (lifetime.signal.aborted) return;
          const useOriginal = Boolean(origUrl && DATA_IMAGE_RE.test(origUrl));
          const sourceUrl = useOriginal ? origUrl : croppedBgUrl;
          const loaded = await loadImageElement(sourceUrl);
          if (lifetime.signal.aborted || !loaded) return;
          beforeEdit = { ...bgTransform }; editingOriginal = useOriginal; editingSourceUrl = sourceUrl;
          activeImgSize = { w: loaded.naturalWidth || 0, h: loaded.naturalHeight || 0 };
          const startTransform = !useOriginal && bgTransform.baked ? { scale: 100, x: 0, y: 0, baked: false } : { ...bgTransform, baked: false };
          if (bgImg.getAttribute('src') !== sourceUrl) bgImg.src = sourceUrl;
          setOpen(false, false); panelMain.hidden = true; document.body.classList.add('is-bg-editing'); bgEditor.hidden = false;
          applyBackgroundTransform(startTransform, false); bgEditorSave.focus();
        } finally { editorBusy = false; }
      }
      async function closeEditor(save) {
        if (bgEditor.hidden || editorBusy) return;
        dragState = null; bgEditor.classList.remove('is-dragging');
        const fallbackTransform = beforeEdit ? { ...beforeEdit } : { ...DEFAULT_BG_TRANSFORM };
        if (!save) return exitEditor(croppedBgUrl, fallbackTransform);
        editorBusy = true; bgEditorSave.disabled = true;
        try {
          const sourceUrl = editingSourceUrl || croppedBgUrl, sourceMime = extractDataUrlMime(sourceUrl);
          let nextUrl = sourceUrl, nextTransform;
          if (RASTER_CROP_MIMES.has(sourceMime)) {
            const savedCropped = await saveCroppedBgToStore(sourceUrl, bgTransform, sourceMime);
            if (!savedCropped) return exitEditor(croppedBgUrl, fallbackTransform, 'settings-bg-error-save');
            nextUrl = savedCropped;
            nextTransform = editingOriginal ? { scale: bgTransform.scale, x: bgTransform.x, y: bgTransform.y, baked: true } : { scale: 100, x: 0, y: 0, baked: true };
          } else {
            if (!writeStore(BG_IMAGE_KEY, sourceUrl)) return exitEditor(croppedBgUrl, fallbackTransform, 'settings-bg-error-save');
            nextTransform = { scale: bgTransform.scale, x: bgTransform.x, y: bgTransform.y, baked: false };
          }
          writeStore(BG_TRANSFORM_KEY, JSON.stringify(nextTransform));
          exitEditor(nextUrl, nextTransform);
        } finally { editorBusy = false; bgEditorSave.disabled = false; }
      }

      toggle.addEventListener('click', () => setOpen(dialog.hidden, !dialog.hidden));
      closeButton.addEventListener('click', () => setOpen(false, true));
      dialog.addEventListener('click', e => { if (e.target === dialog) setOpen(false, true); });
      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if (!bgEditor.hidden) { e.preventDefault(); void closeEditor(false); }
        else if (!dialog.hidden) { e.preventDefault(); setOpen(false, true); }
      }, { signal: lifetime.signal });
      bgUpload.addEventListener('click', () => bgInput.click());
      bgEdit.addEventListener('click', () => void openEditor());
      bgReset.addEventListener('click', () => {
        showBgError(''); writeStore(BG_IMAGE_KEY, null); writeStore(BG_TRANSFORM_KEY, null); void writeOriginalBg(null);
        bgTransform = { ...DEFAULT_BG_TRANSFORM }; applyBackgroundTransform(bgTransform, false); applyBackgroundImage('');
      });
      bgEditorBar.addEventListener('pointerdown', e => e.stopPropagation());
      bgEditorZoomOut.addEventListener('click', () => applyBackgroundTransform({ ...bgTransform, scale: bgTransform.scale - 10 }, false));
      bgEditorZoomIn.addEventListener('click', () => applyBackgroundTransform({ ...bgTransform, scale: bgTransform.scale + 10 }, false));
      bgEditorResetPos.addEventListener('click', () => applyBackgroundTransform({ ...bgTransform, scale: DEFAULT_BG_TRANSFORM.scale, x: 0, y: 0 }, false));
      bgEditorCancel.addEventListener('click', () => void closeEditor(false));
      bgEditorSave.addEventListener('click', () => void closeEditor(true));
      bgEditor.addEventListener('pointerdown', e => {
        if (!hasBgImage || bgEditor.hidden || editorBusy || (e.pointerType === 'mouse' && e.button !== 0) || bgEditorBar.contains(e.target)) return;
        const layout = computeBgLayout(bgTransform, activeImgSize.w || bgImg.naturalWidth || 0, activeImgSize.h || bgImg.naturalHeight || 0);
        if (!layout.dispW || !layout.dispH) return;
        dragState = { pointerId: e.pointerId, lastClientX: e.clientX, lastClientY: e.clientY, dispW: layout.dispW, dispH: layout.dispH };
        bgEditor.classList.add('is-dragging'); bgEditor.setPointerCapture?.(e.pointerId);
      });
      bgEditor.addEventListener('pointermove', e => {
        if (!dragState || e.pointerId !== dragState.pointerId) return;
        const dx = ((e.clientX - dragState.lastClientX) / dragState.dispW) * 100, dy = ((e.clientY - dragState.lastClientY) / dragState.dispH) * 100;
        dragState.lastClientX = e.clientX; dragState.lastClientY = e.clientY;
        applyBackgroundTransform({ ...bgTransform, x: bgTransform.x + dx, y: bgTransform.y + dy }, false);
      });
      const stopDrag = e => {
        if (!dragState || e.pointerId !== dragState.pointerId) return;
        if (bgEditor.hasPointerCapture?.(e.pointerId)) bgEditor.releasePointerCapture(e.pointerId);
        dragState = null; bgEditor.classList.remove('is-dragging');
      };
      bgEditor.addEventListener('pointerup', stopDrag);
      bgEditor.addEventListener('pointercancel', stopDrag);
      bgEditor.addEventListener('wheel', e => {
        if (!hasBgImage || bgEditor.hidden || editorBusy) return;
        e.preventDefault(); applyBackgroundTransform({ ...bgTransform, scale: bgTransform.scale + (e.deltaY < 0 ? 5 : -5) }, false);
      }, { passive: false });
      const bgResizeObserver = typeof ResizeObserver === 'function' ? new ResizeObserver(() => {
        if (hasBgImage && (!bgEditor.hidden || !bgTransform.baked)) applyBackgroundTransform(bgTransform, false);
      }) : null;
      bgResizeObserver?.observe(bgLayer);
      bgImg.addEventListener('load', () => {
        if (!hasBgImage) return;
        activeImgSize = { w: bgImg.naturalWidth || 0, h: bgImg.naturalHeight || 0 };
        if (!bgEditor.hidden || !bgTransform.baked) applyBackgroundTransform(bgTransform, false);
      }, { signal: lifetime.signal });
      bgInput.addEventListener('change', async () => {
        const file = bgInput.files?.[0]; bgInput.value = '';
        if (!file) return;
        showBgError('');
        const mime = resolveImageMime(file);
        if (!mime) return showBgError('settings-bg-error-type');
        if (file.size > MAX_BG_BYTES) return showBgError('settings-bg-error-size');
        try {
          const originalDataUrl = await readAsDataUrl(new Blob([await file.arrayBuffer()], { type: mime }));
          if (!DATA_IMAGE_RE.test(originalDataUrl) || !await loadImageElement(originalDataUrl)) return showBgError('settings-bg-error-type');
          const isRaster = RASTER_CROP_MIMES.has(mime), nextTransform = { scale: 100, x: 0, y: 0, baked: isRaster };
          let nextCroppedUrl = originalDataUrl;
          if (isRaster) {
            const saved = await saveCroppedBgToStore(originalDataUrl, nextTransform, mime);
            if (!saved) return showBgError('settings-bg-error-save');
            nextCroppedUrl = saved;
          } else if (!writeStore(BG_IMAGE_KEY, originalDataUrl)) return showBgError('settings-bg-error-save');
          await writeOriginalBg(originalDataUrl);
          bgTransform = nextTransform; writeStore(BG_TRANSFORM_KEY, JSON.stringify(bgTransform));
          applyBackgroundImage(nextCroppedUrl);
        } catch { showBgError('settings-bg-error-type'); }
      });
      for (const link of [byId('panel-repo-link'), byId('panel-star-link')]) {
        link?.addEventListener('click', e => {
          if (typeof window.orca?.shell?.openExternal !== 'function') return;
          e.preventDefault(); void window.orca.shell.openExternal(link.href).catch(() => {});
        }, { signal: lifetime.signal });
      }
      let panelInView = true;
      function updateMotionPause() {
        const paused = document.hidden || !panelInView;
        if (document.documentElement.classList.contains('is-motion-paused') === paused) return;
        document.documentElement.classList.toggle('is-motion-paused', paused);
        document.dispatchEvent(new Event('tps-motion-changed'));
      }
      document.addEventListener('visibilitychange', updateMotionPause, { signal: lifetime.signal });
      const motionObserver = typeof IntersectionObserver === 'function'
        ? new IntersectionObserver(entries => { panelInView = entries.some(e => e.isIntersecting); updateMotionPause(); }) : null;
      motionObserver?.observe(document.documentElement);
      updateMotionPause();
      window.addEventListener('pagehide', () => { motionObserver?.disconnect(); bgResizeObserver?.disconnect(); themeObserver.disconnect(); lifetime.abort(); }, { once: true });
    })();
  </script>
</body>
</html>
