<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TPS Plugin</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f2f2f7;
      --surface: #ffffff;
      --ink: #1c1c1e;
      --muted: #6d6d75;
      --line: #e5e5ea;
      --purple: #8f32d6;
      --blue: #0066e6;
      --orange: #b45300;
      --green: #007f48;
      --cache: #9c6500;
      --speed: #c72e3a;
      --speed-bg: #f0f0f3;
      --tag-bg: #ededf2;
      --heat-0: #ebedf0; --heat-1: #bfdbfe; --heat-2: #7fb6fb; --heat-3: #3b82e6; --heat-4: #1d4fb8;
      --proxy-bg: #e5f7ee;
      --button-bg: #e5f0ff;
      --warning-bg: #fff1dc;
      --error: #c8213a;
      --error-bg: #fff0f3;
      --shadow: 0 3px 12px rgb(39 43 72 / 3%);
    }
    html.dark {
      color-scheme: dark;
      --page: #161618;
      --surface: #262628;
      --ink: #f5f5f7;
      --muted: #b4b4be;
      --line: #3a3a3e;
      --purple: #d38aff;
      --blue: #64b0ff;
      --orange: #ffb340;
      --green: #4ade80;
      --cache: #e8b65b;
      --speed: #ff6b72;
      --speed-bg: #303034;
      --tag-bg: #343439;
      --heat-0: #2a2a2e; --heat-1: #1e3a5f; --heat-2: #2e5f94; --heat-3: #4a8fd6; --heat-4: #8cc4ff;
      --proxy-bg: #193829;
      --button-bg: #163552;
      --warning-bg: #46321b;
      --error: #ff8fa5;
      --error-bg: #49232d;
      --shadow: 0 3px 12px rgb(0 0 0 / 6%);
    }
    * { box-sizing: border-box; }
    /* Set the reading direction on text leaves so flex and grid keep their order. */
    :where(html:lang(ar), html:lang(ur)) :is([data-i18n], [data-localized-text]) {
      direction: rtl;
      unicode-bidi: isolate;
      text-align: match-parent;
    }
    [hidden] { display: none !important; }
    html { min-width: 0; min-height: 100%; background: var(--page); }
    body {
      margin: 0;
      min-width: 0;
      padding: 16px;
      color: var(--ink);
      background: var(--page);
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-summary { min-width: 0; }
    h1 { margin: 0; font-size: 18px; line-height: 1.4; letter-spacing: -.3px; font-weight: 750; }
    .title-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 32px; }
    .language-picker { position: relative; flex: 0 1 156px; min-width: 0; }
    .language-toggle, .language-option {
      display: flex; align-items: center; gap: 7px; min-width: 0; min-height: 32px;
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--ink); cursor: pointer;
    }
    .language-toggle { width: 100%; }
    .language-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .language-toggle .language-name { flex: 1; min-width: 0; text-align: start; }
    .language-flag { flex: none; width: 20px; height: 14px; object-fit: contain; }
    .language-toggle svg { flex: none; width: 12px; height: 12px; color: var(--muted); }
    .language-menu {
      position: absolute; z-index: 4; top: calc(100% + 5px); right: 0;
      width: min(216px, calc(100vw - 32px)); padding: 6px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--surface); box-shadow: 0 5px 18px rgb(0 0 0 / 15%);
    }
    .language-search {
      width: 100%; padding: 6px 8px; margin-bottom: 4px;
      border: 1px solid var(--line); border-radius: 6px;
      font: inherit; color: var(--ink); background: var(--page);
    }
    .language-toggle:focus-visible, .language-option:focus-visible, .language-search:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 1px;
    }
    .language-options { max-height: 238px; overflow-y: auto; }
    .language-option { width: 100%; border-color: transparent; text-align: start; }
    .language-option:hover, .language-option[aria-pressed="true"] { background: var(--button-bg); color: var(--blue); }
    .language-message { margin: 4px 6px; color: var(--muted); overflow-wrap: anywhere; }
    .summary { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .refresh {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      flex-shrink: 0; min-height: 34px; padding: 7px 11px; border: 0; border-radius: 13px;
      background: var(--button-bg); color: var(--blue); font-size: 12px; font-weight: 650; cursor: pointer;
    }
    .refresh svg { width: 14px; height: 14px; flex-shrink: 0; }
    .refresh:hover:not(:disabled) { filter: brightness(.96); }
    .refresh:active:not(:disabled) { transform: translateY(1px); }
    .refresh:disabled { cursor: default; opacity: .6; }
    .refresh:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .panel-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 10px; border-bottom: 1px solid var(--line); }
    .panel-tab { min-width: 0; padding: 8px 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-weight: 650; cursor: pointer; }
    .panel-tab[aria-selected="true"] { border-bottom-color: var(--blue); color: var(--blue); }
    .panel-tab:focus-visible, .panel-view:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .panel-view { margin-top: 12px; }
    #usage, #leaderboard { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
    .section-title { margin: 0; color: var(--ink); font-size: 13px; line-height: 1.6; font-weight: 700; }
    .section-detail { margin: 0; color: var(--muted); font-size: 11px; }
    .ladder-card { padding: 12px 16px; }
    .ladder-refresh-time { font-variant-numeric: tabular-nums; }
    .ladder-tabs { margin-top: 6px; }
    .ladder-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
    .ladder-control { min-height: 36px; padding-inline: 12px; font-size: 13px; font-weight: 700; }
    .ladder-secondary { color: var(--muted); background: var(--tag-bg); }
    .ladder-note { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
    .ladder-sync {
      display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr);
      align-items: center; gap: 7px; margin-top: 8px; font-variant-numeric: tabular-nums;
    }
    .ladder-sync .ladder-note { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .ladder-sync-result { margin-inline-start: auto; text-align: right; }
    .ladder-sync-error { color: var(--error); overflow-wrap: anywhere; }
    .ladder-sync .is-queued { color: var(--blue); }
    .ladder-actions .ladder-note { margin: 0; }
    .ladder-status { margin: 8px 0 0; font-size: 12px; overflow-wrap: anywhere; }
    .ladder-status:empty, .ladder-mine:empty { display: none; }
    .ladder-identity { display: flex; justify-content: space-between; gap: 8px; align-items: center; min-width: 0; }
    .ladder-account-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .ladder-avatar {
      display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px;
      border-radius: 50%; overflow: hidden; background: var(--button-bg);
      color: var(--muted);
    }
    .ladder-avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .ladder-avatar svg { display: block; width: 78%; height: 78%; }
    .ladder-account-name .ladder-avatar { width: 32px; height: 32px; }
    .ladder-user-grid, .ladder-badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 8px; }
    .ladder-user-grid { margin-top: 12px; row-gap: 5px; align-items: start; }
    .ladder-user-stat { min-width: 0; margin: 0; padding-inline: 2px; text-align: center; }
    .ladder-user-stat + .ladder-user-stat { border-inline-start: 1px solid var(--line); }
    .ladder-user-stat dt { color: var(--muted); font-size: 13px; }
    .ladder-user-stat dd { margin: 1px 0 0; font-variant-numeric: tabular-nums; }
    .ladder-user-rank { font-size: 16px; font-weight: 750; }
    .ladder-user-tokens { color: var(--blue); font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
    .ladder-mine {
      min-width: 0; margin: 0; color: var(--purple); font-size: 24px; font-weight: 800; line-height: 1.25;
      letter-spacing: -.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ladder-badges { grid-column: 1 / -1; }
    .ladder-badge-slot { display: grid; place-items: center; min-height: 48px; }
    .ladder-medal {
      position: relative; display: inline-block; flex-shrink: 0; width: 48px; height: 48px;
      filter: drop-shadow(0 1px 1px rgb(0 0 0 / 25%));
    }
    .ladder-medal-7 { --medal-phase: -1.2s; }
    .ladder-medal-30 { --medal-phase: -2.4s; }
    .ladder-medal[data-place="1"] {
      --medal-light: #fff3bc; --medal-mid: #e6b541; --medal-dark: #8b5515;
      --medal-face-light: #ffedb0; --medal-face-dark: #cf9b36;
      --medal-ink: #4c2e0c; --medal-sheen: rgb(255 249 217 / 95%);
    }
    .ladder-medal[data-place="2"] {
      --medal-light: #f6f9fc; --medal-mid: #bac5d0; --medal-dark: #65727f;
      --medal-face-light: #edf3f9; --medal-face-dark: #a6b2bf;
      --medal-ink: #2e3947; --medal-sheen: rgb(243 250 255 / 85%);
    }
    .ladder-medal[data-place="3"] {
      --medal-light: #f9c9a0; --medal-mid: #c18356; --medal-dark: #794527;
      --medal-face-light: #f3c7a7; --medal-face-dark: #bb7952;
      --medal-ink: #44281a; --medal-sheen: rgb(255 230 204 / 76%);
    }
    .ladder-medal-crown {
      position: absolute; top: 1px; left: 13px; width: 22px; height: 13px;
      clip-path: polygon(0 25%, 24% 54%, 24% 7%, 41% 40%, 50% 0, 59% 40%, 76% 7%, 76% 54%, 100% 25%,
        85% 92%, 69% 100%, 31% 100%, 15% 92%);
      background: linear-gradient(180deg, transparent 68%, var(--medal-dark) 77%, var(--medal-light) 85%, var(--medal-mid) 95%),
        linear-gradient(107deg, var(--medal-dark), var(--medal-light) 23%, var(--medal-mid) 41%, var(--medal-light) 62%, var(--medal-dark));
    }
    .ladder-medal-branch { position: absolute; inset: 7px 4px 1px; }
    .ladder-medal-branch + .ladder-medal-branch { transform: scaleX(-1); }
    .ladder-medal-branch::before {
      content: ""; position: absolute; inset: 1px; border: 1px solid var(--medal-mid); border-radius: 50%;
      clip-path: polygon(50% 50%, 0 1%, 0 100%, 53% 100%);
    }
    .ladder-medal-branch::after {
      content: ""; position: absolute; left: 43%; bottom: 1.5px; width: 7px; height: 1px;
      background: var(--medal-mid); transform: rotate(21deg);
    }
    .ladder-medal-leaf {
      position: absolute; top: 50%; left: 50%;
      transform: rotate(var(--leaf-angle)) translateY(19px);
    }
    .ladder-medal-leaf::before, .ladder-medal-leaf::after {
      content: ""; position: absolute; top: -1.5px; right: -.5px; width: 6px; height: 3px;
      border-radius: 85% 5% 85% 5%; transform-origin: right center;
      background: linear-gradient(160deg, var(--medal-light), var(--medal-mid) 56%, var(--medal-dark));
    }
    .ladder-medal-leaf::before { transform: rotate(-33deg); }
    .ladder-medal-leaf::after { transform: rotate(44deg) scale(.9); }
    .ladder-medal-emblem {
      position: absolute; top: 14px; left: 10px; width: 28px; height: 28px; display: grid; padding: 2.5px;
      overflow: hidden; border-radius: 50%; box-shadow: 0 0 0 .5px var(--medal-dark);
      background: conic-gradient(from -30deg, var(--medal-light), var(--medal-dark) 28%, var(--medal-light) 48%,
        var(--medal-dark) 69%, var(--medal-mid) 83%, var(--medal-light));
    }
    .ladder-medal-emblem::before {
      content: ""; position: absolute; inset-block: 0; left: 0; width: 48%; pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--medal-sheen) 45%, var(--medal-light) 52%, transparent);
      animation: medal-sweep 3.6s ease-in-out var(--medal-phase, 0s) infinite;
    }
    .ladder-medal-mark {
      position: relative; display: grid; place-items: center; border-radius: 50%;
      background: linear-gradient(150deg, var(--medal-face-light) 20%, var(--medal-face-dark) 85%);
      box-shadow: 0 0 0 .5px var(--medal-dark), inset 0 .75px 0 var(--medal-light);
      color: var(--medal-ink); font: 700 14px/1 Georgia, serif; font-variant-numeric: lining-nums tabular-nums;
      text-shadow: 0 .75px 0 var(--medal-light);
    }
    .ladder-medal::before, .ladder-medal::after {
      content: ""; position: absolute; z-index: 1; opacity: 0; pointer-events: none;
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      background: radial-gradient(circle, var(--medal-light), var(--medal-sheen));
      animation: medal-twinkle 3.6s ease-in-out var(--medal-phase, 0s) infinite;
    }
    .ladder-medal::before { left: 9px; top: 13px; width: 10px; height: 10px; }
    .ladder-medal::after {
      right: 8px; top: 31px; width: 8px; height: 8px;
      animation-delay: calc(var(--medal-phase, 0s) + .55s);
    }
    @keyframes medal-sweep {
      0%, 34% { transform: translateX(-160%) skewX(-22deg); }
      74%, 100% { transform: translateX(280%) skewX(-22deg); }
    }
    @keyframes medal-twinkle {
      0%, 37%, 66%, 100% { opacity: 0; transform: scale(.35); }
      50% { opacity: 1; transform: scale(1); }
    }
    .ladder-title-actions { display: flex; align-items: center; gap: 6px; }
    .ladder-refresh { width: 28px; min-height: 28px; padding: 0; border-radius: 9px; }
    .ladder-preview { padding: 9px 11px; border-radius: 13px; background: var(--button-bg); }
    .ladder-preview p { margin: 0 0 6px; }
    .ladder-preview .ladder-note { margin-bottom: 8px; }
    .ladder-rows { margin: 6px 0 0; padding: 0; list-style: none; }
    .ladder-rows:empty { margin: 0; }
    .ladder-rows li {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "rank name total" "rank time total" "rank pulse pulse";
      column-gap: 8px; align-items: center; padding: 8px 0;
      border-top: 1px solid var(--line); font-variant-numeric: tabular-nums;
    }
    .ladder-avatar-box { position: relative; display: inline-flex; flex: none; }
    .ladder-avatar-mood {
      position: absolute; right: -5px; bottom: -4px; display: inline-grid; place-items: center;
      min-width: 15px; height: 15px; padding: 0 2px; border-radius: 999px;
      background: var(--surface); border: 1.5px solid var(--line);
      font-size: 9.5px; line-height: 1; box-shadow: 0 1px 4px rgb(0 0 0 / 18%);
      pointer-events: auto; user-select: none;
    }
    .ladder-account-name .ladder-avatar-mood { right: -5px; bottom: -3px; min-width: 18px; height: 18px; font-size: 11px; }
    .ladder-avatar-mood[data-tier="hot"] {
      border-color: #ff6b3d; background: color-mix(in srgb, #ff5a36 22%, var(--surface));
      box-shadow: 0 0 0 0 rgb(255 90 54 / 55%);
      animation: mood-hot 1.15s ease-out infinite;
    }
    .ladder-avatar-mood[data-tier="steady"] {
      border-color: #38bdf8; background: color-mix(in srgb, #38bdf8 18%, var(--surface));
      box-shadow: 0 0 0 0 rgb(56 189 248 / 45%);
      animation: mood-steady 2s ease-out infinite;
    }
    .ladder-avatar-mood[data-tier="idle"] {
      border-color: color-mix(in srgb, var(--green) 55%, var(--line));
      background: color-mix(in srgb, #f59e0b 12%, var(--surface));
      animation: mood-coffee 3.2s ease-in-out infinite;
    }
    #ladder-account, #ladder-sign-in { min-width: 0; }
    .ladder-live {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0;
    }
    .ladder-marquee {
      display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; overflow: hidden;
      padding: 5px 8px; border-radius: 11px; background: var(--speed-bg);
    }
    .ladder-live-pill {
      display: inline-flex; align-items: center; gap: 5px; flex: none;
      padding: 2px 7px; border-radius: 999px; background: var(--surface);
      border: 1px solid var(--line); font-size: 10.5px; font-weight: 700; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .ladder-live-pill.is-active { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, var(--line)); }
    .ladder-live-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none;
    }
    .ladder-live-pill.is-active .ladder-live-dot {
      background: var(--green); animation: pulse-ring 1.6s ease-out infinite;
    }
    .ladder-marquee-viewport {
      flex: 1; min-width: 0; overflow: hidden; direction: ltr;
      mask-image: linear-gradient(90deg, transparent, #000 10px, #000 calc(100% - 10px), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 10px, #000 calc(100% - 10px), transparent);
    }
    .ladder-marquee-track {
      display: flex; align-items: center; width: max-content;
      animation: ladder-marquee-scroll 18s linear infinite;
    }
    .ladder-marquee:hover .ladder-marquee-track { animation-play-state: paused; }
    .ladder-marquee-track.is-static { width: 100%; animation: none; }
    .ladder-marquee-list { display: flex; align-items: center; gap: 8px; padding-inline-end: 12px; }
    .ladder-marquee-chip {
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
      padding: 2px 8px; border-radius: 999px; background: var(--surface);
      border: 1px solid var(--line); font-size: 11px; font-variant-numeric: tabular-nums;
    }
    .ladder-marquee-chip.is-self { border-color: color-mix(in srgb, var(--purple) 45%, var(--line)); }
    .ladder-marquee-user { color: var(--purple); font-weight: 700; }
    .ladder-marquee-tps { color: var(--speed); font-weight: 700; }
    .ladder-marquee-steady { color: var(--blue); font-weight: 700; }
    .ladder-marquee-online { color: var(--green); font-weight: 650; }
    .ladder-marquee-burst { color: var(--blue); font-weight: 650; }
    .ladder-marquee-empty { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ladder-heartbeat {
      position: relative; padding: 8px 10px 6px; border-radius: 14px;
      border: 1px solid var(--line);
      background-color: var(--speed-bg);
      background-image:
        radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--muted) 15%, transparent) 1px, transparent 0),
        radial-gradient(110% 95% at 88% 15%, color-mix(in srgb, var(--blue) 12%, transparent), transparent 65%),
        radial-gradient(95% 85% at 12% 90%, color-mix(in srgb, var(--purple) 9%, transparent), transparent 62%);
      background-size: 12px 12px, 100% 100%, 100% 100%;
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; min-width: 0; overflow: hidden;
      transition: border-color .35s ease, box-shadow .35s ease;
    }
    .ladder-heartbeat[data-tier="hot"] {
      border-color: color-mix(in srgb, #ff6b3d 45%, var(--line));
      background-image:
        radial-gradient(circle at 1px 1px, color-mix(in srgb, #ff6b3d 18%, transparent) 1px, transparent 0),
        radial-gradient(115% 100% at 86% 14%, rgb(255 90 54 / 19%), transparent 64%),
        radial-gradient(95% 90% at 15% 88%, rgb(255 159 28 / 13%), transparent 60%);
      box-shadow: inset 0 0 18px rgb(255 90 54 / 7%);
    }
    .ladder-heartbeat[data-tier="steady"] {
      border-color: color-mix(in srgb, #38bdf8 38%, var(--line));
      background-image:
        radial-gradient(circle at 1px 1px, color-mix(in srgb, #38bdf8 16%, transparent) 1px, transparent 0),
        radial-gradient(115% 100% at 86% 14%, rgb(56 189 248 / 16%), transparent 64%),
        radial-gradient(95% 90% at 15% 88%, rgb(129 140 248 / 12%), transparent 60%);
    }
    .ladder-heartbeat[data-tier="idle"] {
      border-color: color-mix(in srgb, var(--green) 30%, var(--line));
      background-image:
        radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--green) 14%, transparent) 1px, transparent 0),
        radial-gradient(110% 95% at 85% 20%, rgb(52 211 153 / 13%), transparent 64%),
        radial-gradient(90% 85% at 15% 88%, rgb(245 158 11 / 8%), transparent 60%);
    }
    .ladder-hb-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 11px; font-variant-numeric: tabular-nums;
    }
    .ladder-hb-label-wrap { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
    .ladder-hb-label { color: var(--muted); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ladder-hb-tier {
      font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
    }

  <script>
    const locale = (() => {
      const bridge = window.orca?.plugin;
      const byId = id => document.getElementById(id);
      const picker = byId('language-picker'), toggle = byId('language-toggle'), menu = byId('language-menu');
      const search = byId('language-search'), list = byId('language-options'), message = byId('language-message');
      let code = 'en', strings = {}, options = [], saving = false;
      const formatters = new Map();
      const t = (key, ...values) => strings[key]?.replace(/\{(\d+)\}/g, (_, index) => values[index] ?? '') ?? '';
      const normalize = value => value.normalize('NFKD').replace(/\p{M}/gu, '').toLocaleLowerCase().trim();
      const englishNames = new Intl.DisplayNames('en', { type: 'language' });
      const chineseNames = new Intl.DisplayNames('zh-CN', { type: 'language' });

      function messageText(key) {
        message.hidden = !key;
        message.textContent = key ? t(key) : '';
      }

      function renderOptions() {
        const query = normalize(search.value);
        const names = new Intl.DisplayNames(code, { type: 'language' });
        const matches = options.filter(option => [
          option.name, option.code, englishNames.of(option.code), chineseNames.of(option.code), names.of(option.code)
        ].some(value => normalize(value).includes(query)));
        list.replaceChildren(...matches.map(option => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'language-option';
          button.dataset.locale = option.code;
          button.setAttribute('aria-pressed', String(option.code === code));
          button.disabled = saving;
          const flag = document.createElement('img');
          flag.className = 'language-flag';
          flag.src = option.flag;
          flag.alt = '';
          const name = document.createElement('bdi');
          name.className = 'language-name';
          name.lang = option.code;
          name.textContent = option.name;
          button.append(flag, name);
          return button;
        }));
        messageText(matches.length ? '' : 'no-matching-languages');
      }

      function apply({ code: selected, strings: dictionary, options: choices }) {
        code = selected;
        strings = dictionary;
        if (choices) options = choices;
        formatters.clear();
        document.documentElement.lang = code;
        for (const root of [document, byId('record-template').content]) {
          for (const element of root.querySelectorAll('[data-i18n]')) element.textContent = t(element.dataset.i18n);
          for (const attribute of ['aria-label', 'title', 'placeholder']) {
            for (const element of root.querySelectorAll(`[data-i18n-${attribute}]`)) {
              element.setAttribute(attribute, t(element.getAttribute(`data-i18n-${attribute}`)));
            }
          }
        }
        const selectedOption = options.find(option => option.code === code);
        if (selectedOption) {
          byId('language-flag').src = selectedOption.flag;
          const name = byId('language-name');
          name.lang = code;
          name.textContent = selectedOption.name;
          toggle.setAttribute('aria-label', t('choose-language', selectedOption.name));
          picker.hidden = false;
        }
        document.dispatchEvent(new Event('tps-language-changed'));
      }

      function setOpen(open, restoreFocus = false) {
        menu.hidden = !open;
        toggle.setAttribute('aria-expanded', String(open));
        if (open) {
          search.value = '';
          renderOptions();
          search.focus();
        } else if (restoreFocus) toggle.focus();
      }

      async function select(selected) {
        if (saving) return;
        if (selected === code) return setOpen(false, true);
        saving = true;
        renderOptions();
        try {
          apply(await bridge.request('tps.locale', { code: selected }, { timeoutMs: 3000 }));
          setOpen(false, true);
        } catch {
          messageText('language-save-failed');
          search.focus();
        } finally {
          saving = false;
          for (const option of list.querySelectorAll('button')) option.disabled = false;
        }
      }

      toggle.addEventListener('click', () => setOpen(menu.hidden));
      search.addEventListener('input', renderOptions);
      list.addEventListener('click', event => {
        const option = event.target.closest('button[data-locale]');
        if (option) void select(option.dataset.locale);
      });
      picker.addEventListener('keydown', event => {
        if (menu.hidden) {
          if (event.key === 'ArrowDown') {
            event.preventDefault();
            setOpen(true);
          }
          return;
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          setOpen(false, true);
        } else if (event.key === 'Enter' && event.target === search) {
          const first = list.querySelector('button:not(:disabled)');
          if (first) void select(first.dataset.locale);
        } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          const visible = [...list.querySelectorAll('button:not(:disabled)')];
          const index = visible.indexOf(document.activeElement);
          const next = event.key === 'ArrowDown' ? visible[index + 1] : visible[index - 1];
          event.preventDefault();
          (next ?? search).focus();
        }
      });
      document.addEventListener('pointerdown', event => {
        if (!menu.hidden && !picker.contains(event.target)) setOpen(false);
      });
      picker.addEventListener('focusout', event => {
        if (!saving && event.relatedTarget && !picker.contains(event.relatedTarget)) setOpen(false);
      });

      function formatted(kind, value, options) {
        const key = JSON.stringify([kind, options]);
        if (!formatters.has(key)) formatters.set(key, new Intl[kind](code, options));
        return formatters.get(key).format(value);
      }
      return {
        ready: bridge?.request('tps.locale', undefined, { timeoutMs: 5000 }).then(apply).catch(() => {}),
        t,
        number: (value, options) => formatted('NumberFormat', value, options),
        date: (value, options) => formatted('DateTimeFormat', value, options)
      };
    })();
    const t = locale.t;
    function updateList(container, items, previous, keyOf, create) {
      const next = new Map();
      let position = container.firstChild;
      const counts = new Map();
      for (const item of items) {
        const signature = keyOf(item);
        const occurrence = counts.get(signature) ?? 0;
        counts.set(signature, occurrence + 1);
        const key = signature + '/' + occurrence;
        const node = previous.get(key) ?? create(item);
        if (node !== position) container.insertBefore(node, position);
        position = node.nextSibling;
        next.set(key, node);
      }
      while (position) {
        const unused = position;
        position = position.nextSibling;
        unused.remove();
      }
      return next;
    }
    const formatTokenMB = tokens => {
      if (!Number.isFinite(tokens) || tokens < 0) return '—';
      const options = tokens > 0 && tokens < 1_000_000
        ? { maximumFractionDigits: 6 }
        : { minimumFractionDigits: 2, maximumFractionDigits: 2 };
      return locale.number(tokens / 1_000_000, options) + ' MB';
    };

    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const ui = Object.fromEntries(['current-data', 'summary', 'refresh', 'error', 'warnings', 'loading', 'records', 'empty', 'empty-text', 'updated', 'record-template'].map(id => [id, byId(id)]));
      const views = [...byId('panel-tabs').children];
      const lifetime = new AbortController();
      const bridge = window.orca?.plugin;
      let activeTab;
      function openView(tab) {
        const previous = activeTab;
        activeTab = tab;
        for (const view of views) {
          const selected = view === tab;
          view.setAttribute('aria-selected', String(selected));
          view.tabIndex = selected ? 0 : -1;
          byId(view.getAttribute('aria-controls')).hidden = !selected;
        }
        if (previous && previous !== tab) {
          byId(previous.getAttribute('aria-controls')).dispatchEvent(new Event('tps-view-closed'));
        }
        byId(tab.getAttribute('aria-controls')).dispatchEvent(new Event('tps-view-opened'));
      }
      for (const [index, tab] of views.entries()) {
        tab.addEventListener('click', () => {
          const changed = tab !== activeTab;
          openView(tab);
          if (changed && typeof bridge?.request === 'function') {
            void bridge.request('tps.panel-view', { view: tab.getAttribute('aria-controls') }, { timeoutMs: 3000 }).catch(() => {});
          }
        });
        tab.addEventListener('keydown', event => {
          const next = {
            ArrowLeft: (index + views.length - 1) % views.length,
            ArrowRight: (index + 1) % views.length,
            Home: 0,
            End: views.length - 1
          }[event.key];
          if (next === undefined) return;
          event.preventDefault();
          views[next].focus();
          views[next].click();
        });
      }
      const retiredInstances = new Set();
      const subscriptions = [];
      let current = null;
      let busy = false;
      let problem = null;
      let revision = 0;
      let disposed = false;
      let drawnRecords = '';
      let recordNodes = new Map(), currentFrame;
      let drawnWarnings;
      let resetScroll = false;
      document.addEventListener('DOMContentLoaded', async () => {
        await locale.ready;
        if (activeTab) return;
        const saved = typeof bridge?.request === 'function'
          ? await bridge.request('tps.panel-view', undefined, { signal: lifetime.signal, timeoutMs: 3000 }).catch(() => null)
          : null;
        if (!activeTab && !lifetime.signal.aborted) {
          openView(views.find(tab => tab.getAttribute('aria-controls') === saved?.view) ?? views[0]);
        }
      }, { once: true });

      const numeric = value => typeof value === 'number' && Number.isFinite(value) && value >= 0;
      const outputKB = tokens => numeric(tokens) ? locale.number(tokens / 1_000, { maximumFractionDigits: 3 }) : '—';
      const isSessionLog = record => typeof record?.dataSource === 'string' && record.dataSource.length > 0 && record.dataSource !== 'proxy';
      function number(value, fraction = 0) {
        return numeric(value) ? locale.number(value, { minimumFractionDigits: fraction, maximumFractionDigits: fraction }) : '—';
      }
      const percent = (value, digits) => locale.number(value, {
        style: 'percent', minimumFractionDigits: digits, maximumFractionDigits: digits
      });
      function formatTps(record) {
        const tps = record?.tokensPerSecond;
        if (!numeric(tps) || tps <= 0) return '—';
        const core = number(tps, tps < 1 ? 1 : 0);
        return record?.isEstimatedSpeed ? `≈${core}` : core;
      }
      function speedTooltip(record) {
        const tps = record?.tokensPerSecond;
        const dur = numeric(record?.durationMs) && record.durationMs > 0 ? number(record.durationMs / 1000, 1) : null;
        const ttft = numeric(record?.firstTokenMs) && record.firstTokenMs > 0 ? number(record.firstTokenMs / 1000, 1) : null;
        const session = isSessionLog(record);
        if (numeric(tps) && tps > 0) {
          if (!record?.isEstimatedSpeed) {
            const genMs = numeric(record?.generationMs) ? record.generationMs : (numeric(record?.durationMs) && numeric(record?.firstTokenMs) ? record.durationMs - record.firstTokenMs : null);
            const gen = numeric(genMs) ? number(genMs / 1000, 1) : '—';
            return t('exact-speed-detail', number(tps, 1), dur ?? '—', ttft ?? '—', gen);
          }
          return ttft
            ? t('estimated-speed-first-token', number(tps, 1), dur ?? '—', ttft)
            : t('estimated-speed-duration', number(tps, 1), dur ?? '—');
        }
        if (record?.dataSource === 'proxy') {
          if (!numeric(record.firstTokenMs) || record.firstTokenMs <= 0) return t('missing-first-token-speed');
          if (numeric(record.outputTokens) && record.outputTokens < 100) return t('proxy-output-threshold', outputKB(record.outputTokens));
          return t('proxy-duration-threshold');
        }
        if (session) {
          if (!numeric(record?.durationMs) || record.durationMs <= 0) return t('missing-request-duration');

      const avatarObserver = typeof IntersectionObserver === 'function' ? new IntersectionObserver(entries => {
        for (const { target, isIntersecting } of entries) {
          if (!isIntersecting || group.hidden || !observedAvatars.delete(target)) continue;
          avatarObserver.unobserve(target);
          void loadAvatar(target);
        }
      }, { rootMargin: '48px 0px' }) : null;

      async function loadAvatar(avatar) {
        const username = avatar.dataset.username;
        const { image } = await request('avatar', { username });
        if (typeof image !== 'string' || !/^data:image\/(?:png|jpeg|webp|gif);base64,/.test(image)) return;
        const stillCurrent = () => !lifetime.signal.aborted && avatar.isConnected && avatar.dataset.username === username;
        if (!stillCurrent()) return;
        const img = document.createElement('img');
        img.alt = '';
        img.decoding = 'async';
        img.addEventListener('load', () => { if (stillCurrent()) avatar.replaceChildren(img); }, { once: true });
        img.src = image;
      }

      function setAvatar(avatar, username = '') {
        if (username === avatar.dataset.username) return;
        avatar.dataset.username = username;
        avatar.replaceChildren(element('avatar-fallback').content.cloneNode(true));
        if (observedAvatars.delete(avatar)) avatarObserver.unobserve(avatar);
        if (username && avatarObserver) {
          observedAvatars.add(avatar);
          avatarObserver.observe(avatar);
        }
      }

      function medal(rank, period) {
        const place = podium[rank - 1];
        if (!place) return null;
        const badge = document.createElement('span');
        badge.className = 'ladder-medal ladder-medal-' + period.days;
        badge.dataset.place = rank;
        badge.title = t('medal-position', t(period.title), t(place));
        badge.setAttribute('role', 'img');
        badge.setAttribute('aria-label', badge.title);
        const crown = document.createElement('span'), branch = document.createElement('span');
        const emblem = document.createElement('span'), mark = document.createElement('span');
        crown.className = 'ladder-medal-crown';
        branch.className = 'ladder-medal-branch';
        for (let angle = 15; angle <= 135; angle += 20) {
          const leaf = document.createElement('span');
          leaf.className = 'ladder-medal-leaf';
          leaf.style.setProperty('--leaf-angle', `${angle}deg`);
          branch.append(leaf);
        }
        emblem.className = 'ladder-medal-emblem';
        mark.className = 'ladder-medal-mark';
        mark.textContent = period.mark;
        emblem.append(mark);
        badge.append(crown, branch, branch.cloneNode(true), emblem);
        return badge;
      }

      function formatCompactTokens(tokens) {
        if (!numeric(tokens) || tokens <= 0) return '0';
        if (tokens >= 1_000_000) return locale.number(tokens / 1_000_000, { maximumFractionDigits: 2 }) + 'M';
        if (tokens >= 1_000) return locale.number(tokens / 1_000, { maximumFractionDigits: 1 }) + 'K';
        return locale.number(tokens);
      }

      function formatLiveTps(tps, short = false) {
        if (!numeric(tps) || tps <= 0) return '—';
        const formatted = locale.number(tps, { minimumFractionDigits: tps < 10 ? 1 : 0, maximumFractionDigits: 1 });
        return formatted + (short ? ' tok/s' : ' tokens/s');
      }

      const MOOD_ICONS = { hot: '🔥', steady: '⚡', idle: '☕' };
      const MOOD_KEYS = { hot: 'pulse-hot', steady: 'pulse-steady', idle: 'pulse-idle' };

      function pulseTier(tps, burstTokens) {
        if ((numeric(tps) && tps >= PULSE_HOT_TPS) || (numeric(burstTokens) && burstTokens >= PULSE_HOT_BURST)) return 'hot';
        if ((numeric(tps) && tps > 0) || (numeric(burstTokens) && burstTokens > 0)) return 'steady';
        return 'idle';
      }

      function applyMoodBadge(el, tier, show = true) {
        if (!el) return;
        el.hidden = !show;
        if (!show) return;
        const icon = MOOD_ICONS[tier] ?? MOOD_ICONS.idle;
        const title = t(MOOD_KEYS[tier] ?? MOOD_KEYS.idle);
        if (el.dataset.tier !== tier) el.dataset.tier = tier;
        if (el.textContent !== icon) el.textContent = icon;
        if (el.title !== title) {
          el.title = title;
          el.setAttribute('aria-label', title);
        }
      }

      function smoothSvgPath(points) {
        if (!points.length) return '';
        let path = `M${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
        for (let i = 0; i < points.length - 1; i += 1) {
          const p0 = points[Math.max(0, i - 1)];
          const p1 = points[i];
          const p2 = points[i + 1];
          const p3 = points[Math.min(points.length - 1, i + 2)];
          const cp1x = p1.x + (p2.x - p0.x) / 6;
          const cp1y = p1.y + (p2.y - p0.y) / 6;
          const cp2x = p2.x - (p3.x - p1.x) / 6;
          const cp2y = p2.y - (p3.y - p1.y) / 6;
          path += ` C${cp1x.toFixed(1)} ${cp1y.toFixed(1)},${cp2x.toFixed(1)} ${cp2y.toFixed(1)},${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
        }
        return path;
      }

      function buildPulseGeometry(wave, serverTime, width, height, {
        paddingTop = 6, paddingBottom = 9, windowMs = PULSE_WINDOW_MS,
        phaseSec = 0, tpsHint = 0, burstHint = 0, tier = 'idle', sampleCount = 46
      } = {}) {
        const baseY = height - paddingBottom;
        const maxAmp = Math.max(4, baseY - paddingTop);
        const start = serverTime - windowMs;
        const raw = (Array.isArray(wave) ? wave : [])
          .filter(point => Array.isArray(point) && point.length >= 3 && Number.isFinite(point[0]) && point[0] >= start && point[0] <= serverTime + 2000)
          .slice()
          .sort((a, b) => a[0] - b[0]);
        const maxTps = Math.max(80, tpsHint, ...raw.map(point => numeric(point[1]) ? point[1] : 0));
        const maxBurst = Math.max(1500, burstHint, ...raw.map(point => numeric(point[2]) ? point[2] : 0));
        const spikes = [];
        for (const [ts, tpsRaw, burstRaw, onlineRaw] of raw) {
          const tps = numeric(tpsRaw) ? tpsRaw : 0;
          const burst = numeric(burstRaw) ? burstRaw : 0;
          const online = onlineRaw === 1;
          if (tps <= 0 && burst <= 0 && !online) continue;
          const cx = Math.max(8, Math.min(width - 8, ((ts - start) / windowMs) * (width - 16) + 8));
          const prev = spikes[spikes.length - 1];
          if (prev && cx - prev.cx < 10) {
            prev.cx = cx;
            prev.tps = Math.max(prev.tps, tps);
            prev.burst += burst;
            prev.online = prev.online || online;
          } else {
            spikes.push({ cx, tps, burst, online });
          }
        }
        const flowSpeed = tier === 'hot' ? 5.2 : tier === 'steady' ? 3.4 : 2.1;
        const baseDanceAmp = tier === 'hot' ? maxAmp * 0.24 : tier === 'steady' ? maxAmp * 0.16 : Math.min(4.2, maxAmp * 0.22);
        const freqScale = tier === 'hot' ? 0.11 : tier === 'steady' ? 0.085 : 0.065;
        const points = [];
        const bars = [];
        for (let i = 0; i <= sampleCount; i += 1) {
          const x = (i / sampleCount) * width;
          const norm = x / width;
          const envelope = 0.72 + 0.28 * Math.sin(norm * Math.PI);
          let dance = (
            Math.sin(x * freqScale - phaseSec * flowSpeed) * 0.62 +
            Math.sin(x * (freqScale * 1.85) + phaseSec * (flowSpeed * 0.72)) * 0.38
          ) * baseDanceAmp * envelope;
          if (tier === 'hot') {
            dance += Math.sin(x * 0.24 - phaseSec * 8.4) * (maxAmp * 0.1);
          }
          let lift = 0;
          for (const spike of spikes) {
            const dist = Math.abs(x - spike.cx);
            if (dist > 14) continue;
            const ratio = spike.tps > 0
              ? Math.min(1, Math.sqrt(spike.tps / maxTps))
              : spike.burst > 0
                ? Math.min(0.55, 0.22 + Math.log10(1 + spike.burst) / 8)
                : 0.16;
            const pulseGain = 0.88 + 0.16 * Math.sin(phaseSec * flowSpeed * 1.3 - spike.cx * 0.12);
            const sigma = spike.tps >= PULSE_HOT_TPS ? 3.8 : 4.6;
            const gauss = Math.exp(-(dist * dist) / (2 * sigma * sigma));
            const dip = dist > 3.2 && dist < 8.5 ? -0.18 * ratio * maxAmp * Math.exp(-((dist - 5.2) ** 2) / 5) : 0;
            lift = Math.max(lift, ratio * maxAmp * pulseGain * gauss + dip);
          }
          const y = Math.max(paddingTop, Math.min(height - 2, baseY - lift - dance));
          points.push({ x, y });
        }
        for (const spike of spikes) {
          if (spike.burst <= 0) continue;
          const barRatio = Math.min(1, Math.log10(1 + spike.burst) / Math.log10(1 + maxBurst));
          const barH = Math.max(2.5, Math.round(barRatio * (maxAmp * 0.72) * 10) / 10);
          bars.push({ x: (spike.cx - 1.5).toFixed(1), y: (baseY - barH).toFixed(1), width: '3', height: barH.toFixed(1) });
        }
        const line = smoothSvgPath(points);
        const area = `${line} L${width} ${height} L0 ${height} Z`;
        const tail = points[points.length - 1] ?? { x: width, y: baseY };
        const dot = { cx: Math.max(4, width - 4), cy: tail.y };
        return { line, area, bars, dot };
      }

      function renderMarquee(pulse, currentUsername) {
        const viewport = element('marquee-viewport');
        const marquee = Array.isArray(pulse?.marquee) ? pulse.marquee : [];
        const signature = JSON.stringify([currentUsername, marquee, marquee.length ? '' : t('pulse-idle-marquee')]);
        if (signature === drawnMarquee) return;
        drawnMarquee = signature;
        if (!marquee.length) {
          const empty = document.createElement('span');
          empty.className = 'ladder-marquee-empty';
          empty.setAttribute('data-localized-text', '');
          empty.textContent = t('pulse-idle-marquee');
          viewport.replaceChildren(empty);
          return;
        }
        const buildList = hidden => {
          const list = document.createElement('div');
          list.className = 'ladder-marquee-list';
          if (hidden) list.setAttribute('aria-hidden', 'true');
          for (const item of marquee) {
            const chip = document.createElement('span');
            chip.className = 'ladder-marquee-chip' + (currentUsername && item.username === currentUsername ? ' is-self' : '');
            const tier = pulseTier(item.tps, item.burstTokens);
            const bolt = document.createElement('span');
            bolt.setAttribute('aria-hidden', 'true');
            bolt.textContent = MOOD_ICONS[tier];
            const user = document.createElement('span');
            user.className = 'ladder-marquee-user';
            user.textContent = item.username;
            const sep1 = document.createElement('span');
            sep1.textContent = '·';
            const speed = document.createElement('span');
            speed.className = tier === 'hot' ? 'ladder-marquee-tps' : tier === 'steady' ? 'ladder-marquee-steady' : 'ladder-marquee-online';
            speed.textContent = item.tps > 0 ? formatLiveTps(item.tps, true) : (tier === 'idle' ? t('pulse-idle') : t('pulse-live-badge'));
            chip.append(bolt, user, sep1, speed);
            if (item.burstTokens > 0) {
              const sep2 = document.createElement('span');
              sep2.textContent = '·';
              const burst = document.createElement('span');
              burst.className = 'ladder-marquee-burst';
              burst.textContent = '+' + formatCompactTokens(item.burstTokens);
              chip.append(sep2, burst);
            }
            list.append(chip);
          }
          return list;
        };
        const track = document.createElement('div');
        track.className = 'ladder-marquee-track';
        track.append(buildList(false), buildList(true));
        viewport.replaceChildren(track);
      }

      function paintPulseFrames(timeMs = performance.now()) {
        const phaseSec = reduceMotion?.matches ? 0 : timeMs / 1000;
        const main = mainPulseContext;
        const geo = buildPulseGeometry(main.wave, main.serverTime || Date.now(), 240, 48, {
          phaseSec, tpsHint: main.tps, burstHint: main.burst, tier: main.tier, sampleCount: 44
        });
        const gradId = main.tier === 'hot' ? 'hb-grad-hot' : main.tier === 'steady' ? 'hb-grad-steady' : 'hb-grad-idle';
        const fillId = main.tier === 'hot' ? 'hb-fill-hot' : main.tier === 'steady' ? 'hb-fill-steady' : 'hb-fill-idle';
        const glowEl = element('hb-glow');
        const lineEl = element('hb-line');
        const areaEl = element('hb-area');
        glowEl.setAttribute('d', geo.line);
        glowEl.setAttribute('stroke', `url(#${gradId})`);
        lineEl.setAttribute('d', geo.line);
        lineEl.setAttribute('stroke', `url(#${gradId})`);
        areaEl.setAttribute('d', geo.area);
        areaEl.setAttribute('fill', `url(#${fillId})`);
        const dotEl = element('hb-dot');
        if (geo.dot) {
          dotEl.hidden = false;
          dotEl.setAttribute('cx', geo.dot.cx.toFixed(1));
          dotEl.setAttribute('cy', geo.dot.cy.toFixed(1));
        } else {
          dotEl.hidden = true;
        }
        for (const rowCtx of rowPulseContexts) {
          if (!rowCtx.pulseRow.isConnected || rowCtx.pulseRow.hidden) continue;
          const rGeo = buildPulseGeometry(rowCtx.wave, rowCtx.serverTime, 120, 22, {
            paddingTop: 3, paddingBottom: 4, phaseSec: phaseSec + rowCtx.offset,
            tpsHint: rowCtx.tps, burstHint: rowCtx.burst, tier: rowCtx.tier, sampleCount: 24
          });
          const rowGrad = rowCtx.tier === 'hot' ? 'hb-grad-hot' : rowCtx.tier === 'steady' ? 'hb-grad-steady' : 'hb-grad-idle';
          rowCtx.glow.setAttribute('d', rGeo.line);
          rowCtx.glow.setAttribute('stroke', `url(#${rowGrad})`);
          rowCtx.line.setAttribute('d', rGeo.line);
          rowCtx.line.setAttribute('stroke', `url(#${rowGrad})`);
          rowCtx.area.setAttribute('d', rGeo.area);
          rowCtx.area.setAttribute('fill', rowCtx.tier === 'hot' ? 'url(#hb-fill-hot)' : rowCtx.tier === 'steady' ? 'url(#hb-fill-steady)' : 'url(#hb-fill-idle)');
        }
      }

      function stopPulseLoop() {
        if (pulseAnimFrame !== null) {
          cancelAnimationFrame(pulseAnimFrame);
          pulseAnimFrame = null;
        }
      }

      function ensurePulseLoop() {
        if (group.hidden || document.visibilityState === 'hidden' || lifetime.signal.aborted || !pulseState?.available || reduceMotion?.matches) {
          stopPulseLoop();
          return;
        }
        if (pulseAnimFrame !== null) return;
        const step = nowTs => {
          pulseAnimFrame = null;
          if (group.hidden || document.visibilityState === 'hidden' || lifetime.signal.aborted || !pulseState?.available || reduceMotion?.matches) return;
          if (nowTs - pulseLastDraw >= 32) {
            pulseLastDraw = nowTs;
            paintPulseFrames(nowTs);
          }
          pulseAnimFrame = requestAnimationFrame(step);
        };
        pulseAnimFrame = requestAnimationFrame(step);
      }

      function renderPulseRows(pulse) {
        const usersByName = new Map((pulse?.available && Array.isArray(pulse.users) ? pulse.users : []).map(user => [user.username, user]));
        const serverTime = Number.isFinite(pulse?.serverTime) ? pulse.serverTime : Date.now();
        const nextContexts = [];
        let rowIndex = 0;
        for (const item of element('rows').children) {
          rowIndex += 1;
          const name = item.dataset.username;
          const live = name ? usersByName.get(name) : null;
          const mood = item.querySelector('.ladder-avatar-mood');
          const pulseRow = item.querySelector('.ladder-row-pulse');
          if (!live) {
            applyMoodBadge(mood, 'idle', false);
            if (pulseRow) pulseRow.hidden = true;
            continue;
          }
          const tier = pulseTier(live.tps, live.burstTokens);
          applyMoodBadge(mood, tier, true);
          if (!pulseRow) continue;
          pulseRow.hidden = false;
          pulseRow.dataset.tier = tier;
          pulseRow.querySelector('.ladder-row-tps').textContent = live.tps > 0
            ? formatLiveTps(live.tps, true)
            : (live.burstTokens > 0 ? t('pulse-live-badge') : t('pulse-idle'));
          const burstEl = pulseRow.querySelector('.ladder-row-burst');
          burstEl.textContent = live.burstTokens > 0 ? '+' + formatCompactTokens(live.burstTokens) : '';
          burstEl.hidden = !(live.burstTokens > 0);
          nextContexts.push({
            pulseRow,
            tier,
            wave: live.wave,
            serverTime,
            tps: live.tps,
            burst: live.burstTokens,
            offset: rowIndex * 0.7,
            area: pulseRow.querySelector('.ladder-hb-area'),
            glow: pulseRow.querySelector('.ladder-hb-glow'),
            line: pulseRow.querySelector('.ladder-hb-line')
          });
        }
        rowPulseContexts = nextContexts;
      }

      function renderPulse(username) {
        const liveWrap = element('live');
        if (!pulseState?.available) {
          liveWrap.hidden = true;
          applyMoodBadge(element('account-live'), 'idle', false);
          renderPulseRows(null);
          stopPulseLoop();
          return;
        }
        liveWrap.hidden = false;
        const activeCount = pulseState.activeCount ?? pulseState.users.length;
        const pill = element('live-pill');
        pill.classList.toggle('is-active', activeCount > 0);
        element('live-count').textContent = activeCount > 0
          ? t('pulse-active-users', locale.number(activeCount))
          : t('pulse-standby');
        renderMarquee(pulseState, username);

        const users = pulseState.users ?? [];
        const own = username ? users.find(user => user.username === username) : null;
        const hb = element('heartbeat');
        let targetWave = [], targetTps = 0, targetBurst = 0, labelKey = 'pulse-global-heartbeat';
        if (own) {
          labelKey = 'pulse-my-heartbeat';
          targetWave = own.wave;
          targetTps = own.tps;
          targetBurst = own.burstTokens;
        } else if (users.length > 0) {
          targetWave = users.flatMap(user => user.wave ?? []);
          targetTps = users.reduce((top, user) => Math.max(top, user.tps ?? 0), 0);
          targetBurst = users.reduce((sum, user) => sum + (user.burstTokens ?? 0), 0);
        } else if (username) {
          labelKey = 'pulse-my-heartbeat';
        }
        const ownTier = username ? (own ? pulseTier(own.tps, own.burstTokens) : 'idle') : 'idle';
        applyMoodBadge(element('account-live'), ownTier, Boolean(username));

        const tier = pulseTier(targetTps, targetBurst);
        const hasTraffic = tier !== 'idle';
        const isOnline = Boolean(own || (!username && users.length > 0));
        hb.dataset.tier = tier;
        element('hb-label').textContent = t(labelKey);
        const tierBadge = element('hb-tier');
        tierBadge.textContent = `${MOOD_ICONS[tier]} ${t(MOOD_KEYS[tier])}`;
        element('hb-speed').textContent = targetTps > 0
          ? formatLiveTps(targetTps)
          : (hasTraffic ? t('pulse-live-badge') : (isOnline ? t('pulse-online') : t('pulse-standby')));
        const burstEl = element('hb-burst');
        burstEl.textContent = targetBurst > 0 ? '+' + formatCompactTokens(targetBurst) : '';
        burstEl.hidden = !(targetBurst > 0);

        const serverTime = Number.isFinite(pulseState.serverTime) ? pulseState.serverTime : Date.now();
        mainPulseContext = { tier, wave: targetWave, serverTime, tps: targetTps, burst: targetBurst, active: isOnline || hasTraffic };
        const staticGeo = buildPulseGeometry(targetWave, serverTime, 240, 48, {
          phaseSec: performance.now() / 1000, tpsHint: targetTps, burstHint: targetBurst, tier, sampleCount: 44
        });
        element('hb-bars').replaceChildren(...staticGeo.bars.map(bar => {
          const rect = document.createElementNS(SVG_NS, 'rect');
          rect.setAttribute('x', bar.x);
          rect.setAttribute('y', bar.y);
          rect.setAttribute('width', bar.width);
          rect.setAttribute('height', bar.height);
          rect.setAttribute('rx', '1.2');
          return rect;
        }));
        renderPulseRows(pulseState);
        paintPulseFrames(performance.now());
        ensurePulseLoop();
      }

      function renderRows(rows, username) {
        const signature = JSON.stringify([rankDays, username, rows]);
        if (signature === drawnRows) return;
        const period = periods.find(entry => entry.days === rankDays);
        drawnRows = signature;
        const keyOf = row => JSON.stringify([rankDays, username === row.username, row]);
        rankingNodes = updateList(element('rows'), rows, rankingNodes, keyOf, row => {
          const item = document.createElement('li');
          item.dataset.username = row.username;
          if (username && row.username === username) item.classList.add('ladder-self');
          const rank = document.createElement('span'), name = document.createElement('span'), user = document.createElement('div');
          const total = document.createElement('strong'), time = document.createElement('time');
          rank.className = 'ladder-rank';
          name.className = 'ladder-name';
          user.className = 'ladder-row-user';
          total.className = 'ladder-total';
          time.className = 'ladder-time';
          rank.textContent = locale.number(row.rank);
          name.textContent = row.username;
          name.dir = 'auto';
          name.title = row.username;
          const avatarBox = document.createElement('span');
          avatarBox.className = 'ladder-avatar-box';
          const avatar = document.createElement('span');
          avatar.className = 'ladder-avatar';
          avatar.setAttribute('aria-hidden', 'true');
          setAvatar(avatar, row.username);
          const liveMood = document.createElement('span');
          liveMood.className = 'ladder-avatar-mood';
          liveMood.hidden = true;
          avatarBox.append(avatar, liveMood);
          user.append(avatarBox, name);
          const badge = medal(row.rank, period);
          if (badge) user.append(badge);
          total.textContent = formatTokenMB(row.tokens);
          const uploaded = clock(row.submittedAt);
          if (rankDays !== 1) time.setAttribute('data-localized-text', '');
          time.textContent = rankDays === 1 ? uploaded : t('last-upload-at', uploaded);
          time.dateTime = new Date(row.submittedAt).toISOString();

          const pulseRow = document.createElement('div');
          pulseRow.className = 'ladder-row-pulse';
          pulseRow.dataset.tier = 'idle';
          pulseRow.hidden = true;
          const miniSvg = document.createElementNS(SVG_NS, 'svg');
          miniSvg.setAttribute('class', 'ladder-row-hb');
          miniSvg.setAttribute('viewBox', '0 0 120 22');
          miniSvg.setAttribute('preserveAspectRatio', 'none');
          miniSvg.setAttribute('aria-hidden', 'true');
          const miniArea = document.createElementNS(SVG_NS, 'path');
          miniArea.setAttribute('class', 'ladder-hb-area');
          miniArea.setAttribute('d', '');
          const miniGlow = document.createElementNS(SVG_NS, 'path');
          miniGlow.setAttribute('class', 'ladder-hb-glow');
          miniGlow.setAttribute('d', 'M0 18 L120 18');
          const miniLine = document.createElementNS(SVG_NS, 'path');
          miniLine.setAttribute('class', 'ladder-hb-line');
          miniLine.setAttribute('d', 'M0 18 L120 18');
          miniSvg.append(miniArea, miniGlow, miniLine);
          const stats = document.createElement('span');
          stats.className = 'ladder-row-stats';
          const tpsEl = document.createElement('span');
          tpsEl.className = 'ladder-row-tps';
          const burstEl = document.createElement('span');
          burstEl.className = 'ladder-row-burst';
          stats.append(tpsEl, burstEl);
          pulseRow.append(miniSvg, stats);

          item.append(rank, user, total, time, pulseRow);
          return item;
        });
        for (const avatar of observedAvatars) {
          if (avatar.isConnected) continue;
          avatarObserver.unobserve(avatar);
          observedAvatars.delete(avatar);
        }
      }

      function renderAccount(username, account) {
        const identity = element('mine');
        identity.textContent = username || t('signed-in-label');
        identity.title = username ?? '';
        let hasMedals = false;
        for (const period of periods) {
          const ranking = cachedRankings.get(period.days);
          const row = username && ranking?.day === renderedDay ? ranking.rows.find(row => row.username === username) : null;
          const freshToday = period.days === 1 && account.day === renderedDay && account.submitted &&
            (!row || account.submittedAt >= row.submittedAt);
          const tokens = freshToday ? account.tokens : row?.tokens;
          element('user-rank-' + period.days).textContent = row ? t('rank-position', locale.number(row.rank)) : '—';
          element('user-tokens-' + period.days).textContent = formatTokenMB(tokens);
          const place = row?.rank >= 1 && row.rank <= podium.length ? row.rank : 0;
          if (place) hasMedals = true;
          const slot = element('user-badge-' + period.days);
          if (Number(slot.dataset.place ?? 0) === place) continue;
          slot.dataset.place = place;
          slot.querySelector('.ladder-medal')?.remove();
          if (place) slot.append(medal(place, period));
        }
        setAvatar(element('account-avatar'), username);
        element('medals').hidden = !hasMedals;
      }

      function renderSyncCountdown(snapshot, signedIn, time) {
        const note = element('sync-countdown');
        const button = element('sync-now');
        const uploading = manualSyncPending || Boolean(snapshot?.uploading);
        const queued = Boolean(snapshot?.manualQueued);
        button.disabled = !signedIn || busy || uploading || queued || Boolean(snapshot?.board?.banned) || snapshot?.board?.lockedUntil > time;
        button.classList.toggle('is-queued', queued);
        const queuedNote = queued ? t('sync-queued') : '';
        if (button.title !== (queuedNote || t('sync-now'))) button.title = queuedNote || t('sync-now');
        if (note.title !== queuedNote) note.title = queuedNote;
        let text = '';
        if (signedIn && !snapshot?.board?.banned) {
          if (uploading) text = t('sync-in-progress');
          else if (Number.isFinite(snapshot.nextAutomaticAt)) {
            const seconds = Math.ceil((snapshot.nextAutomaticAt - time) / 1000);
            if (seconds > 0) {
              const hours = Math.floor(seconds / 3600);
              const timer = [Math.floor(seconds / 60) % 60, seconds % 60]
                .map(value => locale.number(value, { minimumIntegerDigits: 2 })).join(':');
              text = t('next-sync-countdown', hours ? locale.number(hours) + ':' + timer : timer);
            } else text = t('sync-waiting');
          }
        }
        if (note.textContent !== (text || '—')) note.textContent = text || '—';
        note.hidden = false;
      }

      function renderSyncResult(snapshot) {
        const note = element('sync-result');
        const lastAt = snapshot?.lastSyncAt;
        const validTime = Number.isFinite(lastAt);
        const text = t('last-sync-time', validTime ? shortClock(lastAt) : '—');
        note.title = validTime ? clock(lastAt) : '';
        if (note.textContent !== text) note.textContent = text;
        const failure = element('sync-error'), record = snapshot?.lastUpload;
        const failed = Number.isFinite(record?.at) && !['accepted', 'initialized', 'duplicate'].includes(record.code);
        const error = failed ? t('last-sync-failed', shortClock(record.at), messageFor(record.code) ?? t('sync-failure-unknown')) : '';
        if (failure.textContent !== error) failure.textContent = error;
        failure.hidden = !failed;
      }

      function render(code = messageCode) {
        messageCode = code;
        if (group.hidden) return;
        renderedDay = boardDay();
        const time = Date.now();
        const { board = {} } = model ?? {};
        const snapshot = session ?? model ?? {};
        const { board: account = board, sessionProblem, initializing, historyProblem } = snapshot;
        const selected = model?.days === rankDays;
        const readyBoard = board.day === renderedDay && Array.isArray(board.rows);
        const live = selected && readyBoard;
        const cached = cachedRankings.get(rankDays);
        const cachedRanking = cached?.day === renderedDay ? cached : null;
        const ranking = live ? board : cachedRanking;
        const freshness = element('freshness');
        const notice = !ranking && !(selected && board.code) ? t('loading-leaderboard') : '';
        if (freshness.textContent !== notice) freshness.textContent = notice;
        freshness.hidden = !notice;
        const refreshedAt = (live ? model.updatedAt : null) ?? cachedRanking?.updatedAt ?? null;
        const refreshTime = element('refresh-time');
        refreshTime.hidden = refreshedAt === null;
        if (refreshedAt !== null) {
          refreshTime.dateTime = new Date(refreshedAt).toISOString();
          refreshTime.title = clock(refreshedAt);
          refreshTime.textContent = t('leaderboard-refreshed-at', shortClock(refreshedAt));
        }
        const signedIn = snapshot.signedIn ?? account.authenticated;
        const checkingLogin = typeof signedIn !== 'boolean';
        element('controls').hidden = false;
        element('sign-in').hidden = checkingLogin || signedIn || Boolean(pendingLogin);
        element('login').disabled = busy;
        element('login-wait').hidden = !pendingLogin;
        element('account').hidden = !signedIn;
        element('logout').disabled = busy;
        const logoutNote = element('logout-pending');
        const logoutText = snapshot.logoutStorageFailed ? t('logout-storage-failed')
          : snapshot.logoutPending ? t('logout-pending') : '';
        if (logoutNote.textContent !== logoutText) logoutNote.textContent = logoutText;
        logoutNote.hidden = !logoutText;
        const boardProblem = selected ? messageFor(board.code) : undefined;
        const sessionStatus = checkingLogin ? t('checking-login') : '';
        const locked = account.lockedUntil > time;
        const authProblem = pendingLogin ? undefined : messageFor(sessionProblem);
        const actionMessage = messageFor(code);
        element('status').textContent = authProblem ?? actionMessage ?? messageFor(loginProblem) ??
          (account.banned ? messageFor('banned') : boardProblem) ??
          (locked ? messageFor('locked') : messageFor(historyProblem) ?? (initializing ? messageFor('history_pending') : sessionStatus));
        element('rank-title').textContent = rankDays === 1 ? t('daily-rank') : t('period-rankings');
        element('rows').setAttribute('aria-label', t(rankDays === 1 ? 'daily-usage-rankings' : 'period-rankings'));
        element('empty').textContent = rankDays === 1 ? t('empty-today') : t('empty-rankings');
        element('empty').hidden = !ranking || ranking.rows.length > 0;
        const username = signedIn ? account.username : '';
        renderRows(ranking?.rows ?? [], username);
        if (signedIn) renderAccount(username, account);
        renderSyncCountdown(snapshot, signedIn, time);
        renderSyncResult(signedIn ? snapshot : null);
        renderPulse(username);
      }

      function scheduleRender() {
        if (group.hidden || lifetime.signal.aborted || leaderboardFrame !== undefined) return;
        leaderboardFrame = requestAnimationFrame(() => { leaderboardFrame = undefined; render(); });
      }

      async function showCache(days = rankDays) {
        if (cachedRankings.get(days)?.day === boardDay()) return;
        const { ranking } = await request('cache', { days });
        if (lifetime.signal.aborted || !ranking || ranking.day !== boardDay()) return;
        const cachedRanking = cachedRankings.get(days);
        if (cachedRanking?.day === ranking.day && cachedRanking.updatedAt >= ranking.updatedAt) return;
        cachedRankings.set(days, ranking);
        scheduleRender();
      }

      async function refreshSession() {
        if (restoringSession || busy || lifetime.signal.aborted) return;
        restoringSession = true;
        const requestedAt = revision;
        const requestedVersion = sessionPushVersion;
        try {
          const result = await request('session');
          if (lifetime.signal.aborted || revision !== requestedAt || requestedVersion !== sessionPushVersion ||
              typeof result.signedIn !== 'boolean') return;
          session = result;
          scheduleRender();
        } finally { restoringSession = false; }
      }

      function cacheRanking(result, days) {
        const { board, updatedAt } = result;
        if (!Number.isSafeInteger(updatedAt) || board?.day !== boardDay() || !Array.isArray(board.rows)) return false;
        const rows = board.rows.map(({ rank, username, tokens, submittedAt }) => ({ rank, username, tokens, submittedAt }));
        cachedRankings.set(days, { day: board.day, rows, updatedAt });
        return true;
      }

      function showState(result, days = rankDays, updateSession = true) {
        model = result.board ? result : { ...model, days, board: { code: result.code } };
        if (typeof result.signedIn === 'boolean' && (updateSession || !session)) session = result;
        cacheRanking(result, days);
        render(result.code ?? '');
        showSummaries();
      }

      function showSummaries() {
        const current = session ?? model, name = current?.signedIn && current.board?.username;
        if (!name) { summaryAccount = ''; summaryUpload = null; return; }
        if (group.hidden) return;
        const day = boardDay(), key = day + '/' + name;
        const uploaded = current.lastUpload?.code === 'accepted' ? current.lastUpload.at : null;
        const first = summaryAccount !== key, justUploaded = !first && uploaded !== null && uploaded !== summaryUpload;
        if (!first && !justUploaded) return;
        summaryAccount = key;
        if (first || uploaded !== null) summaryUpload = uploaded;
        for (const { days } of periods) {
          if (days === rankDays) continue;
          if (justUploaded) summaryQueue.add(days);
          else void showCache(days).then(() => {
            if (summaryAccount === key && cachedRankings.get(days)?.day !== day) summaryQueue.add(days);
          });
        }
      }

      async function refresh(days = rankDays, force = false) {
        if (group.hidden || lifetime.signal.aborted) return;
        if (renderedDay !== boardDay()) render('');
        if (busy) return;
        if (rankingPending) {
          if (!force) return;
          const running = rankingPending;
          try { await running.promise; } catch { /* A manual refresh may retry. */ }
          if (running.days !== days || !running.succeeded) return refresh(days, true);
          return;
        }
        const previous = rankRequests.get(days);
        if (!force && previous?.day === renderedDay && Date.now() < previous.next) return;
        const requestedAt = revision, day = renderedDay;
        const pending = { days, succeeded: false, promise: undefined };
        summaryQueue.delete(days);
        rankingPending = pending;
        pending.promise = (async () => {
          const result = await request('state', { days });
          if (lifetime.signal.aborted) return;
          pending.succeeded = Array.isArray(result.board?.rows);
          const retry = pending.succeeded ? 0 : Math.min((previous?.retry || 500) * 2, 30_000);
          rankRequests.set(days, { day, retry, next: Date.now() + (retry || RANK_REFRESH_MS) });
          if (!pending.succeeded && days !== rankDays) summaryQueue.add(days);
          if (days !== rankDays || revision !== requestedAt) {
            if (cacheRanking(result, days)) scheduleRender();
          } else showState(result, days, false);
        })().finally(() => { rankingPending = undefined; });
        return pending.promise;
      }

      function watchPulse(active) {
        if (!bridge?.request || lifetime.signal.aborted) return;
        if (!active) {
          pulseWatchRenewAt = 0;
          void bridge.request('tps.leaderboard', { action: 'pulse-watch', days: rankDays, active: false }, { timeoutMs: 3000 }).catch(() => {});
          return;
        }
        pulseWatchRenewAt = Date.now() + PULSE_WATCH_RENEW_MS;
        void request('pulse-watch', { active: true }).then(result => {
          if (lifetime.signal.aborted || !result?.pulse) return;
          pulseState = result.pulse;
          scheduleRender();
        });
      }

      function showCachedRanking() {
        render('');
        watchPulse(true);
        if (!pulseState) {
          void request('pulse').then(result => {
            if (lifetime.signal.aborted || !result?.pulse) return;
            pulseState = result.pulse;
            scheduleRender();
          });
        }
        void showCache().then(() => refresh());
        if (!session) void refreshSession();
        showSummaries();
      }

      async function logout() {
        if (busy) return;
        busy = true;
        const requestedAt = ++revision;
        pendingLogin = undefined;
        loginProblem = '';
        clearTimeout(retryLogin);
        let result;
        try {
          render('');
          result = await request('logout');
        } finally { busy = false; }
        if (lifetime.signal.aborted) return;
        if (revision !== requestedAt) { render(); return; }
        if (result.board) showState(result);
        else render(result.code);
        if (result.code === 'signed_out') void refresh();
      }

      async function poll() {
        if (!pendingLogin || lifetime.signal.aborted) return;
        const attempt = pendingLogin;
        const result = await request('poll');
        if (attempt !== pendingLogin || lifetime.signal.aborted) return;
        if (['pending', 'unavailable', 'rate_limited'].includes(result.code) && Date.now() < attempt.expiresAt) {
          if (result.code !== 'pending') render(result.code);
          retryLogin = setTimeout(poll, attempt.interval);
          return;
        }
        revision++;
        pendingLogin = undefined;
        if (result.code === 'signed_in') {
          showState(result);
          void refresh();
        } else {
          loginProblem = Date.now() >= attempt.expiresAt ? 'login_expired' : result.code;
          render(loginProblem);
        }
      }

      if (!bridge?.request) return;
      for (const tab of rankTabs) tab.addEventListener('click', () => {
        const days = Number(tab.dataset.rankDays);
        if (days === rankDays) return;
        rankDays = days;
        for (const tab of rankTabs) tab.setAttribute('aria-pressed', String(Number(tab.dataset.rankDays) === days));
        showCachedRanking();
      });
      group.addEventListener('tps-view-opened', () => {
        showCachedRanking();
        ensurePulseLoop();
      });
      group.addEventListener('tps-view-closed', () => {
        watchPulse(false);
        stopPulseLoop();
      });
      document.addEventListener('visibilitychange', () => {
        if (group.hidden) return;
        const visible = document.visibilityState !== 'hidden';
        watchPulse(visible);
        if (visible) ensurePulseLoop();
        else stopPulseLoop();
      }, { signal: lifetime.signal });
      document.addEventListener('tps-language-changed', () => {
        drawnRows = '';
        drawnMarquee = '';
        rankingNodes.clear();
        for (const { days } of periods) delete element('user-badge-' + days).dataset.place;
        render();
      }, { signal: lifetime.signal });
      element('update').addEventListener('click', async () => {
        const button = element('update');
        button.classList.add('is-busy');
        try { await refresh(rankDays, true); } finally { button.classList.remove('is-busy'); }
      });
      element('sync-now').addEventListener('click', async () => {
        if (element('sync-now').disabled) return;
        const requestedAt = revision;
        manualSyncPending = true;
        render('');
        const result = await request('sync');
        manualSyncPending = false;
        if (lifetime.signal.aborted) return;
        if (revision !== requestedAt) { scheduleRender(); return; }
        if (typeof result.signedIn === 'boolean') session = result;
        render(['locked', 'banned', 'removed'].includes(result.code) || typeof result.signedIn !== 'boolean' ? result.code : '');
        showSummaries();
      });
      element('login').addEventListener('click', async () => {
        if (busy || pendingLogin) return;
        busy = true;
        revision++;
        loginProblem = '';
        let attempt;
        render('');
        try {
          const draft = await request('login');
          if (lifetime.signal.aborted) return;
          if (!draft.loginUrl) {
            loginProblem = draft.code ?? 'unavailable';
            render(loginProblem);
            return;
          }
          attempt = { ...draft, expiresAt: Date.now() + draft.timeout };
          pendingLogin = attempt;
          render('');
          const result = await window.orca.shell.openExternal(attempt.loginUrl);
          if (pendingLogin !== attempt) return;
          if (result?.opened) {
            retryLogin = setTimeout(poll, attempt.interval);
            return;
          }
          pendingLogin = undefined;
          loginProblem = 'browser_unavailable';
          render(loginProblem);
        } catch {
          if (pendingLogin !== attempt) return;
          pendingLogin = undefined;
          loginProblem = 'browser_unavailable';
          render(loginProblem);
        } finally {
          busy = false;
          if (!lifetime.signal.aborted) render();
        }
      });
      element('stop-login').addEventListener('click', async () => {
        revision++;
        const attempt = pendingLogin;
        pendingLogin = undefined;
        loginProblem = '';
        clearTimeout(retryLogin);
        render('');
        if (attempt) await request('cancel', { loginUrl: attempt.loginUrl });
      });
      element('logout').addEventListener('click', () => void logout());
      rankingSubscription = bridge.on?.('tps.leaderboard.session', next => {
        if (lifetime.signal.aborted || typeof next?.signedIn !== 'boolean') return;
        sessionPushVersion += 1;
        session = next;
        scheduleRender();
        showSummaries();
      });
      pulseSubscription = bridge.on?.('tps.leaderboard.pulse', next => {
        if (lifetime.signal.aborted || !next || typeof next !== 'object') return;
        pulseState = next;
        scheduleRender();
      });
      void refreshSession();
      for (const { days } of periods) void showCache(days);
      const interval = setInterval(() => {
        if (group.hidden) return;
        const nowTime = Date.now();
        if (document.visibilityState !== 'hidden' && nowTime >= pulseWatchRenewAt) watchPulse(true);
        const snapshot = session ?? model;
        renderSyncCountdown(snapshot, snapshot?.signedIn ?? snapshot?.board?.authenticated, nowTime);
        void refresh();
        if (!rankingPending) {
          for (const days of summaryQueue) {
            void refresh(days);
            if (rankingPending) break;
          }
        }
      }, 1000);
      window.addEventListener('pagehide', () => {
        watchPulse(false);
        stopPulseLoop();
        lifetime.abort();
        avatarObserver?.disconnect();
        observedAvatars.clear();
        rankingSubscription?.dispose();
        pulseSubscription?.dispose();
        cancelAnimationFrame(leaderboardFrame);
        clearTimeout(retryLogin);
        clearInterval(interval);
      }, { once: true });
    })();
  </script>
</body>
</html>
