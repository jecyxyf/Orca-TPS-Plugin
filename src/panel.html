<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TPS Plugin</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f2f2f7;
      --surface: #ffffff;
      --ink: #1c1c1e;
      --muted: #6d6d75;
      --line: #e5e5ea;
      --purple: #8f32d6;
      --blue: #0066e6;
      --ladder-own-rank: #8b5a05;
      --orange: #b45300;
      --green: #007f48;
      --usage-wave-low: #267456;
      --cache: #9c6500;
      --speed: #c72e3a;
      --speed-bg: #f0f0f3;
      --tag-bg: #ededf2;
      --heat-0: #ebedf0; --heat-1: #bfdbfe; --heat-2: #7fb6fb; --heat-3: #3b82e6; --heat-4: #1d4fb8;
      --proxy-bg: #e5f7ee;
      --button-bg: #e5f0ff;
      --warning-bg: #fff1dc;
      --error: #c8213a;
      --error-bg: #fff0f3;
      --shadow: 0 3px 12px rgb(39 43 72 / 3%);
    }
    html.dark {
      color-scheme: dark;
      --page: #161618;
      --surface: #262628;
      --ink: #f5f5f7;
      --muted: #b4b4be;
      --line: #3a3a3e;
      --purple: #d38aff;
      --blue: #64b0ff;
      --ladder-own-rank: #f0bf63;
      --orange: #ffb340;
      --green: #4ade80;
      --usage-wave-low: #60a589;
      --cache: #e8b65b;
      --speed: #ff6b72;
      --speed-bg: #303034;
      --tag-bg: #343439;
      --heat-0: #2a2a2e; --heat-1: #1e3a5f; --heat-2: #2e5f94; --heat-3: #4a8fd6; --heat-4: #8cc4ff;
      --proxy-bg: #193829;
      --button-bg: #163552;
      --warning-bg: #46321b;
      --error: #ff8fa5;
      --error-bg: #49232d;
      --shadow: 0 3px 12px rgb(0 0 0 / 6%);
    }
    * { box-sizing: border-box; }
    /* Set the reading direction on text leaves so flex and grid keep their order. */
    :where(html:lang(ar), html:lang(ur)) :is([data-i18n], [data-localized-text]) {
      direction: rtl;
      unicode-bidi: isolate;
      text-align: match-parent;
    }
    [hidden] { display: none !important; }
    html { min-width: 0; min-height: 100%; background: var(--page); }
    body {
      margin: 0;
      min-width: 0;
      padding: 16px;
      color: var(--ink);
      background: var(--page);
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 18px; line-height: 1.4; letter-spacing: -.3px; font-weight: 750; }
    .title-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
    .panel-brand { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .panel-title { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
    .panel-title-link {
      display: inline-flex; align-items: center; gap: 8px; min-width: 0;
      color: inherit; text-decoration: none; border-radius: 6px;
      transition: color .15s ease;
    }
    .panel-title-link:hover { color: var(--blue); }
    .panel-title-link:focus-visible, .panel-star-link:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 2px;
    }
    .panel-logo { flex: none; width: 32px; height: 32px; border-radius: 6px; object-fit: contain; }
    .panel-version { flex: none; color: var(--tab-unselected, var(--muted)); font-size: 12px; font-weight: 600; letter-spacing: 0; }
    .panel-star-link {
      display: inline-grid; place-items: center; flex: none;
      width: 24px; height: 24px; border-radius: 999px;
      color: #e09100; text-decoration: none;
      transition: background-color .15s ease, transform .15s ease;
    }
    html.dark .panel-star-link { color: #ffd147; }
    .panel-star-link:hover { background: rgb(245 183 0 / 16%); transform: scale(1.08); }
    .panel-star-svg { width: 18px; height: 18px; overflow: visible; }
    .panel-star-svg .star-core {
      fill: currentColor; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round;
      transform-box: fill-box; transform-origin: center;
      animation: star-pulse 2.8s ease-in-out 3 both;
    }
    .panel-star-svg .star-spark {
      fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round;
      transform-box: fill-box; transform-origin: center;
      animation: star-sparkle 2.8s ease-in-out 3 both;
    }
    .panel-star-svg .star-spark-b { animation-delay: 1.4s; }
    .panel-star-link:hover .star-core, .panel-star-link:hover .star-spark,
    .panel-star-link:focus-visible .star-core, .panel-star-link:focus-visible .star-spark { animation-iteration-count: infinite; }
    @keyframes star-pulse {
      0%, 60%, 100% { transform: scale(1); }
      20% { transform: scale(1.14) rotate(-6deg); }
      38% { transform: scale(.98) rotate(3deg); }
    }
    @keyframes star-sparkle {
      0%, 100% { opacity: .25; transform: scale(.7); }
      35% { opacity: 1; transform: scale(1.1); }
      70% { opacity: .35; transform: scale(.8); }
    }
    .title-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex: 0 1 auto; min-width: 0; }
    .settings-toggle, .settings-close {
      display: inline-grid; place-items: center; flex: none;
      width: 32px; height: 32px; padding: 0;
      border: 0; border-radius: 8px;
      background: transparent; color: var(--icon-color, var(--muted)); cursor: pointer;
      transition: color .15s ease, background-color .15s ease;
    }
    .settings-toggle { color: var(--icon-color, var(--tab-unselected, var(--muted))); }
    .settings-toggle svg, .settings-close svg { width: 16px; height: 16px; transition: transform .22s ease; }
    .settings-toggle:hover, .settings-toggle[aria-expanded="true"], .settings-close:hover {
      background: rgb(128 128 128 / 14%); color: var(--ink);
    }
    .settings-toggle[aria-expanded="true"] svg { transform: scale(1.06); }
    .settings-toggle:focus-visible, .settings-close:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 2px;
    }
    /* No blur or dimming behind the settings sheet, so theme changes can be judged live on the panel. */
    .settings-backdrop {
      position: fixed; inset: 0; z-index: 20;
      display: grid; align-items: start; justify-items: center;
      padding: 16px; overflow-y: auto;
      background: transparent;
    }
    .settings-sheet {
      --surface: #262628;
      --speed-bg: #303034;
      --line: #3a3a3e;
      --ink: #ffffff;
      --muted: rgb(255 255 255 / 80%);
      --blue: #64b0ff;
      --error: #ff8fa5;
      --icon-color: #ffffff;
      color-scheme: dark;
      width: 100%; max-width: 420px; max-height: calc(100dvh - 32px);
      overflow-y: auto; scrollbar-width: thin;
      padding: 14px 16px 16px;
      border: 1px solid var(--line); border-radius: 20px;
      background: var(--surface); color: var(--ink);
      box-shadow: 0 12px 36px rgb(0 0 0 / 28%);
    }
    .settings-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding-bottom: 10px; border-bottom: 1px solid var(--line);
    }
    .settings-title { margin: 0; font-size: 15px; line-height: 1.4; font-weight: 750; color: var(--ink); }
    .settings-close { width: 28px; height: 28px; border-color: transparent; background: transparent; }
    .settings-body { display: grid; gap: 14px; margin-top: 12px; }
    .settings-section { display: grid; gap: 6px; min-width: 0; }
    .settings-label { margin: 0; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .02em; }
    .panel-bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .panel-bg-img {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%; max-width: none; max-height: none;
      object-fit: cover; pointer-events: none; user-select: none;
    }
    .panel-bg-layer::after {
      content: ""; position: absolute; inset: 0;
      background: rgb(242 242 247 / 42%);
      transition: opacity .15s ease;
    }
    html.dark .panel-bg-layer::after { background: rgb(22 22 24 / 52%); }
    body.is-bg-editing .panel-bg-layer::after { opacity: 0; }
    main#panel { position: relative; z-index: 1; }
    .settings-bg-card {
      display: grid; gap: 6px; padding: 11px 12px;
      border: 1px solid var(--line); border-radius: 14px; background: var(--speed-bg);
    }
    .settings-bg-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0;
    }
    .settings-bg-title {
      min-width: 0; margin: 0; color: var(--ink);
      font-size: 13px; font-weight: 700; overflow-wrap: anywhere;
    }
    .bg-editor {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
      padding: 16px; cursor: grab; touch-action: none; user-select: none;
    }
    .bg-editor.is-dragging { cursor: grabbing; }
    .bg-editor-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px;
      max-width: 100%; padding: 8px 10px;
      border: 1px solid rgb(255 255 255 / 22%); border-radius: 16px;
      background: rgb(24 24 28 / 78%); color: #f5f5f7;
      box-shadow: 0 8px 28px rgb(0 0 0 / 32%);
      backdrop-filter: blur(10px);
      cursor: default;
    }
    .bg-editor-hint {
      flex-basis: 100%; margin: 0; text-align: center;
      font-size: 11px; color: rgb(245 245 247 / 82%);
    }
    .bg-editor-zoom {
      min-width: 4.2ch; text-align: center;
      font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .bg-editor-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 30px; padding: 5px 10px; border: 0; border-radius: 9px;
      background: rgb(255 255 255 / 15%); color: #f5f5f7;
      font-size: 12px; font-weight: 650; cursor: pointer;
    }
    .bg-editor-btn:hover:not(:disabled) { background: rgb(255 255 255 / 25%); }
    .bg-editor-btn:disabled { opacity: .45; cursor: default; }
    .bg-editor-btn-primary { background: #0066e6; color: #fff; }
    .bg-editor-btn-primary:hover:not(:disabled) { background: #0066e6; filter: brightness(1.08); }
    .bg-editor-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .settings-bg-actions { display: flex; flex: none; align-items: center; gap: 4px; }
    .settings-bg-btn {
      display: inline-grid; place-items: center; flex: none;
      width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px;
      background: transparent; color: var(--icon-color, var(--muted)); cursor: pointer;
      transition: color .15s ease, background-color .15s ease;
    }
    .settings-bg-btn svg { width: 16px; height: 16px; }
    .settings-bg-btn:hover:not(:disabled) { background: rgb(128 128 128 / 14%); color: var(--ink); }
    .settings-bg-btn:disabled { opacity: .5; cursor: default; }
    .settings-bg-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .settings-bg-hint, .settings-bg-error { margin: 0; font-size: 11px; overflow-wrap: anywhere; }
    .settings-bg-hint { color: var(--muted); }
    .settings-bg-error { color: var(--error); }
    .settings-color-card .settings-bg-row { flex-wrap: wrap; gap: 8px 10px; }
    .settings-color-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 6px 12px; min-width: 0;
    }
    .settings-color-item {
      display: inline-flex; align-items: center; gap: 5px; min-width: 0;
    }
    .settings-color-label {
      min-width: 0; margin: 0; color: var(--muted);
      font-size: 12px; font-weight: 600; overflow-wrap: anywhere;
    }
    .settings-color-input {
      width: 32px; height: 32px; padding: 3px;
      border: 1px solid var(--line); border-radius: 8px;
      background: transparent; cursor: pointer;
    }
    .settings-color-input::-webkit-color-swatch-wrapper { padding: 0; }
    .settings-color-input::-webkit-color-swatch { border: 0; border-radius: 5px; }
    .settings-color-input::-moz-color-swatch { border: 0; border-radius: 5px; }
    .settings-color-input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .settings-card-opacity-row {
      display: grid; grid-template-columns: auto minmax(0, 1fr) 3.2em;
      align-items: center; gap: 8px; margin-top: 2px;
    }
    .settings-card-range { width: 100%; min-width: 0; margin: 0; accent-color: var(--blue); cursor: pointer; }
    .settings-card-range:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .settings-star-grid {
      display: grid; grid-template-columns: auto minmax(0, 1fr) 3.2em;
      align-items: center; gap: 8px; margin-top: 2px;
    }
    .settings-color-value {
      text-align: end; font-size: 11px; font-weight: 600;
      font-variant-numeric: tabular-nums; color: var(--ink);
    }
    .language-picker {
      position: relative; flex: 0 1 140px; min-width: 0;
      --ink: #1c1c1e; --muted: #6d6d75; --blue: #0066e6;
    }
    html.dark .language-picker {
      --ink: #ffffff; --muted: #b4b4be; --blue: #64b0ff;
    }
    .language-toggle, .language-option {
      display: flex; align-items: center; gap: 7px; min-width: 0; min-height: 32px;
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--ink); cursor: pointer;
    }
    .language-toggle { width: 100%; }
    .language-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .language-toggle .language-name { flex: 1; min-width: 0; text-align: start; }
    .language-flag { flex: none; width: 20px; height: 14px; object-fit: contain; }
    .language-toggle svg { flex: none; width: 12px; height: 12px; color: var(--icon-color, var(--muted)); }
    .language-menu {
      position: absolute; z-index: 4; top: calc(100% + 5px); right: 0;
      width: min(216px, calc(100vw - 32px)); padding: 6px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--surface); box-shadow: 0 5px 18px rgb(0 0 0 / 15%);
    }
    .language-search {
      width: 100%; padding: 6px 8px; margin-bottom: 4px;
      border: 1px solid var(--line); border-radius: 6px;
      font: inherit; color: var(--ink); background: var(--page);
    }
    .language-toggle:focus-visible, .language-option:focus-visible, .language-search:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 1px;
    }
    .language-options { max-height: 238px; overflow-y: auto; }
    .language-option { width: 100%; border-color: transparent; text-align: start; }
    .language-option:hover, .language-option[aria-pressed="true"] { background: var(--button-bg); color: var(--blue); }
    .language-message { margin: 4px 6px; color: var(--muted); overflow-wrap: anywhere; }
    .current-updated {
      display: inline-flex; align-items: center; gap: 5px;
      margin: 0; color: var(--tab-unselected, var(--muted));
      font-size: 11px; font-variant-numeric: tabular-nums;
    }
    .current-updated-icon {
      display: inline-grid; place-items: center; flex: none;
      width: 14px; height: 14px;
      color: var(--icon-color, var(--tab-unselected, var(--muted)));
    }
    .current-updated-icon svg { width: 14px; height: 14px; transform-origin: center; }
    .current-updated-icon.is-spinning svg { animation: spin-once .6s cubic-bezier(.22, 1, .36, 1); }
    @keyframes spin-once { to { transform: rotate(360deg); } }
    .refresh {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      flex-shrink: 0; min-height: 34px; padding: 7px 11px; border: 0; border-radius: 13px;
      background: var(--button-bg); color: var(--blue); font-size: 12px; font-weight: 650; cursor: pointer;
    }
    .refresh svg { width: 14px; height: 14px; flex-shrink: 0; }
    .refresh:hover:not(:disabled) { filter: brightness(.96); }
    .refresh:active:not(:disabled) { transform: translateY(1px); }
    .refresh:disabled { cursor: default; opacity: .6; }
    .refresh:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .panel-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 10px; border-bottom: 1px solid var(--line); }
    .panel-tab { min-width: 0; padding: 8px 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--tab-unselected, var(--muted)); font-weight: 650; cursor: pointer; }
    .panel-tab[aria-selected="true"] { border-bottom-color: var(--tab-selected, var(--blue)); color: var(--tab-selected, var(--blue)); }
    .panel-tab:focus-visible, .panel-view:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .panel-view { margin-top: 12px; }
    #usage { display: grid; gap: 8px; }
    #panel:has(> :is(#usage, #current-data, #leaderboard):not([hidden])) {
      display: grid; grid-template: auto auto minmax(0, 1fr) / minmax(0, 1fr);
      block-size: calc(100dvh - 32px);
    }
    #current-data { display: grid; grid-template: auto minmax(96px, 1fr) / minmax(0, 1fr); min-block-size: 0; }
    #usage {
      display: grid;
      grid-template-rows: auto minmax(150px, 1fr) auto;
      gap: 8px;
      min-block-size: 0;
    }
    #war {
      display: flex; flex-direction: column; justify-content: center; gap: 6px;
      padding: 10px 16px; min-block-size: 0;
    }
    .usage-breakdown { display: contents; }
    .usage-ranking { display: flex; flex-direction: column; min-inline-size: 0; min-block-size: 0; }
    .heat { display: flex; flex-direction: column; height: clamp(220px, 32dvh, 296px); min-inline-size: 0; min-block-size: 0; }
    .usage-scroll, #current-scroll, .ladder-ranking-scroll { min-inline-size: 0; overflow-y: auto; scrollbar-width: thin; }
    .usage-scroll { flex: 1; min-block-size: 0; }
    #current-scroll { scrollbar-gutter: stable; padding-inline-end: 6px; }
    :is(.usage-scroll, #current-scroll, .ladder-ranking-scroll):focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
    .section-title { margin: 0; color: var(--ink); font-size: 13px; line-height: 1.6; font-weight: 700; }
    .usage-breakdown .section-title { font-size: 14px; font-weight: 750; line-height: 1.5; }
    .model-dist-head { padding-bottom: 6px; border-bottom: 1px solid var(--line); align-items: center; }
    .stacked-bar {
      display: flex; height: 11px; margin: 8px 0 6px;
      border-radius: 999px; overflow: hidden; gap: 2px;
      background: var(--tag-bg); flex: none;
    }
    .stacked-seg { height: 100%; min-width: 4px; transition: opacity .15s ease; }
    .stacked-seg:first-child { border-start-start-radius: 999px; border-end-start-radius: 999px; }
    .stacked-seg:last-child { border-start-end-radius: 999px; border-end-end-radius: 999px; }
    .share-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; }
    .section-detail { margin: 0; color: var(--muted); font-size: 11px; }
    .ladder-card { padding: 11px 14px; }
    #leaderboard {
      display: flex; flex-direction: column; gap: 8px; min-block-size: 0;
    }
    #leaderboard .ladder-card {
      border-color: color-mix(in srgb, var(--blue) 28%, var(--line));
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 10%), var(--shadow);
    }
    #ladder-controls, .ladder-personal-data { flex: none; }
    #leaderboard #ladder-controls { padding: 12px 13px; }
    .ladder-controls-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0;
    }
    .ladder-controls-main { flex: 1; min-width: 0; }
    .ladder-controls-actions { display: flex; align-items: center; gap: 6px; flex: none; min-height: 28px; }
    .ladder-personal-data { min-width: 0; }
    .ladder-rank-card { display: flex; flex: 1; flex-direction: column; min-block-size: 224px; overflow: hidden; padding: 2px 0 0; }
    .ladder-account-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .ladder-upload-sub {
      display: inline-flex; align-items: center; gap: 4px; min-width: 0;
      color: var(--muted); font-size: 11px; line-height: 1.2; font-variant-numeric: tabular-nums;
    }
    .ladder-upload-sub::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--green);
    }
    .ladder-upload-sub:has([aria-busy="true"])::before { background: var(--blue); }
    .ladder-upload-sub:has(.is-failed) { color: var(--error); }
    .ladder-upload-sub:has(.is-failed)::before { background: var(--error); }
    .ladder-upload-sub .ladder-transfer { width: auto; min-height: 14px; justify-content: center; }
    .ladder-upload-sub .ladder-transfer svg { width: 12.5px; height: 12.5px; }
    .ladder-upload-sub .ladder-toolbar-value { font-size: 11px; line-height: 1.2; color: inherit; }
    .ladder-logout-btn {
      display: inline-grid; place-items: center; flex: none;
      width: 28px; height: 28px; padding: 0;
      border: 0; border-radius: 9px;
      background: var(--tag-bg); color: var(--icon-color, var(--muted));
      cursor: pointer; transition: color .15s ease, background-color .15s ease;
    }
    .ladder-logout-btn svg { width: 14px; height: 14px; }
    .ladder-logout-btn:hover { background: rgb(128 128 128 / 20%); color: var(--ink); }
    .ladder-logout-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .ladder-logout-btn:disabled { cursor: default; opacity: .55; }
    #ladder-ranking-notice { overflow-y: auto; scrollbar-width: thin; }
    #ladder-ranking-content { display: flex; flex: 1; flex-direction: column; min-block-size: 0; }
    #ladder-ranking-content > :not(.ladder-ranking-scroll) { flex: none; }
    .ladder-ranking-scroll { flex: 1; min-block-size: 0; }

    .pose-sprint .ch-body { transform-origin: 20px 24px; animation: ch-sprint-bob .18s ease-in-out infinite alternate; }
    .pose-sprint .ch-flame { transform-origin: 9px 26px; animation: ch-flame .16s ease-in-out infinite alternate; }

    .pose-sprint .ch-fx { animation: ch-wind-streak .28s linear infinite; }
    .pose-run .ch-body { transform-origin: 20px 26px; animation: ch-car-bob .26s ease-in-out infinite alternate; }
    .pose-run .ch-wheel { transform-box: fill-box; transform-origin: center; animation: ch-wheel .36s linear infinite; }
    .pose-run .ch-cape { transform-origin: 15px 17px; animation: ch-cape-flap .28s ease-in-out infinite alternate; }
    .pose-run .ch-fx { animation: ch-wind-streak .42s linear infinite; }
    .pose-walk .ch-body { transform-origin: 20px 24px; animation: ch-walk-bob .26s ease-in-out infinite alternate; }
    .pose-walk .ch-cape { transform-origin: 15px 17px; animation: ch-cape-flap .24s ease-in-out infinite alternate; }
    .pose-walk .ch-leg-a { transform-origin: 20px 25px; animation: ch-leg-a .26s ease-in-out infinite alternate; }
    .pose-walk .ch-leg-b { transform-origin: 20px 25px; animation: ch-leg-b .26s ease-in-out infinite alternate; }
    .pose-walk .ch-fx { animation: ch-wind-streak .36s linear infinite; }
    .pose-idle .ch-body { transform-origin: 20px 30px; animation: ch-breathe 1.2s ease-in-out infinite; }
    .pose-idle .ch-head { transform-origin: 20px 14px; animation: ch-nod 1.8s ease-in-out infinite; }
    .pose-flat .ch-body { transform-origin: 20px 21px; transform: translate(0, 5px) rotate(-86deg) scale(.86); }
    .pose-flat .ch-zzz { animation: ch-float-zzz 2.2s ease-out infinite; }
    @keyframes ch-sprint-bob { 0% { transform: translateY(0) rotate(-3deg); } 100% { transform: translateY(-2.4px) rotate(-6deg); } }
    @keyframes ch-flame { 0% { transform: scaleX(.85); opacity: .85; } 100% { transform: scaleX(1.25); opacity: 1; } }
    @keyframes ch-car-bob { 0% { transform: translateY(0); } 100% { transform: translateY(-1.3px); } }
    @keyframes ch-wheel { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes ch-walk-bob { 0% { transform: translateY(0) rotate(9deg); } 100% { transform: translateY(-3px) rotate(13deg); } }
    @keyframes ch-cape-flap { 0% { transform: rotate(0deg) scaleX(1); } 100% { transform: rotate(12deg) scaleX(1.12); } }
    @keyframes ch-leg-a { 0% { transform: rotate(-38deg); } 100% { transform: rotate(38deg); } }
    @keyframes ch-leg-b { 0% { transform: rotate(38deg); } 100% { transform: rotate(-38deg); } }
    @keyframes ch-breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.91); } }
    @keyframes ch-nod { 0%, 60%, 100% { transform: rotate(0deg); } 80% { transform: rotate(9deg) translateY(1px); } }
    @keyframes ch-wind-streak { 0% { opacity: .9; transform: translateX(0); } 100% { opacity: 0; transform: translateX(-6px); } }
    @keyframes ch-float-zzz { 0% { opacity: 0; transform: translate(0, 2px) scale(.75); } 35% { opacity: 1; } 100% { opacity: 0; transform: translate(3px, -7px) scale(1.08); } }

    .card-aurora {

    @keyframes star-float {
      0% { opacity: 0; transform: translate(0, 4px) scale(.25) rotate(0deg); }
      24% { opacity: 1; transform: translate(calc(var(--dx, 0px) * .35), calc(var(--dy, -12px) * .35)) scale(1.15) rotate(28deg); }
      68% { opacity: .88; transform: translate(calc(var(--dx, 0px) * .8), calc(var(--dy, -12px) * .8)) scale(.95) rotate(68deg); }

  <script>
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const byId = id => document.getElementById(id);
    const reducedMotion = () => Boolean(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches);
    // el('span.a.b', { text, style: { '--x': 1 }, ...attributes }, ...children) builds HTML, or SVG for svg/path/use.
    function el(spec, props, ...children) {
      const [tag, ...classes] = spec.split('.');
      const node = ['svg', 'path', 'use'].includes(tag) ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
      if (classes.length) node.setAttribute('class', classes.join(' '));
      for (const [key, value] of Object.entries(props ?? {})) {
        if (value === undefined || value === null || value === false) continue;
        if (key === 'text') node.textContent = value;
        else if (key === 'style') for (const [name, style] of Object.entries(value)) node.style.setProperty(name, style);
        else node.setAttribute(key, value === true ? '' : value);
      }
      node.append(...children.filter(child => child !== undefined && child !== null && child !== false));
      return node;
    }
    function restartClass(node, name) {
      node.classList.remove(name);
      void node.offsetWidth;
      node.classList.add(name);
    }
    const locale = (() => {
      const bridge = window.orca?.plugin;
      const picker = byId('language-picker'), toggle = byId('language-toggle'), menu = byId('language-menu');
      const search = byId('language-search'), list = byId('language-options'), message = byId('language-message');
      let code = 'en', strings = {}, options = [], saving = false;
      const formatters = new Map();
      const t = (key, ...values) => strings[key]?.replace(/\{(\d+)\}/g, (_, index) => values[index] ?? '') ?? '';
      const normalize = value => value.normalize('NFKD').replace(/\p{M}/gu, '').toLocaleLowerCase().trim();
      const englishNames = new Intl.DisplayNames('en', { type: 'language' });
      const chineseNames = new Intl.DisplayNames('zh-CN', { type: 'language' });

      function messageText(key) {
        message.hidden = !key;
        message.textContent = key ? t(key) : '';
      }

      function renderOptions() {
        const query = normalize(search.value);
        const names = new Intl.DisplayNames(code, { type: 'language' });
        const matches = options.filter(option => [
          option.name, option.code, englishNames.of(option.code), chineseNames.of(option.code), names.of(option.code)
        ].some(value => normalize(value).includes(query)));
        list.replaceChildren(...matches.map(option => el('button.language-option', {
          type: 'button', 'data-locale': option.code, 'aria-pressed': String(option.code === code), disabled: saving
        }, el('img.language-flag', { src: option.flag, alt: '' }), el('bdi.language-name', { lang: option.code, text: option.name }))));
        messageText(matches.length ? '' : 'no-matching-languages');
      }

      function apply({ code: selected, strings: dictionary, options: choices, pluginVersion, icons }) {
        if (typeof pluginVersion === 'string' && pluginVersion) {
          const version = byId('panel-version');
          version.textContent = `v${pluginVersion}`;
          version.hidden = false;
        }
        if (typeof icons === 'string') byId('harness-sprite').innerHTML = icons;
        code = selected;
        strings = dictionary;
        if (choices) options = choices;
        formatters.clear();
        document.documentElement.lang = code;
        for (const root of [document, byId('record-template').content]) {
          for (const element of root.querySelectorAll('[data-i18n]')) element.textContent = t(element.dataset.i18n);
          for (const attribute of ['aria-label', 'title', 'placeholder']) {
            for (const element of root.querySelectorAll(`[data-i18n-${attribute}]`)) {
              element.setAttribute(attribute, t(element.getAttribute(`data-i18n-${attribute}`)));
            }
          }
        }
        const selectedOption = options.find(option => option.code === code);
        if (selectedOption) {
          byId('language-flag').src = selectedOption.flag;
          const name = byId('language-name');
          name.lang = code;
          name.textContent = selectedOption.name;
          toggle.setAttribute('aria-label', t('choose-language', selectedOption.name));
          picker.hidden = false;
        }
        document.dispatchEvent(new Event('tps-language-changed'));
      }

      function setOpen(open, restoreFocus = false) {
        menu.hidden = !open;

        } else if (pose.key === 'run') {
          svg.innerHTML = `${fx}<g class="ch-body">${cape}<path d="M15.5 17.2c0-1 1.1-1.8 4-1.8s4 .8 4 1.8l.8 5.2h-9.6z" fill="${tier.main}"/><rect x="15" y="21" width="9" height="1.4" rx=".7" fill="${tier.trim}"/>${head}<path d="M6 25.5l1.2-3.5 3.5 1.5h15.5l6.5 1.6c1.5.4 2.2 1.4 2.2 2.8v1.8H6z" fill="${tier.main}" stroke="#0f172a" stroke-width=".7" stroke-linejoin="round"/><path d="M23.5 23.5l2.5-3" stroke="#7dd3fc" stroke-width="1.3" stroke-linecap="round"/><line x1="8" y1="26.6" x2="33" y2="26.6" stroke="${tier.trim}" stroke-width="1.2"/><g class="ch-wheel"><circle cx="12.5" cy="29.5" r="2.7" fill="#1e293b" stroke="#cbd5e1" stroke-width=".8"/><circle cx="12.5" cy="29.5" r="1" fill="#94a3b8"/></g><g class="ch-wheel"><circle cx="28" cy="29.5" r="2.7" fill="#1e293b" stroke="#cbd5e1" stroke-width=".8"/><circle cx="28" cy="29.5" r="1" fill="#94a3b8"/></g></g>`;
        } else {
          svg.innerHTML = `${fx}<g class="ch-body">${cape}<g class="ch-leg-b"><rect x="17" y="24" width="3" height="6.2" rx="1.5" fill="#334155"/><ellipse cx="19" cy="30.2" rx="2.4" ry="1.3" fill="#0f172a"/></g><g class="ch-leg-a"><rect x="20" y="24" width="3" height="6.2" rx="1.5" fill="#475569"/><ellipse cx="22.3" cy="30.2" rx="2.4" ry="1.3" fill="#1e293b"/></g><path d="M15 17.5c0-1.2 1.2-2 4.5-2s4.5.8 4.5 2l1 7.2h-11z" fill="${tier.main}"/><path d="M15.2 17.6q4.3 2 8.6 0" stroke="#f8fafc" stroke-width="2.1" stroke-linecap="round" fill="none"/><rect x="14.5" y="22.5" width="10" height="1.6" rx=".8" fill="${tier.trim}"/>${head}</g>`;
        }
        return svg;
      }

      function ecgWaveSvg(pose, bpm, rank) {
        const id = `ecg-${++ecgCounter}`;
        const color = royalTierOf(rank)?.line ?? pose.color;
        const w = 220, h = 28, mid = 17;
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('class', 'hb-ecg-svg');
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.setAttribute('aria-hidden', 'true');
        if (bpm <= 0) {
          svg.innerHTML = `<line x1="0" y1="${mid}" x2="${w}" y2="${mid}" stroke="${color}" stroke-width="1.8" opacity=".55"/>`;
          return svg;
        }
        const n = pose.spikes, segW = w / n;
        const amp = pose.key === 'sprint' ? 14 : pose.key === 'run' ? 12 : pose.key === 'walk' ? 10 : 7;
        let d = `M0,${mid}`;
        for (let i = 0; i < n; i++) {
          const c = i * segW + segW * 0.55;
          d += ` L${(c - 10).toFixed(1)},${mid} L${(c - 7).toFixed(1)},${mid - 2.2} L${(c - 4.5).toFixed(1)},${mid} L${(c - 2.5).toFixed(1)},${mid + 3.2} L${c.toFixed(1)},${(mid - amp).toFixed(1)} L${(c + 2.8).toFixed(1)},${mid + 4.5} L${(c + 5).toFixed(1)},${mid} L${(c + 8.5).toFixed(1)},${mid - 2.8} L${(c + 12).toFixed(1)},${mid}`;
        }
        d += ` L${w},${mid}`;
        svg.innerHTML = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${color}" stop-opacity=".18"/><stop offset="85%" stop-color="${color}" stop-opacity=".95"/><stop offset="100%" stop-color="#fff" stop-opacity="1"/></linearGradient></defs><path d="${d}" fill="none" stroke="${color}" stroke-width="1.2" opacity=".24"/><path class="hb-ecg-scan" d="${d}" fill="none" stroke="url(#${id})" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140 80" style="--ecg-dur:${pose.ecgDur}"/>`;
        return svg;
      }

      function heartbeatStage(row, now) {
        const bpm = row._hb?.bpm ?? recentHeartbeatBpm(row.recent?.points, now);
        const pose = row._hb?.pose ?? poseFromBpm(bpm);
        const stage = document.createElement('div');
        stage.className = heartbeatObserver ? 'hb-stage' : 'hb-stage is-in-view';
        const runner = document.createElement('div');
        runner.className = 'hb-runner-box';
        runner.append(royalCharacterSvg(pose, row.rank));
        const ecgWrap = document.createElement('div');
        ecgWrap.className = 'hb-ecg-wrap';
        ecgWrap.append(ecgWaveSvg(pose, bpm, row.rank));
        const meta = document.createElement('div');
        meta.className = 'hb-meta-right';
        meta.title = t(pose.i18n);
        const bpmEl = document.createElement('span');
        bpmEl.className = `hb-bpm ${pose.cls}`;
        const heart = document.createElement('span');
        heart.className = 'hb-heart';
        heart.style.setProperty('--beat-dur', pose.beatDur);
        heart.textContent = '♥';
        const num = document.createElement('span');
        num.className = 'hb-bpm-num';
        num.textContent = String(bpm);
        bpmEl.append(heart, ' ', num);
        meta.append(bpmEl);
        stage.append(runner, ecgWrap, meta);
        heartbeatObserver?.observe(stage);
        return stage;
      }

      const usageChartLabel = () => t(rankDays === 1 ? 'leaderboard-five-minute-usage' : 'leaderboard-daily-usage');
      const speedText = value => Number.isFinite(value) ? `${locale.number(value, {
        maximumFractionDigits: 1, ...(value >= 10_000 ? { notation: 'scientific' } : {}) })} tokens/s` : '—';
      const leaderboardTime = time => locale.date(time, { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
      const toolText = (model, cli) => `${model ?? '—'} · ${Object.hasOwn(AGENT_LABELS, cli) ? AGENT_LABELS[cli] : cli ?? '—'}`;
      const chartVerticalPadding = 4;

      function dailyUsagePoints(daily, left, days) {
        if (!Array.isArray(daily)) return [];
        const totals = new Map(daily.map(point => [point.at ?? point.day, point]));
        return Array.from({ length: days }, (_, offset) => {
          const at = left + offset * DAY_MS;
          const day = new Date(at + 8 * 60 * 60 * 1000).toISOString().slice(0, 10);
          const value = totals.get(at) ?? totals.get(day);
          return { day, tokens: value?.tokens ?? 0,
            ...(value?.day && Number.isFinite(value.at) ? { packetDay: value.day } : {}),
            ...(typeof value?.complete === 'boolean' ? { at, complete: value.complete } : {}) };
        });
      }

      function dailyUsagePath(points, x, y) {
        const levels = points.map(y);
        const changes = levels.slice(1).map((level, index) => level - levels[index]);
        const tangents = levels.map((_, index) => {
          const before = changes[index - 1] ?? changes[index];
          const after = changes[index] ?? before;
          // Keep peaks, valleys, and flat stretches within the recorded range.
          return before * after > 0 ? 2 * before * after / (before + after) : 0;
        });
        const line = new Path2D();
        let startX = x(points[0]);
        line.moveTo(startX, levels[0]);
        for (let index = 1; index < points.length; index++) {
          const endX = x(points[index]);
          const third = (endX - startX) / 3;
          line.bezierCurveTo(
            startX + third, levels[index - 1] + tangents[index - 1] / 3,
            endX - third, levels[index] - tangents[index] / 3,
            endX, levels[index]
          );
          startX = endX;
        }
        return line;
      }

      function paintUsagePath(ctx, line, baseline, firstX, lastX) {
        const colors = window.getComputedStyle(document.documentElement);
        const low = colors.getPropertyValue('--usage-wave-low').trim();
        const high = colors.getPropertyValue('--speed').trim();

        const area = new Path2D(line);
        area.lineTo(lastX, baseline);
        area.lineTo(firstX, baseline);
        area.closePath();

        const gradient = ctx.createLinearGradient(0, baseline, 0, chartVerticalPadding);
        gradient.addColorStop(0, low);
        gradient.addColorStop(1, high);
        ctx.strokeStyle = ctx.fillStyle = gradient;
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.fill(area);
        ctx.restore();
        ctx.stroke(line);
      }

      function usageCard(row, now, _animateAfter, windowStart) {
        const { recent, daily } = row;
        const container = document.createElement('div');
        container.className = 'ladder-recent';
        const byDay = rankDays > 1;
        const dateLabel = time => locale.date(time, { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric' });
        const timeOf = point => byDay ? point.at : point.submittedAt;
        const tokensOf = point => byDay ? point.tokens : point.deltaTokens;
        const span = byDay ? (rankDays - 1) * DAY_MS : RECENT_STATS_MS;
        const left = byDay ? windowStart : now - span;
        const points = byDay ? dailyUsagePoints(daily, left, rankDays) : recent?.points ?? [];
        const latestPoint = points.at(-1);
        const pointTitle = point => byDay ? (point.packetDay
          ? `${dateLabel(Date.parse(point.packetDay + 'T00:00:00+08:00'))} · ${formatMillionTokens(point.tokens)}`
          : `${dateLabel(point.at)} – ${dateLabel(point.at + DAY_MS)} · ${formatMillionTokens(point.tokens)}`) +
          (point.complete === false ? ` · ${t('leaderboard-usage-incomplete')}` : '')
          : `${shortClock(point.submittedAt)} · ${formatMillionTokens(point.deltaTokens)} · ${speedText(point.avgTps)}`;
        const emptyTitle = byDay ? usageChartLabel() : `${usageChartLabel()}\n${formatMillionTokens(0)} · ${speedText(0)}`;
        if (byDay) {
          const chart = document.createElement('canvas');
          chart.className = 'ladder-chart';
          chart.width = 320;
          chart.height = 42;
          chart.setAttribute('role', 'img');
          chart.setAttribute('aria-label', usageChartLabel());
          chart.title = latestPoint ? `${usageChartLabel()}\n${pointTitle(latestPoint)}` : emptyTitle;
          container.append(chart);
          const axis = document.createElement('div');
          axis.className = 'ladder-chart-axis';
          for (const offset of [0, Math.round((rankDays - 1) / 2), rankDays - 1]) {
            const label = document.createElement('span');
            label.textContent = dateLabel(left + offset * DAY_MS + (rankingMode === 'hourly' ? DAY_MS - 1 : 0));
            axis.append(label);
          }
          container.append(axis);
          if (!latestPoint) return container;
          const maximum = Math.max(1, ...points.map(tokensOf));
          const tierColor = royalTierOf(row.rank)?.line ?? '#64b0ff';
          let hoverIndex = -1;
          const paint = (frameNow = (typeof performance !== 'undefined' ? performance.now() : 0)) => {
            const ctx = chart.getContext('2d');
            if (!ctx) return;
            const dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
            const rect = chart.getBoundingClientRect?.();
            const cw = Math.max(120, Math.round(rect?.width || 320));
            const ch = Math.max(36, Math.round(rect?.height || 42));
            if (chart.width !== cw * dpr || chart.height !== ch * dpr) {
              chart.width = cw * dpr;
              chart.height = ch * dpr;
            }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cw, ch);
            const motion = typeof chartMotionAllowed === 'function' && chartMotionAllowed();
            const introElapsed = typeof chartIntroAt === 'number' ? Math.max(0, frameNow - chartIntroAt) : Infinity;
            const elapsed = Math.max(0, frameNow);
            if (rankDays === 7) {
              const pad = 6, base = ch - pad, spanH = ch - pad * 2;
              const x = point => pad + (cw - pad * 2) * Math.min(1, (timeOf(point) - left) / span);
              const y = point => pad + spanH * (1 - tokensOf(point) / maximum);
              const line = dailyUsagePath(points, x, y);
              const area = new Path2D(line);
              area.lineTo(x(latestPoint), base);
              area.lineTo(x(points[0]), base);
              area.closePath();
              const intro = motion ? Math.min(1, introElapsed / 550) : 1;
              const reveal = 1 - Math.pow(1 - intro, 3);
              ctx.save();
              if (reveal < 1) {
                ctx.beginPath();
                ctx.rect(0, 0, pad + (cw - pad * 2) * reveal, ch);
                ctx.clip();
              }
              const gradient = ctx.createLinearGradient(0, pad, 0, base);
              gradient.addColorStop(0, tierColor + '66');
              gradient.addColorStop(1, tierColor + '05');
              ctx.fillStyle = gradient;
              ctx.fill(area);
              ctx.save();
              ctx.shadowColor = tierColor;
              ctx.shadowBlur = 7;
              ctx.strokeStyle = tierColor;
              ctx.lineWidth = 2;
              ctx.stroke(line);
              ctx.restore();
              if (motion && intro >= 1) {
                const sweep = (elapsed % 3200) / 3200;
                if (sweep < 0.72) {
                  const sx = pad + (cw - pad * 2) * (sweep / 0.72);
                  const sg = ctx.createLinearGradient(sx - 34, 0, sx + 34, 0);
                  sg.addColorStop(0, tierColor + '00');
                  sg.addColorStop(0.5, '#ffffffcc');
                  sg.addColorStop(1, tierColor + '00');
                  ctx.strokeStyle = sg;
                  ctx.lineWidth = 2.6;
                  ctx.stroke(line);
                }
              }
              ctx.restore();
              const peak = points.reduce((best, p, i) => tokensOf(p) > tokensOf(points[best]) ? i : best, 0);
              if (motion && intro >= 1) {
                const pulse = (elapsed % 1800) / 1800;
                const ex = x(latestPoint), ey = y(latestPoint);
                ctx.save();
                ctx.beginPath();
                ctx.arc(ex, ey, 3.1 + pulse * 6.5, 0, Math.PI * 2);
                ctx.strokeStyle = tierColor;
                ctx.globalAlpha = (1 - pulse) * 0.68;
                ctx.lineWidth = 1.4;
                ctx.stroke();
                ctx.restore();
              }
              for (const idx of new Set([peak, points.length - 1, ...(hoverIndex >= 0 ? [hoverIndex] : [])])) {
                if (motion && x(points[idx]) > pad + (cw - pad * 2) * reveal + 2) continue;
                ctx.beginPath();
                ctx.arc(x(points[idx]), y(points[idx]), idx === hoverIndex ? 4.2 : 3.1, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 1.8;
                ctx.strokeStyle = tierColor;
                ctx.stroke();
              }
              return;
            }
            const padX = 4, padT = 3, base = ch - 3, spanH = base - padT;
            const cols = points.length, dotRows = 6;
            const step = (cw - padX * 2) / cols;
            const rowStep = spanH / dotRows;
            const radius = Math.min(3.1, Math.max(1.7, Math.min(step * 0.27, rowStep * 0.34)));
            const dark = typeof document !== 'undefined' && document.documentElement?.classList?.contains('dark');
            const dimColor = dark ? 'rgba(255, 255, 255, 0.12)' : 'rgba(28, 28, 30, 0.11)';
            const peakGlow = dark ? '#ffffff' : '#1c1c1e';
            const sweepCol = motion ? (((elapsed % 3800) / 3800) * (cols + 8) - 4) : -100;
            for (let i = 0; i < cols; i++) {
              const val = tokensOf(points[i]);
              const targetLit = val > 0 ? Math.max(1, Math.round((val / maximum) * dotRows)) : 0;
              const colIntro = motion ? Math.max(0, Math.min(1, (introElapsed - i * 14) / 240)) : 1;
              const lit = Math.round(targetLit * (1 - Math.pow(1 - colIntro, 2)));
              const cx = padX + step * (i + 0.5);
              const scanBoost = motion ? Math.max(0, 1 - Math.abs(i - sweepCol) / 2.6) : 0;
              for (let r = 0; r < dotRows; r++) {
                const cy = base - rowStep * (r + 0.5);
                const active = r < lit;
                ctx.beginPath();
                ctx.arc(cx, cy, radius * (active && scanBoost > 0.2 ? 1 + scanBoost * 0.14 : 1), 0, Math.PI * 2);
                if (!active) ctx.fillStyle = dimColor;
                else if (i === hoverIndex) ctx.fillStyle = peakGlow;
                else {
                  const twinkle = motion ? 0.72 + 0.28 * Math.sin(elapsed * 0.0032 + i * 0.9 + r * 1.45) : 1;
                  const baseAlpha = r >= dotRows - 2 ? 1 : 0.68;
                  ctx.fillStyle = tierColor;
                  ctx.globalAlpha = Math.min(1, baseAlpha * twinkle + scanBoost * 0.32);
                }
                ctx.fill();
                ctx.globalAlpha = 1;
              }
            }
          };
          usagePainters.set(chart, paint);
          paint();
          if (typeof chartObserver !== 'undefined' && chartObserver) chartObserver.observe(chart);
          if (typeof requestAnimationFrame === 'function') requestAnimationFrame(paint);
          chart.addEventListener('pointermove', event => {
            const rect = chart.getBoundingClientRect();
            const frac = Math.max(0, Math.min(1, (event.clientX - rect.left) / Math.max(1, rect.width)));
            const nextIndex = Math.round(frac * (points.length - 1));
            chart.title = pointTitle(points[nextIndex]);
            if (nextIndex !== hoverIndex) {
              hoverIndex = nextIndex;
              paint();
            }
          });
          chart.addEventListener('pointerleave', () => {
            chart.title = `${usageChartLabel()}\n${pointTitle(latestPoint)}`;
            if (hoverIndex !== -1) {
              hoverIndex = -1;
              paint();
            }
          });
        } else {
          const meta = document.createElement('div'), tools = document.createElement('span');
          const speed = document.createElement('strong');
          meta.className = 'ladder-recent-meta';
          tools.className = 'ladder-recent-tools';
          const hasTool = Boolean(recent?.topModel || recent?.topCli);
          if (hasTool) {
            const label = toolText(recent?.topModel, recent?.topCli);
            tools.title = label;
            if (typeof document.createElementNS === 'function' && recent?.topCli) {
              tools.append(createHarnessIconBadge(recent.topCli, 16));
              if (recent?.topModel) {
                const nameText = document.createElement('span');
                nameText.textContent = recent.topModel;
                tools.append(nameText);
              }
            } else {
              tools.textContent = recent?.topModel || label;
            }
          }
          speed.className = 'ladder-recent-speed';
          speed.textContent = speedText(latestPoint?.avgTps ?? 0);
          speed.title = t('leaderboard-average-speed');
          meta.append(tools, speed);
          const stage = heartbeatStage(row, now);
          stage.title = latestPoint ? `${usageChartLabel()}\n${pointTitle(latestPoint)}` : emptyTitle;
          container.append(meta, stage);
        }
        return container;
      }

      function renderRows(rows, username, ranking) {
        const now = Date.now();
        const speedBoard = rankDays === 0;
        const todayBoard = rankDays === 1;
        if (todayBoard) lastHeartbeatTick = now;
        nextRecentExpiry = Infinity;
        if (speedBoard) {
          const offset = ranking?.clockOffset ?? 0;
          const expiry = ({ submittedAt }) => {
            if (!Number.isFinite(ranking?.windowStart)) return submittedAt + DAY_MS - offset;
            if (rankingMode === 'hourly') return Math.floor(submittedAt / HOUR_MS) * HOUR_MS + DAY_MS + HOUR_MS - offset;
            return Math.floor((submittedAt + 8 * HOUR_MS) / DAY_MS) * DAY_MS + DAY_MS - 8 * HOUR_MS - offset;
          };
          rows = rows.filter(row => expiry(row) > now)
            .map((row, index) => ({ ...row, rank: index + 1 }));
          for (const row of rows) nextRecentExpiry = Math.min(nextRecentExpiry, expiry(row));
        }
        rows = rows.map(row => {
          const points = row.recent
            ? row.recent.points.filter(point => point.submittedAt > now - RECENT_STATS_MS && point.submittedAt <= now)
            : [];
          if (points.length) nextRecentExpiry = Math.min(nextRecentExpiry, points[0].submittedAt + RECENT_STATS_MS);
          const updated = row.recent ? { ...row, recent: { ...row.recent, points } } : row;
          if (!todayBoard) return updated;
          const bpm = recentHeartbeatBpm(points, now);
          return { ...updated, _hb: { bpm, pose: poseFromBpm(bpm) } };
        });
        const signature = JSON.stringify([rankingMode, rankDays, ranking?.windowStart, username, rows]);
        if (signature === drawnRows) return;
        drawnRows = signature;
        const keyOf = row => JSON.stringify([
          rankingMode, rankDays, ranking?.windowStart, username === row.username,
          todayBoard ? row._hb?.pose?.key : null,
          { ...row, _hb: undefined }
        ]);
        rankingNodes = updateList(element('rows'), rows, rankingNodes, keyOf, row => {
          const item = document.createElement('li');
          if (username && row.username === username) item.classList.add('ladder-self');
          if (speedBoard) item.classList.add('ladder-speed-row');
          const rank = document.createElement('span'), name = document.createElement('span'), user = document.createElement('div');
          const total = document.createElement('strong'), time = document.createElement('time');
          rank.className = 'ladder-rank';
          if (row.rank >= 1 && row.rank <= 3) rank.dataset.place = String(row.rank);
          name.className = 'ladder-name';
          user.className = 'ladder-row-user';
          total.className = 'ladder-total';
          time.className = 'ladder-time';
          rank.textContent = locale.number(row.rank);
          name.textContent = row.username;
          name.dir = 'auto';
          name.title = row.username;
          const avatar = document.createElement('span');
          avatar.className = 'ladder-avatar';
          avatar.setAttribute('aria-hidden', 'true');
          setAvatar(avatar, row.username);
          const badge = rankBadge(row.rank, speedBoard);
          if (badge) user.append(badge);
          user.append(avatar, name);
          total.textContent = speedBoard ? speedText(row.avgTps) : formatMillionTokens(row.tokens);
          if (speedBoard) total.title = t('leaderboard-average-speed');
          const shownAt = speedBoard ? row.submittedAt : (row.lastUploadAt ?? row.submittedAt);
          const shownTime = speedBoard ? leaderboardTime(shownAt) : clock(shownAt);
          time.setAttribute('data-localized-text', '');
          time.textContent = (speedBoard ? shownTime : t('last-upload-at', shownTime)) +
            (row.complete === false ? ` · ${t('leaderboard-usage-incomplete')}` : '');
          time.dateTime = new Date(shownAt).toISOString();
          item.append(rank, user, total);
          if (speedBoard) {
            const meta = document.createElement('div');
            const tools = document.createElement('span');
            meta.className = 'ladder-recent ladder-recent-meta';
            tools.className = 'ladder-recent-tools';
            if (row.topModel || row.topCli) {
              const label = toolText(row.topModel, row.topCli);
              tools.title = label;
              if (typeof document.createElementNS === 'function' && row.topCli) {
                tools.append(createHarnessIconBadge(row.topCli, 16));
                if (row.topModel) {
                  const nameText = document.createElement('span');
                  nameText.textContent = row.topModel;
                  tools.append(nameText);
                }
              } else {
